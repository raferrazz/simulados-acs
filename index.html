{s:1,n:54,q:"As coordenadas geográficas integram o registro dos endereços na coleta. Nas áreas rurais, a captura das coordenadas geográficas dos estabelecimentos:",a:["é automática, disparada pelo satélite a distância","deve ser realizada manualmente, com o Recenseador posicionado com o DMC no local correto antes de permitir o registro do ponto","é feita apenas no posto censitário, a partir do MME","dispensa o uso do mapa em papel","é opcional quando o endereço possui número"],c:1,e:"O material determina captura manual: o Recenseador posiciona-se no local correto; como componente do endereço, a coordenada deve representar o ponto de acesso — o ideal é a entrada da edificação que representa a sede, caso haja."},
{s:1,n:55,q:"Em um setor rural, o Recenseador encontra uma unidade cujo endereço não possui número nem complemento que permitam localizá-la. Nesse caso:",a:["a unidade deve ficar sem registro de endereço","a unidade deve ser excluída da lista prévia","deve-se registrar o nome do morador como referência, com autorização verbal","o ponto de referência só é admitido em áreas urbanas","o registro de ponto de referência é obrigatório, e não é permitido identificar pessoas nos componentes do endereço"],c:4,e:"O ponto de referência é obrigatório quando não há número ou complemento que localize a unidade; identificar pessoas nos endereços fere o sigilo estatístico, obrigação legal do IBGE. Exemplos: 'próximo à caixa d'água', 'primeira casa após a ponte'."},
{s:1,n:56,q:"Durante o percurso, o Recenseador avista um sítio com horta, árvores frutíferas e algumas galinhas, cujo proprietário informa que a produção se destina apenas ao lazer e ao deleite da família, sem venda ou dependência para subsistência. Diante disso, a propriedade:",a:["deve ser recenseada, pois há animais e culturas","é estabelecimento agropecuário, por se localizar em área rural","é estabelecimento agropecuário apenas porque há galinhas","não é unidade recenseável: nada deve ser coletado","deve ser recenseada com questionário reduzido"],c:3,e:"Produção para deleite, passatempo ou lazer não configura atividade investigada pelo Censo. Sem finalidade de venda ou subsistência, não há unidade recenseável — a classificação, porém, é feita pelo questionário de abordagem, não 'olhando pela cerca'."},
{s:1,n:57,q:"A classificação de uma propriedade como unidade recenseável ou não recenseável, no Censo Agropecuário:",a:["é decisão direta do Recenseador, com base na observação da cerca","é realizada pelo questionário de abordagem inicial, e não por decisão direta do Recenseador","é feita pela supervisão, antes da ida a campo","depende do tamanho da propriedade","é feita pelo ACS a partir das imagens do DMC"],c:1,e:"O material é enfático: não é possível identificar 'apenas olhando através da cerca'; o Recenseador deve sempre perguntar à pessoa encontrada, e a classificação é feita pelo questionário de abordagem inicial."},
{s:1,n:58,q:"Determinados estabelecimentos exigem critérios específicos de classificação na coleta. O pesque-pague será considerado estabelecimento agropecuário:",a:["em qualquer caso, pois explora recurso pesqueiro","somente se revender os peixes para outras unidades","apenas se estiver localizado em área urbana","nunca, pois pesca não é atividade aquícola","quando nele houver criação e engorda de peixes; se houver somente compra de peixes criados, não deve ser considerado"],c:4,e:"Regra do material: há criação/engorda de peixes → estabelecimento agropecuário; apenas compra de peixes criados → não."},
{s:1,n:59,q:"Um estabelecimento agropecuário tem área contínua que se estende por dois setores censitários do mesmo município. Ele deverá ser recenseado:",a:["metade em cada setor","no setor onde estiver localizada a sua Sede; na inexistência da Sede, no setor em que estiver a maior parte de suas terras","no setor em que estiver a maior parte das terras, sempre","nos dois setores, com duplicação das informações","no setor escolhido pelo informante"],c:1,e:"Sede é o local destinado à administração dos trabalhos, dentro da área do estabelecimento (muitas vezes, a residência do produtor). Setores de municípios distintos: toda a produção é computada no município da Sede. Sem Sede: maior parte das terras."},
{s:1,n:60,q:"Um mesmo produtor explora, em um único município, áreas separadas entre si. Essas áreas somente poderão ser consideradas um único estabelecimento agropecuário se, simultaneamente:",a:["tiverem a mesma forma jurídica","estiverem no mesmo município, utilizarem os mesmos recursos técnicos e os mesmos recursos humanos e estiverem subordinadas a uma única administração","estiverem a menos de 10 km de distância entre si","forem atravessadas pelo mesmo rio","tiverem áreas superiores a 50 ha cada"],c:1,e:"São as quatro condições cumulativas do material (município, recursos técnicos, recursos humanos, administração única). Se qualquer uma falhar, cada área é outro estabelecimento. Rios, estradas ou ferrovias cortando as terras NÃO caracterizam descontinuidade."},

/* ==================== SIMULADO 2 ==================== */
{s:2,n:1,t:2,q:"No texto, a informação de que parte da queda do desmatamento se explica pelo El Niño funciona como:",a:["argumento que reforça a tese das autoridades ambientais","digressão sem relação com o tema central","ressalva que relativiza a leitura comemorativa do dado","conclusão que encerra a matéria","citação de opinião anônima"],c:2,e:"A menção ao El Niño introduz uma ressalva: parte do resultado não decorre da ação humana (fiscalização/crédito), o que impede leitura comemorativa linear — por isso os cientistas 'pedem cautela'."},
{s:2,n:2,t:2,q:"No trecho final, o autor esclarece o que entende por 'política de Estado'. A expressão 'isto é', empregada no final do texto, serve para:",a:["introduzir uma explicação que explicita o sentido da expressão anterior","indicar oposição entre duas ideias","marcar a conclusão do texto","indicar a ordem temporal dos fatos","apresentar hipótese contrária à sustentada"],c:0,e:"'Isto é' é operador de reformulação explicativa: explicita o que o autor entende por 'política de Estado' — ações contínuas, financiadas e independentes dos ciclos políticos."},
{s:2,n:3,t:2,q:"Os pesquisadores ouvem com reservas a comemoração do resultado apresentado. No texto, a palavra 'mascarar' equivale a:",a:["revelar","destacar","esconder","corrigir","exagerar"],c:2,e:"Mascarar = disfarçar, ocultar: uma estação seca favorável pode esconder (fazer parecer melhor) a tendência real de longo prazo."},
{s:2,n:4,q:"Complete corretamente: 'O relatório foi entregue ___ supervisora do posto, que o remeteu ___ diretoria estadual.'",a:["à ... à","a ... a","à ... a","a ... à","às ... à"],c:0,e:"Antes de substantivos femininos determinados — a supervisora, a diretoria — a preposição 'a' exigida pelo verbo funde-se com o artigo 'a', o que requer o acento indicativo de crase: entregue à supervisora; remeteu à diretoria."},
{s:2,n:5,q:"Na revisão de um comunicado interno do posto, o ACS verifica a concordância verbal de cada frase. Assinale a frase com concordância verbal CORRETA:",a:["Haverão novos treinamentos na próxima semana.","Existia dúvidas sobre o perímetro do setor.","Fizeram cinco dias sem transmissão de dados.","Devem existir questões pendentes no questionário do produtor.","Faziam dois anos que o posto havia sido instalado."],c:3,e:"'Existir' é verbo pessoal: concorda com o sujeito e aceita auxiliar no plural — devem existir (questões pendentes). 'Haver' (existir) e 'fazer' (tempo decorrido) são impessoais: haverá treinamentos, fez cinco dias, fazia dois anos; e 'existia' no singular não concorda com 'dúvidas'."},
{s:2,n:6,q:"Precisão gramatical é requisito nos registros oficiais da operação. Assinale a alternativa correta quanto à concordância nominal:",a:["É proibido a entrada de estranhos no posto.","Segue anexo a documentação da coleta.","Ficou meio nervoso com o alerta do sistema.","Os dois recenseadores ficaram quite após a conversa.","A diretora estava meia decepcionada com o resultado."],c:2,e:"'Meio' intensificando adjetivo é advérbio: invariável (meio nervoso). Com artigo, 'proibida a entrada'; 'anexo' concorda (segue anexa a documentação); 'quites' no plural."},
{s:2,n:7,q:"O uso adequado das regências verbais distingue o texto cuidado do texto precipitado. Assinale a alternativa em que a regência verbal está de acordo com a norma-padrão:",a:["Prefiro supervisionar a coleta do que digitar dados.","A equipe obedecerá o novo cronograma.","Chegamos no posto antes das oito.","Todos assistirão ao briefing amanhã.","O recenseador namora com a filha do produtor."],c:3,e:"Assistir (ver), obedecer e chegar exigem 'a': assistirão ao, obedecerá ao, chegamos ao. Preferir X a Y (sem 'do que'); namorar é transitivo direto (namora a filha)."},
{s:2,n:8,q:"Observe a fala dirigida ao produtor e suas variantes de pontuação. Assinale a alternativa pontuada CORRETAMENTE:",a:["Senhor produtor, disse o recenseador, o IBGE garante o sigilo das informações.","Senhor produtor disse o recenseador o IBGE garante o sigilo das informações.","Senhor produtor, disse o recenseador o IBGE garante, o sigilo das informações.","Senhor, produtor, disse o recenseador, o IBGE garante o sigilo das informações.","Senhor produtor disse, o recenseador, o IBGE garante o sigilo das informações."],c:0,e:"Vocativo e verbo dicendi intercalado devem vir isolados por vírgulas — isolá-los mal (alternativa D) quebra a unidade 'senhor produtor'."},
{s:2,n:9,q:"Complete corretamente: 'O coordenador participou da ______ de planejamento; a ______ de obras da prefeitura fica em outro prédio.'",a:["seção ... sessão","sessão ... seção","sessão ... sessão","cessão ... seção","seção ... cessão"],c:1,e:"Sessão = reunião, evento; seção = subdivisão, setor, repartição; cessão = ato de ceder, transferir. São homônimos de troca fácil — exatamente o que a banca cobra no item 'significação das palavras'."},
{s:2,n:10,q:"Na linguagem formal dos documentos administrativos, é comum o emprego de termos como 'óbice'. Assinale o ANTÔNIMO de 'óbice':",a:["obstáculo","empecilho","facilidade","impedimento","dificuldade"],c:2,e:"Óbice = obstáculo, impedimento, estorvo. O antônimo é facilidade."},
{s:2,n:11,q:"Em seu relatório de campo, o recenseador registrou: 'Não restava alternativa ______ aguardar a chegada do guia.' Complete a frase corretamente:",a:["senão","se não","se-não","sem não","senão que"],c:0,e:"'Senão' (a não ser, exceto) é conjunção/preposição. 'Se não' introduz oração condicional (se não chover...)."},
{s:2,n:12,q:"Considere a frase extraída de um relatório: 'O supervisor confirmou que o setor fora fechado'. Nela, a palavra 'que' classifica-se como:",a:["conjunção integrante","pronome relativo","advérbio","interjeição","preposição"],c:0,e:"Introduz oração subordinada substantiva (objeto direto de 'confirmou'), sem função sintática própria na oração que encabeça: conjunção integrante."},
{s:2,n:13,q:"A posição dos pronomes átonos na frase depende de fatores sintáticos estudados pela gramática normativa. Assinale a alternativa correta quanto à colocação pronominal:",a:["Não disse-lhe a verdade.","Me parece um bom plano.","Recusei-me a assinar o relatório.","Ninguém informou-me sobre a mudança.","Me solidarizo com a equipe."],c:2,e:"Ênclise é obrigatória no início da oração: 'Recusei-me'. Não se inicia período com próclise ('Me parece', 'Me solidarizo') nem se usa ênclise logo após palavra negativa ('Não disse-lhe', 'Ninguém informou-me') — a próclise é obrigatória com palavras atrativas."},
{s:2,n:14,q:"Palavras de uso corrente nos relatórios da operação aparecem, a seguir, em cinco grafias. Assinale a palavra CORRETAMENTE acentuada:",a:["rúbrica","instituído","ítems","juíz","orgão"],c:1,e:"'Instituído': i e u tônicos em hiato são acentuados. Grafias corretas: rubrica (paroxítona sem acento), itens, juiz, órgão."},
{s:2,n:15,q:"Em 'O ACS encaminhou o relatório ao ACR', os termos 'o relatório' e 'ao ACR' exercem, respectivamente, as funções sintáticas de:",a:["objeto indireto e objeto direto","sujeito e aposto","adjunto adnominal e complemento nominal","objeto direto e objeto indireto","agente da passiva e predicativo"],c:3,e:"'Encaminhar' é transitivo direto e indireto: 'o relatório' (sem preposição) é objeto direto; 'ao ACR' (com preposição 'a') é objeto indireto."},
{s:2,n:16,q:"O acompanhamento dos custos da operação exige cálculos percentuais rotineiros. O preço de um insumo passou de R$ 80,00 para R$ 104,00. O aumento percentual foi de:",a:["24%","30%","26%","20%","32%"],c:1,e:"Variação ÷ valor inicial = 24/80 = 0,30 = 30%. Dividir por 104 (≈26%) usa a base errada: percentual de variação incide sobre o valor de origem."},
{s:2,n:17,q:"Um adiantamento de R$ 2.400,00, feito para aquisição de material de campo, será quitado em 5 meses, a juros simples de 2% ao mês, calculados sobre o valor inicial. O total a pagar ao final do prazo é:",a:["R$ 2.640,00","R$ 2.649,80","R$ 2.880,00","R$ 2.400,00","R$ 2.544,00"],c:0,e:"Juros simples: J = 2.400 × 0,02 × 5 = R$ 240,00; total = 2.400 + 240 = R$ 2.640,00. A alternativa B corresponde a juros compostos (2.400 × 1,02⁵ ≈ 2.649,80); a C, a aplicar 4% ao mês; a D esquece os juros."},
{s:2,n:18,q:"Considere a sequência de códigos atribuídos aos lotes de questionários: 3, 4, 6, 9, 13, 18, ... Assinale o próximo termo da sequência:",a:["23","26","22","24","25"],c:3,e:"As diferenças crescem de 1 em 1: +1, +2, +3, +4, +5 e, portanto, +6 → 18 + 6 = 24."},
{s:2,n:19,q:"No dia a dia do planejamento de campo, proposições condicionais orientam decisões. Considere a proposição: 'Se chove, a rota é cancelada'. A negação dessa proposição é:",a:["Se não chove, a rota não é cancelada","Chove e a rota não é cancelada","Não chove e a rota é cancelada","Se a rota é cancelada, chove","Não chove ou a rota é cancelada"],c:1,e:"¬(P → Q) = P ∧ ¬Q: afirma-se o antecedente e nega-se o consequente ('chove e a rota não é cancelada'). A alternativa E (¬P ∨ Q) é, na verdade, equivalente à própria condicional — pegadinha clássica."},
{s:2,n:20,q:"Em uma pausa no posto, dois recenseadores lançam simultaneamente dois dados honestos. A probabilidade de a soma dos pontos ser 7 é:",a:["1/6","7/36","1/12","5/36","1/3"],c:0,e:"Combinações com soma 7: (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) = 6 casos em 36 → 6/36 = 1/6."},
{s:2,n:21,q:"Misturam-se 40 litros de solução a 30% com 60 litros de solução a 50%. A concentração da mistura final será de:",a:["40%","42%","45%","38%","44%"],c:1,e:"Solute: 0,30 × 40 + 0,50 × 60 = 12 + 30 = 42 L em 100 L → 42%. A resposta intuitiva 40% (média das porcentagens) ignora os pesos diferentes dos volumes."},
{s:2,n:22,q:"Em um mapa na escala 1:50.000, a distância entre dois pontos mede 4,5 cm. A distância real corresponde a:",a:["2,25 km","22,5 km","9 km","4,5 km","450 m"],c:0,e:"4,5 × 50.000 = 225.000 cm = 2.250 m = 2,25 km."},
{s:2,n:23,q:"Considere: 'O setor será considerado concluído somente se todos os questionários forem transmitidos'. Sabendo que nem todos os questionários foram transmitidos, conclui-se que:",a:["o setor foi concluído","o setor não foi concluído","os questionários serão retransmitidos","o setor será reaberto","nada se pode concluir"],c:1,e:"'Somente se' indica que a transmissão completa é condição necessária: concluído → transmitidos. Negada a condição necessária, nega-se a conclusão (modus tollens). Confundir condição necessária com suficiente leva ao erro da alternativa A."},
{s:2,n:24,q:"Um comerciante vendeu 40% do estoque de equipamentos e ainda lhe restam 420 unidades. O estoque inicial era de:",a:["588","620","740","700","800"],c:3,e:"Restaram 60% do estoque: 0,60 × E = 420 → E = 700. Somar 420 + 40% (588) usa a base errada."},
{s:2,n:25,q:"Um estabelecimento agropecuário retangular tem 800 m de comprimento e 450 m de largura. Para cercá-lo totalmente, o produtor usará 4 fios de arame ao longo de todo o perímetro. O total de metros de arame necessário é:",a:["2.500","5.000","10.000","20.000","360.000"],c:2,e:"Perímetro = 2 × (800 + 450) = 2.500 m. Com 4 fios: 4 × 2.500 = 10.000 m. A alternativa A esquece de multiplicar pelos fios; a E calcula a área (800 × 450 = 360.000 m²), não o contorno."},
{s:2,n:26,q:"O ciclo administrativo clássico estrutura a gestão de qualquer equipe, inclusive a de coleta. A sequência correta das funções administrativas clássicas (PODC) é:",a:["organização, planejamento, direção, controle","direção, controle, planejamento, organização","planejamento, controle, organização, direção","controle, organização, direção, planejamento","planejamento, organização, direção, controle"],c:4,e:"O ciclo administrativo começa definindo objetivos e meios (planejamento), estrutura recursos (organização), conduz pessoas (direção) e verifica/corrige (controle)."},
{s:2,n:27,q:"Conduzir pessoas é o coração do trabalho do ACS: é por meio dela que os planos saem do papel. A função administrativa de direção envolve:",a:["conduzir, motivar e comunicar-se com as pessoas da equipe","definir objetivos e metas","medir resultados e compará-los com padrões","estruturar tarefas e hierarquias","estabelecer padrões de qualidade"],c:0,e:"Direção é a condução das pessoas: liderança, motivação e comunicação — põe o plano em movimento."},
{s:2,n:28,q:"O desempenho da coleta é monitorado por um processo contínuo de controle. Assinale a alternativa que apresenta a ordem CORRETA das etapas do processo de controle:",a:["medir → comparar → corrigir → estabelecer padrão","comparar → corrigir → estabelecer → medir","estabelecer padrões → medir o desempenho → comparar → corrigir desvios","corrigir → medir → comparar → planejar","planejar → executar → delegar → avaliar"],c:2,e:"O controle começa pelo padrão (definido no planejamento), mede o desempenho real, compara com o padrão e só então adota ações corretivas."},
{s:2,n:29,q:"Para compreender a estrutura da operação censitária, o novo ACS estuda seus instrumentos de representação. O organograma é o instrumento que representa:",a:["o fluxo de documentos da organização","o cronograma das atividades","a distribuição física das equipes","a estrutura formal da organização (hierarquia e relações de autoridade)","os processos de trabalho"],c:3,e:"O organograma representa graficamente a estrutura formal: unidades, níveis hierárquicos, linhas de autoridade e comunicação formal."},
{s:2,n:30,q:"Em uma equipe, salários, condições de trabalho e políticas de gestão são avaliados como adequados, mas o desempenho cai por falta de reconhecimento, desafios e responsabilidade. À luz da teoria dos dois fatores, a gestão deve atuar sobre:",a:["fatores higiênicos, já que evitam a insatisfação","fatores motivacionais","fatores fisiológicos","fatores legais de pessoal","o turnover da equipe"],c:1,e:"Herzberg: higiênicos (salário, condições, políticas) evitam insatisfação, mas não geram satisfação; os motivadores (reconhecimento, realização, responsabilidade) é que movem o desempenho — exatamente o que falta no caso."},
{s:2,n:31,q:"Nenhum estilo de liderança funciona igualmente bem em todas as situações. Na liderança situacional, a escolha do estilo mais adequado depende:",a:["exclusivamente do perfil do líder","apenas da cultura nacional da organização","unicamente dos prazos estabelecidos","do humor do gestor","do nível de maturidade/prontidão dos liderados e da natureza da tarefa"],c:4,e:"A abordagem situacional ajusta o estilo (mais diretivo ou mais participativo) ao grau de maturidade da equipe e às exigências da tarefa — não existe estilo ideal em absoluto."},
{s:2,n:32,q:"A comunicação entre posto, supervisores e recenseadores precisa chegar íntegra ao destinatário. Na comunicação organizacional, 'ruído' é:",a:["o feedback recebido do receptor","o canal formal utilizado","qualquer interferência que distorce ou impede a compreensão correta da mensagem","a mensagem clara","a redundância intencional"],c:2,e:"Ruído é a interferência (física, semântica ou psicológica) que compromete a fidelidade da comunicação — do som ambiente ao jargão técnico mal compreendido."},
{s:2,n:33,q:"As decisões reais raramente acontecem em condições ideais. O conceito de racionalidade limitada (Herbert Simon) indica que o administrador decide:",a:["com informação completa e tempo ilimitado","de forma puramente intuitiva, sem dados","por consenso total do grupo","de modo aleatório","buscando soluções satisfatórias, diante de limites de informação, tempo e capacidade cognitiva"],c:4,e:"Diante de limitações reais, o decidir busca alternativas satisfatórias (suficientemente boas), não a solução ótima idealizada."},
{s:2,n:34,q:"Um ACS responde diretamente por 25 recenseadores e percebe que não consegue acompanhar a qualidade do trabalho de todos. Essa situação decorre, tipicamente, de:",a:["centralização excessiva da comunicação","ausência de organograma","delegação insuficiente de tarefas","amplitude de controle excessiva","excesso de fatores higiênicos"],c:3,e:"Amplitude de controle é o número de subordinados que um gestor consegue supervisionar com eficácia; superá-la degrada a qualidade da supervisão — solução: redistribuir equipes ou criar níveis de apoio."},
{s:2,n:35,q:"As organizações modernas buscam avaliar o desempenho sob múltiplas perspectivas. A avaliação de desempenho conhecida como 360 graus caracteriza-se por:",a:["ser feita apenas pelo chefe imediato","basear-se em autodiagnóstico do avaliado","usar apenas sistemas informatizados","ser aplicada por RH distante da operação","recolher feedback de múltiplas fontes: superiores, pares, subordinados e clientes"],c:4,e:"Na avaliação 360º, o avaliado recebe devolutivas dos diversos atores com quem interage, reduzindo a visão unilateral do chefe."},
{s:2,n:36,q:"Situação gerencial – O ACS percebe que um recenseador não sincroniza e transmite os dados diariamente. A conduta mais adequada é:",a:["ignorar, pois o sistema corrige depois","analisar o padrão no sistema, identificar a causa (dúvida técnica, falta de energia etc.) e combinar rotina de transmissão com acompanhamento","aplicar advertência formal imediata","recolher o DMC do recenseador definitivamente","pedir a outro recenseador que transmita por ele"],c:1,e:"Controle gerencial começa pelo diagnóstico (dados + diálogo), seguido de acordo de rotina e acompanhamento. Punição cega e 'gambiarra' (outro transmitir) apenas mascaram o problema."},
{s:2,n:37,q:"Situação gerencial – Você supervisiona uma equipe que superou a meta semanal de cobertura. A atitude gerencial mais adequada é:",a:["reconhecer publicamente o desempenho e analisar o que permitiu o resultado para replicá-lo","aumentar imediatamente as metas","ignorar, pois cumprir meta é obrigação","atribuir nova carga imediatamente, sem análise","evitar reconhecimento para não 'estragar' a equipe"],c:0,e:"Reforço positivo imediato e específico consolida comportamentos; analisar os fatores de sucesso permite replicá-los. Aumentar metas de imediato pune o bom desempenho."},
{s:2,n:38,q:"Situação gerencial – Na volta do campo, o ACS percebe que um boato sobre cortes de contrato circula na equipe, gerando inquietação. O ACS deve:",a:["corroborar o boato","ignorar completamente","esclarecer com transparência, com base nas informações oficiais disponíveis, mantendo canais abertos","ameaçar quem espalha","negar tudo, mesmo sem saber"],c:2,e:"Boato prospera em vácuo de informação: comunicação transparente com fontes oficiais, ainda que limitadas, preserva a confiança; negação cega ou ameaça destrói o clima."},
{s:2,n:39,q:"Situação gerencial – Há setores de acesso fluvial na área do posto. Antes de iniciar a coleta neles, o ACS deve:",a:["enviar o recenseador sem planejamento","pular esses setores até o final da operação","pedir que o recenseador pague o transporte","orientar o planejamento logístico prévio com a supervisão (embarcação, tempo de deslocamento, comunicação)","orientar a coleta desses setores por telefone"],c:3,e:"Restrições de acesso registradas no descritivo (ex.: 'acesso fluvial a partir do polo base') exigem planejamento logístico prévio junto à supervisão: embarcação, maior tempo de deslocamento."},
{s:2,n:40,q:"Situação gerencial – Dois recenseadores divergem sobre o limite de seus setores. O ACS deve orientá-los a:",a:["decidir pela proximidade pessoal com o informante","esperar o AOR resolver tudo","dividir a área limítrofe ao meio","consultar o mapa e o descritivo do setor e resolver com base nos limites oficiais, comunicando a supervisão se persistir dúvida","sortear a área"],c:3,e:"Limites de setor se confirmam com o mapa e o descritivo; diante de inconsistência persistente, comunica-se a supervisão — nunca se divide área ou sorteia."},
{s:2,n:41,q:"Situação gerencial – Um recém-contratado apresenta dificuldades de aprendizado nos procedimentos. O ACS deve:",a:["requerer sua demissão imediata","deixar que aprenda sozinho","transferi-lo para outra função imediatamente","reduzir definitivamente a expectativa de desempenho dele","acompanhá-lo de perto (coaching), reforçar o treinamento e dar feedback construtivo"],c:4,e:"Desenvolvimento de pessoas: acompanhamento próximo, reforço de treinamento e feedback orientado à melhoria — substituir ou abandonar é custo alto e erro gerencial."},
{s:2,n:42,q:"Situação gerencial – Um informante pede sigilo sobre os dados de sua produção. O ACS deve orientar o recenseador a:",a:["prometer sigilo informal apenas","explicar que as informações individuais são confidenciais (sigilo estatístico) e divulgadas apenas de forma agregada","negar o pedido e intimidar o informante","alterar os dados para 'proteger' o informante","compartilhar os dados com vizinhos, para transparência"],c:1,e:"O sigilo estatístico é compromisso legal do IBGE: dados individuais são confidenciais; a divulgação ocorre apenas de forma agregada. Alterar dados é fraude."},
{s:2,n:43,q:"Situação gerencial – O prazo de coleta é curto e a equipe é pequena. A conduta gerencial mais adequada é:",a:["cortar etapas de controle de qualidade","contratar pessoal sem processo formal","exigir horas extras ilimitadas","priorizar e redistribuir cargas com base em indicadores, comunicando riscos ao ACR e preservando a qualidade","simular a cobertura dos setores"],c:3,e:"Planejamento e comunicação (escalar riscos ao nível superior com dados e propostas) mantêm a viabilidade sem sacrificar a qualidade — cortar controle ou simular dados é inadmissível."},
{s:2,n:44,q:"Situação gerencial – Um lote de questionários apresenta erros de preenchimento antes da transmissão. O ACS deve:",a:["transmitir mesmo assim, corrigindo depois","verificar e corrigir antes da transmissão, orientando a equipe sobre a causa para prevenção","apagar todo o lote","culpar o sistema","ignorar os erros considerados pequenos"],c:1,e:"Qualidade exige verificação antes da transmissão e ação preventiva sobre a causa do erro — transmitir errado multiplica o retrabalho nas verificações do CEQ."},
{s:2,n:45,q:"Situação gerencial – Uma decisão urgente precisa ser tomada com dados incompletos. A postura mais adequada é:",a:["esperar sempre a certeza total","sortear a alternativa","evitar qualquer decisão","delegar a decisão a um subordinado, sem apoio","decidir com a melhor informação disponível, explicitando premissas, monitorando e corrigindo o rumo se necessário"],c:4,e:"Sob racionalidade limitada, decide-se com a informação viável, deixando as premissas claras e monitorando os resultados para corrigir a tempo — paralisia decisória também é decisão (ruim)."},
{s:2,n:46,q:"O Centro Estadual de Qualidade (CEQ), responsável pelo monitoramento da qualidade em nível estadual, é vinculado:",a:["à Sede do IBGE","às Agências municipais","às Superintendências Estaduais (SES)","aos postos censitários","à FUNAI"],c:2,e:"O CEQ é vinculado às SES; o CNQ, ao contrário, é vinculado à Sede e monitora a qualidade em âmbito nacional, orientando os CEQ."},
{s:2,n:47,q:"A operação censitária possui hierarquia bem definida de agentes. Na estrutura censitária, o Agente Censitário Regional (ACR) é subordinado:",a:["ao ACS","ao Agente Operacional Regional (AOR)","ao ACA","ao ACI","ao CNQ"],c:1,e:"O ACR coordena as atividades censitárias no âmbito do posto e é subordinado ao AOR — que responde pela gestão do posto — gerenciando, por sua vez, os ACS."},
{s:2,n:48,q:"O Mapa Municipal Estatístico (MME), fixado no posto de coleta, deve ser utilizado pelo Recenseador para:",a:["planejar a chegada ao setor, identificando sua localização no município e as vias de acesso","registrar os questionários respondidos","transmitir os dados da coleta","delimitar novos setores censitários","armazenar equipamentos e materiais"],c:0,e:"O MME traz a visão geral de todos os setores do município e suas vias de acesso, orientando o planejamento do deslocamento até o setor — não é instrumento de coleta."},
{s:2,n:49,q:"Além do mapa, outro documento acompanha o Recenseador na compreensão da sua área de trabalho. O descritivo do setor é:",a:["a lista de equipamentos da equipe","a tabela de produção do setor","o roteiro de entrevistas agendadas","um resumo do questionário","o texto que define detalhadamente os limites da área de trabalho, orientando a cobertura correta do setor"],c:4,e:"O descritivo delimita com precisão o perímetro do setor e orienta o reconhecimento dos limites em campo; compõe-se de cinco partes (ponto inicial/final, perímetro, setores a excluir, estruturas não setorizadas, acessibilidade e observações)."},
{s:2,n:50,q:"O descritivo do setor contém orientações que merecem atenção especial do Recenseador. Sobre os 'setores a serem excluídos' (indicados no descritivo), o Recenseador:",a:["deve coletá-los parcialmente","deve coletá-los integralmente","deve redesenhá-los no mapa","deve transferi-los ao ACS","não deve realizar a coleta, pois são responsabilidade de outro Recenseador"],c:4,e:"Setores contidos dentro do perímetro (como um setor urbano dentro de área rural) são excluídos do trabalho — outro Recenseador responderá por eles; coletá-los geraria duplicação."},
{s:2,n:51,q:"Durante o trabalho em campo, o Recenseador encontra inconsistência e não consegue identificar com segurança o limite do seu setor. A conduta correta é:",a:["ajustar o limite por conta própria, anotando a mudança","alterá-lo com autorização verbal de outro Recenseador","comunicar imediatamente a supervisão — o perímetro do setor não pode ser alterado pelo Recenseador em hipótese alguma","redesenhar o perímetro no DMC","invadir o setor vizinho para completar a cobertura"],c:2,e:"O material determina comunicar imediatamente a supervisão diante de dificuldades de limite. O Recenseador jamais altera o perímetro (inclusive 'linhas secas', limites não materializados no terreno) — a observação correta evita invadir setor vizinho ou omitir parte do próprio."},
{s:2,n:52,q:"Sobre a divisão político-administrativa brasileira, conforme o material do Censo, é correto afirmar que:",a:["os distritos são criados por lei estadual e possuem autonomia administrativa plena","os distritos equivalem a municípios, com autonomia parcial","os subdistritos dividem integralmente os municípios, e os distritos, os estados","os municípios brasileiros totalizam 5.572 unidades","os distritos, criados por legislação municipal e subordinados ao governo municipal, dividem integralmente os municípios; os subdistritos, cerca de 645 no país, são geralmente estabelecidos apenas nas grandes cidades"],c:4,e:"Os distritos dividem integralmente os municípios (5.569 no Brasil), são criados por legislação municipal e não possuem autonomia administrativa; os subdistritos (aproximadamente 645) subdividem distritos populosos ou extensos, sobretudo nas grandes cidades — a maioria dos municípios não os possui. Municípios são criados, incorporados, fundidos ou desmembrados por lei estadual."},
{s:2,n:53,q:"Um rio corta ao meio as terras de um estabelecimento agropecuário que, de resto, atende simultaneamente às quatro condições para áreas não contínuas. Para o Censo, essa situação:",a:["caracteriza dois estabelecimentos distintos","exige recenseamento em dois setores","não caracteriza descontinuidade da área: rios, estradas ou ferrovias que cortam as terras não dividem o estabelecimento","invalida o registro da produção","implica contato obrigatório com o CNQ"],c:2,e:"Regra expressa do material: elementos como rios, estradas e ferrovias cortando as terras NÃO caracterizam descontinuidade — continua sendo um único estabelecimento se atendidas as quatro condições."},
{s:2,n:54,q:"Áreas não contínuas de um mesmo produtor estão totalmente localizadas em municípios distintos. Conforme o material:",a:["cada área será considerada um estabelecimento agropecuário diferente, e o Recenseador deve contatar o supervisor","as áreas devem ser somadas ao estabelecimento da sede","a coleta deve ocorrer apenas na maior delas","a produção será dividida proporcionalmente entre os municípios","as áreas ficam automaticamente não recenseáveis"],c:0,e:"Áreas totalmente situadas em municípios distintos configuram estabelecimentos diferentes — com cuidado para não registrar as mesmas informações em mais de um estabelecimento; nesses casos, o Recenseador deve contatar o supervisor."},
{s:2,n:55,q:"Uma unidade especializada em confinamento de gado (boitel) recebe apenas animais pertencentes a terceiros e não desenvolve outra atividade agropecuária. Para o Censo:",a:["é estabelecimento agropecuário, pois confina gado","não é considerada estabelecimento: os animais serão contados nos estabelecimentos dos respectivos proprietários","é estabelecimento apenas se os animais forem vendidos","deve ser recenseada junto ao frigorífico da região","os animais não entrarão em nenhum estabelecimento"],c:1,e:"Unidades de confinamento só são estabelecimentos se possuírem animais próprios ou desenvolverem outra atividade agropecuária; animais de terceiros são contados nos estabelecimentos dos proprietários."},
{s:2,n:56,q:"Em uma indústria que mantém, dentro de seus limites, criação de gado leiteiro, o Censo Agropecuário deverá:",a:["investigar toda a indústria, incluindo produção industrial e salários","encaminhar o caso à SES, que fará a coleta especial","excluir a indústria por completo","registrar apenas o número de trabalhadores da indústria","investigar somente a parte diretamente ligada à atividade agropecuária; os dados industriais serão coletados por outras pesquisas do IBGE"],c:4,e:"Quando a atividade principal é a indústria, o Censo Agro investiga apenas a parte agropecuária; produção, vendas, trabalhadores e salários industriais cabem a outras pesquisas do IBGE."},
{s:2,n:57,q:"Sobre as relações entre propriedade rural e estabelecimento agropecuário, é correto afirmar que:",a:["os conceitos são equivalentes","uma propriedade pode abrigar mais de um estabelecimento, e áreas de propriedades diferentes exploradas pelo mesmo produtor podem compor um único estabelecimento","cada propriedade corresponde sempre a um único estabelecimento","estabelecimentos jamais podem exceder os limites de uma propriedade","propriedades de diferentes produtores sempre formam um único estabelecimento"],c:1,e:"Não são a mesma coisa: diferentes produtores explorando partes distintas da mesma propriedade configuram estabelecimentos diferentes; e um mesmo produtor, explorando áreas de distintos proprietários (aluguel, parceria, comodato), pode compô-las em um único estabelecimento, atendidas as condições."},
{s:2,n:58,q:"No material do Censo, a situação em que o produtor usa a terra emprestada, sem pagar, denomina-se:",a:["arrendamento","parceria","comodato","ocupação","concessão de uso"],c:2,e:"Comodato = uso da terra emprestada, sem pagamento. Arrendamento envolve aluguel; parceria, divisão de resultados; ocupação, posse sem título."},
{s:2,n:59,q:"Durante o período de referência, o Sr. Jorge arrendou terras do Sr. Mário e nelas produziu; na data de referência, porém, já não estava mais na propriedade. Localizado pelo Recenseador, o procedimento correto é:",a:["não coletar nada, pois o produtor saiu da área","coletar as informações com o Sr. Mário, proprietário das terras","aplicar o questionário ao Sr. Jorge, assinalando, em quadro específico, o item que identifica o produtor sem área","registrar a produção como pertencente ao posto censitário","dividir a produção igualmente entre os dois produtores"],c:2,e:"É o caso clássico de produtor sem área: quem explorava (Sr. Jorge) já não ocupava as terras na data de referência. Localizado, o questionário é aplicado a ele, com a marcação de produtor sem área — e não ao proprietário da terra."},
{s:2,n:60,q:"Entre os tipos de setores rurais definidos para o Censo Agropecuário há denominações específicas. A 'Agrovila' é o setor censitário caracterizado por:",a:["10 domicílios associados a projetos de assentamento","15 domicílios indígenas","25 domicílios quilombolas","mais de 50 domicílios associados a Projetos de Assentamento","100 domicílios urbanos de baixa densidade"],c:3,e:"Agrovila: mais de 50 domicílios associados a Projetos de Assentamento, com adensamento e concentração de estabelecimentos agropecuários — setor muito importante para o Censo Agro."},

/* ==================== SIMULADO 3 ==================== */
{s:3,n:1,t:3,q:"A frase final — 'O relógio não marca as horas; marca, discretamente, a nossa' — sugere que o relógio:",a:["está quebrado e precisa de conserto urgente","atrasa todos os passageiros da estação","tem valor essencialmente simbólico e afetivo para a cidade","deveria ser substituído por um modelo digital","pertence pessoalmente ao funcionário"],c:2,e:"A crônica atribui ao relógio parado um valor simbólico: ele 'marca' a lembrança coletiva e a continuidade das gerações, e não o tempo cronológico — por isso ninguém o conserta."},
{s:3,n:2,t:3,q:"Ao encerrar o texto, o autor formula uma hipótese sobre o papel das cidades. Em 'Talvez seja essa a função das cidades', o pronome 'essa' retoma:",a:["um novo argumento que será desenvolvido adiante","a explicação do funcionário sobre o conserto do relógio","a ideia do período anterior: guardar objetos inúteis que sustentam a lembrança de todos","o relógio da estação, citado no início do texto","a fumaça que escureceu os tijolos"],c:2,e:"'Essa' é mecanismo de referenciação (coesão): retoma e sintetiza o argumento imediatamente anterior — a função de guardar objetos inúteis que conservam a memória coletiva."},
{s:3,n:3,t:3,q:"No período 'guardar objetos inúteis que, no fundo, sustentam a lembrança de todos', o verbo destacado assume sentido figurado. No texto, 'sustentam' (a lembrança de todos) equivale a:",a:["abafam","apagam","contradizem","mantêm vivas","questionam"],c:3,e:"Sustentar, nesse contexto, = manter, conservar vivas as lembranças (sentido figurado de amparar)."},
{s:3,n:4,q:"Complete corretamente: 'Referimo-nos ___ produção do último trimestre, que superou ___ de todos os índices anteriores.'",a:["a ... a","à ... à","à ... a","a ... à","às ... a"],c:2,e:"'Referir-se' exige preposição 'a', que se funde com o artigo de 'a produção': referimo-nos à produção. Já 'superar' é transitivo direto: em 'superou a [produção] de', o 'a' é apenas artigo, sem preposição — logo, sem crase."},
{s:3,n:5,q:"Revendo o comunicado semanal do posto, o ACS checa a concordância verbal de cada período. Assinale a frase com concordância verbal CORRETA:",a:["Haviam dois jeitos de chegar ao setor.","Devem haver vagas na nova equipe.","Existia muitos produtores na região.","Fizeram cinco anos sem chuva na região.","Podia haver soluções melhores para o caso."],c:4,e:"'Haver' (existir) é impessoal e o auxiliar permanece no singular: podia haver, deve haver, havia. Corretas seriam: existiam, fez cinco anos."},
{s:3,n:6,q:"No preenchimento dos formulários da coleta, a concordância nominal exige atenção redobrada. Assinale a alternativa correta quanto à concordância nominal:",a:["A água destinada à limpeza está meia morna.","Segue em anexo as planilhas da produção.","Os irmãos produtores ficaram quite com o combinado.","É necessária a confirmação dos dados pelo informante.","O recenseador ficou meia frustrado com o acesso."],c:3,e:"Com artigo definido ('a confirmação'), o predicativo concorda: é necessária. 'Meio' advérbio é invariável; 'em anexo' + plural → seguem anexas as planilhas; quite → quites."},
{s:3,n:7,q:"Verbos como assistir, obedecer e implicar costumam gerar dúvidas de regência. Assinale a alternativa em que a regência está de acordo com a norma-padrão:",a:["Prefiro enfrentar o barro a esperar a chuva passar.","Todos assistiram o DVD de treinamento ontem.","Chegamos à tempo de ver o resultado.","O recenseador implicou em demora na entrevista.","O produtor obedeceu o regulamento do posto."],c:0,e:"'Preferir X a Y'. Assistir (ver) exige 'a' (assistiram ao); a tempo (sem crase); implicar (acarretar) é transitivo direto (implicou demora); obedecer exige 'a' (obedeceu ao)."},
{s:3,n:8,q:"Considere a frase sobre a conclusão da rota e suas cinco variantes de pontuação. Assinale a alternativa pontuada CORRETAMENTE:",a:["Mesmo cansados os recenseadores terminaram a rota antes do meio-dia.","Mesmo, cansados, os recenseadores terminaram a rota antes do meio-dia.","Mesmo cansados, os recenseadores terminaram a rota antes do meio-dia.","Mesmo cansados os recenseadores terminaram, a rota, antes do meio-dia.","Mesmo cansados; os recenseadores terminaram a rota antes do meio-dia."],c:2,e:"A oração reduzida anteposta exige vírgula; vírgulas internas (alternativas B e D) quebram a adjacência natural dos termos e o ponto e vírgula (E) é forte demais para o contexto."},
{s:3,n:9,q:"O ACS precisa registrar, no relatório diário do posto, uma recusa de entrevista ocorrida em campo. O registro adequado, quanto à clareza e ao padrão formal, é:",a:["'Aquele produtor foi muito grosseiro com o recenseador, que não teve paciência nenhuma.'","'Às 14h, o informante do estabelecimento localizado na Estrada Buriti recusou a entrevista; reagendamento combinado para o dia seguinte.'","'Ocorreu um problema chato hoje à tarde com um produtor que não quis conversar.'","'O recenseador contou que o dono da fazenda é difícil e sempre cria caso.'","'Recusa aconteceu. Já resolvido. Sem maiores detalhes.'"],c:1,e:"Registros operacionais exigem objetividade, impessoalidade e precisão: hora, local identificável, fato ocorrido e providência adotada. Juízos de valor ('grosseiro', 'difícil'), vagueza ('chato', 'à tarde') e omissão de detalhes relevantes comprometem a qualidade e a utilidade do registro."},
{s:3,n:10,q:"Palavras como 'prolixo' qualificam a maneira de escrever de um autor e o próprio estilo de um texto. Assinale o ANTÔNIMO de 'prolixo':",a:["confuso","extenso","conciso","detalhado","rebuscado"],c:2,e:"Prolixo = excessivamente longo, redundante. O antônimo exato é conciso (breve e denso) — não 'detalhado', que não implica excesso."},
{s:3,n:11,q:"Complete: 'O desabamento da cerca era ______; um ______ pesquisador do IBGE alertou todos os produtores.'",a:["iminente / eminente","eminente / iminente","eminente / eminente","iminente / iminente","iminente / emigrante"],c:0,e:"Iminente = prestes a ocorrer; eminente = ilustre, notável. Parônimos de troca fácil — exatamente o que a banca cobra."},
{s:3,n:12,q:"Em 'Os estabelecimentos que ficam além do rio serão recenseados amanhã', a palavra 'que' classifica-se como:",a:["conjunção integrante","partícula expletiva","advérbio","preposição","pronome relativo"],c:4,e:"'Que' retoma 'estabelecimentos' (antecedente) e exerce função sintática na oração adjetiva (sujeito): pronome relativo. Se fosse expletiva, poderia ser retirada sem prejuízo."},
{s:3,n:13,q:"O ACS diz ao recenseador: '______ mapa que está aí, com você, é do setor urbano; ______ que está aqui, comigo, é do setor rural.' Complete corretamente:",a:["Esse ... este","Este ... esse","Este ... este","Esse ... esse","Aquele ... este"],c:0,e:"'Esse' aponta o que está próximo do ouvinte (aí, com você); 'este', o que está próximo do falante (aqui, comigo). A alternância entre os demonstrativos marca a posição dos interlocutores na conversação."},
{s:3,n:14,q:"A conferência de uma lista de termos levantou as grafias abaixo. Assinale a alternativa em que TODAS as palavras estão corretamente acentuadas:",a:["rubrica, orgão, juiz","juíz, vôo, item","látex, âmbar, parabólica","portatil, federal, onix","rubríca, vazio, flúido"],c:2,e:"'Látex' e 'parabólica' são proparoxítonas (todas acentuadas); 'âmbar' é paroxítona terminada em -r. Grafias corretas das demais: rubrica, órgão, juiz, voo, itens, portátil, ônix, vazio, fluido."},
{s:3,n:15,q:"Complete mantendo a correlação dos tempos verbais: 'Quando o recenseador ______ a rota, ______ os dados no sistema.'",a:["terminar ... transmitirá","terminará ... transmitirá","terminou ... transmite","terminar ... transmitiria","terminava ... transmitirá"],c:0,e:"Oração temporal com 'quando' e sentido futuro pede futuro do subjuntivo ('terminar'), correlacionado com o futuro do indicativo na principal ('transmitirá'). 'Terminará' no 'quando' é erro clássico."},
{s:3,n:16,q:"Após dois descontos sucessivos de 10%, um produto de R$ 200,00 passa a custar R$ 162,00. O desconto único equivalente corresponde a:",a:["20%","19%","18%","21%","15%"],c:1,e:"200 × 0,9 × 0,9 = 162. Fator total 0,81 → desconto de 19%. Dois descontos de 10% NÃO equivalem a 20%: incidem sobre bases diferentes."},
{s:3,n:17,q:"O quadro abaixo mostra o número de questionários transmitidos por um recenseador ao longo de uma semana.\n\nSegunda-feira: 18\nTerça-feira: 22\nQuarta-feira: 14\nQuinta-feira: 26\nSexta-feira: 20\n\nEm relação à média diária da semana, o número de questionários transmitidos na quinta-feira foi:",a:["superior em 30%","superior em 26%","superior em 130%","inferior em 30%","igual à média"],c:0,e:"Total: 18+22+14+26+20 = 100 → média = 100 ÷ 5 = 20. Quinta-feira: 26 = 20 × 1,3, ou seja, 30% acima da média. Quem marca 26% dividiu 26 pelo total (100), e não pela média; 130% confunde o fator de comparação com o percentual de aumento."},
{s:3,n:18,q:"Ao organizar os registros do dia, o ACS listou a sequência de visitas concluídas: 2, 5, 11, 23, 47, ... Assinale o próximo termo da sequência:",a:["94","71","95","93","59"],c:2,e:"Cada termo é o dobro do anterior mais um: 2×2+1=5; 5×2+1=11; 11×2+1=23; 23×2+1=47; 47×2+1=95. A pegadinha é responder 94 (só o dobro)."},
{s:3,n:19,q:"Ou a coleta do setor termina hoje, ou o ACS solicitará reforço à equipe. A coleta do setor terminou hoje. Logo:",a:["o ACS solicitará reforço","o ACS não solicitará reforço","a coleta não terminou","o setor será reaberto amanhã","nada se pode concluir"],c:1,e:"Disjunção exclusiva: afirmada uma das opções, nega-se a outra (ou termina hoje, ou pede reforço — não ambas). Logo, não haverá pedido de reforço."},
{s:3,n:20,q:"Uma caixa contém 4 bolas vermelhas e 6 azuis. Retiram-se duas bolas, com reposição da primeira. A probabilidade de ambas serem vermelhas é:",a:["4/25","2/5","6/25","8/25","1/5"],c:0,e:"Com reposição, os eventos são independentes: 4/10 × 4/10 = 16/100 = 4/25. Sem reposição seria 4/10 × 3/10 = 3/25; responder 2/5 esquece a segunda extração."},
{s:3,n:21,q:"A média de cinco números é 18. Retirando-se um deles, a média dos quatro restantes passa a ser 20. O número retirado foi:",a:["10","8","12","16","14"],c:0,e:"Soma dos cinco: 5 × 18 = 90; soma dos quatro: 4 × 20 = 80; retirado = 90 − 80 = 10."},
{s:3,n:22,q:"A distância real entre dois pontos é de 12 km. Em um mapa de escala 1:80.000, essa distância corresponde, em centímetros, a:",a:["12","15","150","1,5","96"],c:1,e:"12 km = 1.200.000 cm; 1.200.000 ÷ 80.000 = 15 cm. A alternativa 96 esquece a divisão; 150 erra a conversão."},
{s:3,n:23,q:"Considere as premissas: 'Nenhum informante é hostil' e 'Alguns produtores são informantes'. Conclui-se validamente que:",a:["alguns produtores não são hostis","todos os produtores são hostis","nenhum produtor é informante","alguns informantes são hostis","nada se pode concluir"],c:0,e:"Unindo as premissas: os produtores que são informantes pertencem ao conjunto dos informantes, e nenhum informante é hostil — logo, esses produtores não são hostis, isto é, alguns produtores não são hostis. As demais alternativas invertem ou extrapolam as premissas."},
{s:3,n:24,q:"Há oito anos, a idade do ACS era o quádruplo da idade do recenseador. Hoje, é o dobro. A idade do ACS hoje é:",a:["24","32","20","28","16"],c:0,e:"Sistema: A − 8 = 4(R − 8) e A = 2R → 2R − 8 = 4R − 32 → 2R = 24 → R = 12, A = 24. Quem responde 32 (quádruplo hoje) mistura as épocas."},
{s:3,n:25,q:"O recenseador gastou 1/3 do dia em deslocamento e 1/4 do tempo restante em espera, restando 4 horas de entrevistas. O tempo gasto em espera foi de:",a:["60 minutos","40 minutos","90 minutos","80 minutos","120 minutos"],c:3,e:"Seja T o total: após o deslocamento restam 2/3 T; espera = 1/4 × 2/3 T = 1/6 T; entrevistas = T − 1/3T − 1/6T = 1/2 T = 4h → T = 8h → espera = 8/6 h = 1h20 = 80 minutos."},
{s:3,n:26,q:"Os planos administrativos dividem-se em níveis conforme o horizonte temporal e o escopo. O planejamento de nível operacional caracteriza-se por:",a:["curto prazo, rotinas e metas específicas de execução","visão de longo prazo da organização","definição da missão corporativa","análise de cenários macroambientais","políticas gerais de recursos humanos"],c:0,e:"O plano operacional detalha o 'como fazer' do dia a dia: metas específicas, rotinas, curto prazo — hierarquicamente abaixo do tático e do estratégico."},
{s:3,n:27,q:"Nem tudo o que acontece em uma equipe consta no organograma: relações espontâneas florescem à sua margem. A organização informal é:",a:["o organograma oficial","o conjunto de relações espontâneas que emergem da convivência, paralelas à estrutura formal","o manual de procedimentos","o regimento interno","a estrutura oficial de cargos e salários"],c:1,e:"A organização informal nasce das interações espontâneas (grupos, lideranças naturais, normas tácitas) e coexiste com a estrutura formal — ignorá-la é erro clássico de gestão."},
{s:3,n:28,q:"Para colocar o plano em movimento, o gestor apoia-se em instrumentos próprios da direção. A função administrativa de direção apoia-se, essencialmente, em:",a:["orçamento e controle financeiro","planejamento estratégico e metas","recrutamento e seleção de pessoal","liderança, comunicação e motivação","auditoria e inventário de recursos"],c:3,e:"Dirigir é conduzir pessoas: liderança, comunicação e motivação — funções da direção no ciclo administrativo."},
{s:3,n:29,q:"Antes, durante ou depois: o controle pode atuar em diferentes momentos do processo. O controle preventivo caracteriza-se por:",a:["ocorrer antes da execução, por meio de padronização e treinamento, para evitar erros","ocorrer apenas após a entrega do serviço","ser feito exclusivamente por auditoria externa","dispensar indicadores de desempenho","substituir a função de planejamento"],c:0,e:"Controle prévio (preventivo) atua antes da execução: padrões, procedimentos e treinamento evitam o erro — mais barato que corrigi-lo depois (controle corretivo)."},
{s:3,n:30,q:"Um recém-contratado, embora competente, demonstra constante insegurança quanto à manutenção do vínculo e às condições do posto. Segundo a hierarquia de Maslow, a necessidade preponderante nesse caso é:",a:["fisiológica","de estima","social","de segurança","de autorrealização"],c:3,e:"Medo de perder o vínculo e incerteza sobre condições futuras expressam necessidades de segurança (segundo nível da pirâmide) — precedem estima e autorrealização; gestores que ignoram esse nível cobram engajamento prematuro."},
{s:3,n:31,q:"A maneira como o gestor enxerga as pessoas condiciona seu estilo de comando. A Teoria Y de McGregor pressupõe que:",a:["as pessoas evitam responsabilidade e precisam ser controladas","o trabalho é naturalmente uma punição","o controle externo estreito é sempre indispensável","as pessoas buscam responsabilidade e são capazes de autodireção","a motivação é exclusivamente financeira"],c:3,e:"A Teoria Y tem pressuposto otimista: o trabalho é natural como o lazer, pessoas buscam responsabilidade e se autodirigem — base para gestão participativa. A Teoria X diz o contrário."},
{s:3,n:32,q:"A informação precisa fluir nos dois sentidos da hierarquia. A comunicação ascendente é aquela que ocorre:",a:["da chefia para a equipe","da equipe para a chefia","entre colegas do mesmo nível hierárquico","entre áreas diferentes","apenas com o público externo"],c:1,e:"Ascendente: de baixo para cima — relatos de campo, sugestões e alertas que sobem na hierarquia. O ACS, como elo, depende criticamente dela: sem canal aberto, problemas chegam tarde ao posto."},
{s:3,n:33,q:"O reagendamento de uma entrevista recusada, realizado exatamente conforme procedimento padrão previsto em manual, caracteriza decisão:",a:["não programada, pois depende do informante","programada, pois segue regras e procedimentos preestabelecidos","de crise","estratégica","intuitiva"],c:1,e:"Decisões programadas tratam situações rotineiras por meio de regras, políticas e procedimentos pré-definidos; recusa com reagendamento previsto é o caso típico. Situações novas e complexas pedem decisões não programadas."},
{s:3,n:34,q:"Chefia não é sinônimo de influência, e influência não depende necessariamente de cargo. Sobre autoridade e poder, é correto afirmar que:",a:["são conceitos idênticos","a autoridade é informal, e o poder é formal","a autoridade dispensa legitimidade","o poder deriva apenas da capacidade de punir","a autoridade decorre do cargo (formal), enquanto o poder também resulta de relações e influência pessoal"],c:4,e:"Autoridade vem da posição formal na estrutura; poder é a capacidade de influenciar comportamentos e pode advir de múltiplas fontes (conhecimento, carisma, rede de relações) — alguém pode ter poder sem autoridade e vice-versa."},
{s:3,n:35,q:"O desempenho da equipe cresce quando o gestor sabe devolver informação útil ao colaborador. Um feedback de desempenho eficaz deve ser:",a:["genérico, para não constranger","composto apenas de elogios","público e punitivo","anual e burocrático","específico, baseado em fatos, orientado à melhoria e dado no momento adequado"],c:4,e:"Feedback eficaz é factual, específico, oportuno e construtivo: elogio só (ou crítica só) distorce; público e punitivo gera defesa, não aprendizado."},
{s:3,n:36,q:"Situação gerencial – O ACS nota aumento de ausências na equipe. A conduta mais adequada é:",a:["punir generalizadamente a equipe","ignorar o fenômeno","cortar direitos de todos","substituir a equipe inteira","investigar as causas (clima, saúde, condições de trabalho), dialogar com as pessoas e adotar medidas pertinentes"],c:4,e:"Aumento de ausências é sintoma, não causa: diagnóstico (clima, saúde, condições) e tratamento individual justo; punição coletiva piora o clima e penaliza assíduos."},
{s:3,n:37,q:"Situação gerencial – Dois recenseadores disputam a mesma oportunidade de treinamento. O ACS deve:",a:["escolher o mais simpático","negar a ambos, para evitar conflito","sortear entre os dois","aplicar critérios objetivos e transparentes (desempenho e requisitos), comunicando a decisão","favorecer quem pediu primeiro, informalmente"],c:3,e:"Justiça organizacional: critérios objetivos, divulgados e aplicáveis a todos previnem a percepção de favorecimento — que corrói a confiança na liderança."},
{s:3,n:38,q:"Situação gerencial – Chega reclamação de que um recenseador tratou um informante com rispidez. O ACS deve:",a:["desconsiderar a reclamação","punir o recenseador sem ouvi-lo","apurar os fatos, dar feedback imediato sobre a postura institucional esperada e, se grave, registrar e encaminhar conforme as normas","orientar a equipe a esconder o caso","deixar o próprio recenseador resolver sem qualquer acompanhamento"],c:2,e:"A postura com informantes é exigência institucional do IBGE: apuração (ouvir as partes), feedback imediato, registro e encaminhamento formal quando a gravidade justificar."},
{s:3,n:39,q:"Situação gerencial – Ao consolidar os números do mês, o ACS percebe que as metas parecem inatingíveis com a equipe atual. O ACS deve:",a:["pressionar a equipe com ameaças","apresentar ao ACR uma análise com dados e uma proposta de replanejamento ou de recursos","simular o cumprimento das metas","reduzir unilateralmente a qualidade exigida","culpar publicamente a equipe"],c:1,e:"Escalar problemas com dados e propostas (não apenas com queixas) é papel gerencial; simular dados ou sacrificar qualidade é inadmissível; ameaças destroem o desempenho."},
{s:3,n:40,q:"Situação gerencial – Uma instrução do ACR chegou ao ACS de forma ambígua, comportando mais de uma interpretação possível. O ACS deve:",a:["improvisar por conta própria","ignorar a instrução","pedir esclarecimento antes de executar, confirmando o entendimento","delegar a interpretação a um recenseador","executar da forma que der menos trabalho"],c:2,e:"Comunicação eficaz elimina a ambiguidade na fonte: confirmar o entendimento antes de agir evita retrabalho em cascata sobre toda a equipe."},
{s:3,n:41,q:"Situação gerencial – A equipe resiste ao novo sistema digital de acompanhamento. O ACS deve:",a:["implantar sem qualquer comunicação","desistir da mudança","ameaçar com desligamento","terceirizar a operação do sistema","envolver a equipe na implantação, treiná-la e demonstrar os benefícios práticos"],c:4,e:"Gestão de mudanças: participação, capacitação e percepção concreta de benefícios reduzem a resistência; imposição seca ou ameaça apenas aprofundam a rejeição."},
{s:3,n:42,q:"Situação gerencial – Há atrito entre a equipe de campo e o ACI quanto à guarda dos equipamentos. O ACS deve:",a:["deixar que resolvam entre si","culpar o ACI","escalar tudo ao AOR sem qualquer tratamento","proibir o contato entre as áreas","mediar o diálogo, esclarecer as atribuições de cada função e alinhar expectativas no objetivo comum da coleta"],c:4,e:"Mediação e esclarecimento de papéis (com base nas atribuições formais de cada função) resolvem conflitos interáreas sem escalonamento desnecessário ao AOR."},
{s:3,n:43,q:"Situação gerencial – Um recenseador excedeu sua autoridade ao prometer ao informante algo que não lhe competia. O ACS deve:",a:["realinhar os limites de responsabilidade, registrar a ocorrência e acompanhar; havendo prejuízo, tratar formalmente","elogiar a iniciativa","punir sem qualquer diálogo","transferi-lo imediatamente de setor","ignorar o fato"],c:0,e:"Excesso de autoridade exige realinhamento claro dos limites, registro da ocorrência e acompanhamento — punição sem diálogo não ensina, e ignorar sinaliza tolerância a excessos."},
{s:3,n:44,q:"Situação gerencial – Mesmo após o treinamento oferecido, erros recorrentes persistem no preenchimento dos questionários. O gestor deve:",a:["repetir exatamente o mesmo treinamento","punir quem erra","aceitar o erro como normal","trocar toda a equipe","investigar a causa raiz (método, carga, ferramenta) e ajustar o processo, em ciclo de melhoria contínua"],c:4,e:"Quando o treinamento não resolve, a causa está no processo: análise de causa raiz e melhoria contínua (ciclo PDCA) — repetir o mesmo treinamento ou trocar pessoas trata o sintoma, não a causa."},
{s:3,n:45,q:"Situação gerencial – Uma área interna reclama do atendimento do posto censitário. O ACS deve:",a:["ignorar a reclamação","transferir a culpa para a equipe","ouvir, priorizar conforme o impacto e estabelecer melhoria contínua no fluxo de atendimento","apenas responder formalmente, sem mudanças","extinguir o serviço reclamado"],c:2,e:"Clientes internos merecem a mesma qualidade dos externos: escuta ativa, priorização por impacto e melhoria do processo — resposta protocolar sem mudança real reprova no próximo contato."},
{s:3,n:46,q:"A posição do ACS na estrutura da operação é estratégica. Segundo o material do Censo, a função do ACS serve de elo entre:",a:["os produtores e a imprensa","os postos e as prefeituras","o CNQ e a FUNAI","o IBGE e as cooperativas","aqueles que coletam as informações e aqueles que gerenciam o posto censitário"],c:4,e:"O ACS é a ligação entre os Recenseadores (frente de coleta) e a gestão do posto — por isso sua posição exige tanto domínio técnico quanto gerencial."},
{s:3,n:47,q:"Entre as atribuições do ACS está gerir e responder alertas no SIGC. No material do Censo, essa sigla corresponde ao:",a:["Sistema Integrado de Gestão Censitária","Sistema de Informação Gerencial da Coleta","Serviço Integrado de Geoprocessamento do Censo","Sistema de Indicadores de Desempenho","Setor Integrado de Garantia da Qualidade"],c:3,e:"O material atribui ao ACS, entre outras tarefas, 'gerir e responder alertas no Sistema de Indicadores de Desempenho (SIGC)' — ao lado da análise dos relatórios de produção da coleta e do monitoramento da cobertura e do cronograma."},
{s:3,n:48,q:"O Recenseador dispõe, em campo, de uma ferramenta digital de trabalho. O DMC do Recenseador dá acesso a:",a:["apenas aos questionários","o mapa digital do setor (imagem de satélite), a lista de endereços e os questionários","apenas aos mapas","o Manual do Recenseador impresso","o MME completo do município"],c:1,e:"No DMC, o Recenseador acessa o mapa digital do setor (imagem de satélite com os limites destacados), a lista de endereços (prévia) e os questionários."},
{s:3,n:49,q:"O mapa do setor impresso contém informações nas duas faces. No mapa do Setor Censitário impresso, em seu VERSO, consta:",a:["a legenda de cores","o questionário do censo","a escala gráfica do mapa","a descrição dos limites do setor","o croqui do município"],c:3,e:"O material informa que, no verso do mapa do setor, consta a descrição dos seus limites — que também aparecem no descritivo."},
{s:3,n:50,q:"A interpretação correta dos símbolos cartográficos é essencial ao trabalho de campo. Sobre a leitura de mapas, o material do Censo orienta:",a:["nunca interpretar um símbolo no mapa sem antes consultar a legenda","interpretar os símbolos livremente, pela intuição","decorar todos os símbolos antes de ir a campo","dispensar a legenda em imagens de satélite","consultar a legenda apenas em caso de dúvida extrema"],c:0,e:"Regra expressa: 'Nunca interprete um símbolo no mapa sem antes consultar a legenda' — a legenda explica cores e estilos de representação de estradas, rios, vegetação e construções."},
{s:3,n:51,q:"A produção de legumes, verduras, plantas medicinais, condimentares e cogumelos é classificada, entre as atividades investigadas pelo Censo Agropecuário, como:",a:["lavoura temporária","lavoura permanente","horticultura","cultivo em outros meios","exploração de matas e florestas nativas"],c:2,e:"Horticultura é a produção de legumes, verduras, plantas medicinais, condimentares e cogumelos. Lavoura temporária nasce, cresce e é colhida no mesmo ano (milho, feijão); a permanente produz por muitos anos sem replantio (café, laranja); e a hidroponia é o exemplo de cultivo em outros meios."},
{s:3,n:52,q:"Os limites dos setores precisam ser identificáveis no terreno pela equipe de coleta. Os setores censitários rurais são FREQUENTEMENTE limitados por:",a:["cercas de arame","muros divisórios","linhas de transmissão elétrica","quebra-ventos","corpos hídricos (rios, córregos, riachos, lagos, mar etc.)"],c:4,e:"Corpos hídricos são delimitadores frequentes de setores rurais e facilitam identificar o limite entre setores vizinhos; rodovias, estradas e caminhos também são usados, além das linhas secas (retas não materializadas)."},
{s:3,n:53,q:"Segundo o material do Censo, sobre o Código de Endereçamento Postal (CEP), é correto afirmar que ele:",a:["é um cadastro de áreas de endereçamento mantido pela Empresa Brasileira de Correios e Telégrafos (ECT), constituído de oito dígitos","é mantido pelo IBGE e corresponde ao geocódigo do setor censitário","é atribuído, em regra, a uma única edificação","dispensa o registro do logradouro e da localidade em áreas rurais","é composto de seis dígitos atribuídos pelas prefeituras"],c:0,e:"O CEP é cadastro de áreas de endereçamento mantido pela ECT, com oito dígitos, atribuído a uma área de endereçamento. Em áreas de alta demanda postal, pode associar-se a uma localidade, um logradouro, um trecho do logradouro ou, em casos muito particulares, a uma única edificação."},
{s:3,n:54,q:"Ao longo de um logradouro, o Recenseador constata que várias unidades têm acesso pelo mesmo número. O componente do endereço que permite diferenciá-las é o:",a:["modificador, composto sempre por letras","complemento (lote, gleba, casa, frente, fundos, sobrado, sala, andar etc.)","CEP","ponto de referência, que substitui o número","geocódigo do setor"],c:1,e:"O complemento diferencia unidades com a mesma posição no logradouro: lote, gleba, casa, frente, fundos, sobrado, sala, andar são exemplos do material. O modificador atua sobre o número, não sobre unidades do mesmo número."},
{s:3,n:55,q:"Além do número, o endereço pode conter informações complementares que o tornam mais preciso. No registro de endereços, o modificador:",a:["é o valor numérico que indica a posição da edificação no logradouro","corresponde ao CEP de oito dígitos","é obrigatório em todos os endereços rurais","é informação alfanumérica associada ao número, que o diferencia quando há mais de uma posição no logradouro com a mesma numeração ou que acrescenta informação a ela","identifica a localidade do endereço"],c:3,e:"Modificador = informação alfanumérica ligada ao número (podendo existir ou não). O número é o valor numérico da posição da edificação; ambos podem ser registrados ou não, conforme o caso."},
{s:3,n:56,q:"Sendo a data de referência 31/12/2025 e o período de referência de 01/01/2025 a 31/12/2025, as informações coletadas deverão:",a:["considerar apenas a situação existente em 31/12/2025","considerar apenas os fatos ocorridos ao longo de 2025, ignorando a situação na data de referência","considerar a situação existente na data de referência e os acontecimentos ocorridos ao longo de todo o período","ser coletadas em 2025, antes do início da operação","referir-se sempre ao ano da coleta"],c:2,e:"Data de referência = momento específico; período de referência = intervalo considerado. As informações abrangem ambos: a situação na data e o transcorrido no período — distinção decisiva para classificar unidades e produtores sem área."},
{s:3,n:57,q:"São exemplos de atividades NÃO consideradas agropecuárias, florestais ou aquícolas para o Censo:",a:["a criação de abelhas para produção de mel","a criação de pássaros, cães e gatos, e a criação de animais destinados a experiências de laboratório e à produção de soros e vacinas","a aquicultura com criação de rãs e jacarés","o plantio de lavoura temporária","a coleta de frutos de matas nativas"],c:1,e:"Nem toda criação de animais configura atividade agropecuária: pássaros, cães, gatos e animais para laboratório/soros/vacinas ficam fora. Abelhas, rãs, jacarés, lavouras e extrativismo são investigados."},
{s:3,n:58,q:"Ao trabalhar em áreas de povos e comunidades tradicionais, o Recenseador deve saber que o pertencimento étnico:",a:["é verificado por meio da documentação apresentada pelo informante","é inferido pelo Recenseador a partir de características observadas em campo","é determinado pela liderança comunitária antes do início da entrevista","restringe-se a um único pertencimento por pessoa","é autodeclaratório e uma mesma pessoa pode se reconhecer como pertencente a mais de uma comunidade tradicional"],c:4,e:"O material orienta que o pertencimento étnico é autodeclaratório: a identificação é registrada com base na declaração do próprio informante, sem questionamentos, julgamentos ou tentativas de correção. Além disso, a identidade não se limita a um único pertencimento — uma mesma pessoa pode se reconhecer em mais de uma comunidade tradicional."},
{s:3,n:59,q:"Um estabelecimento existente na data de referência iniciou a exploração no período, mas não teve produção (pés em idade não produtiva). O procedimento correto é:",a:["não recenseá-lo, pois não houve produção","recenseá-lo e registrar no campo Observações do DMC o motivo da ausência de produção","recenseá-lo apenas no Censo seguinte","excluí-lo da lista prévia de endereços","atribuir produção estimada com base na área"],c:1,e:"Estabelecimentos existentes na data de referência são recenseados mesmo sem produção no período, com pés novos, ou com perda por razões climáticas — registrando o motivo no campo Observações do DMC. Estimar produção é fraude."},
{s:3,n:60,q:"Um estabelecimento em fase de partilha é recenseado como um único estabelecimento quando há consenso entre os herdeiros. Nesse caso, as informações devem ser prestadas:",a:["por todos os herdeiros, em questionários separados","pelo inventariante, por seu representante legal ou pelo condômino responsável","pelo juiz responsável pelo processo","pelo ACS responsável pelo setor","pelo produtor vizinho mais antigo"],c:1,e:"Com consenso: um único estabelecimento, informando o inventariante/representante legal/condômino responsável. Sem consenso, se cada herdeiro ocupa uma parte, cada parte é um estabelecimento; em litígio, produtor = quem era responsável economicamente pela exploração na data de referência."},

/* ==================== SIMULADO 4 ==================== */
{s:4,n:1,t:4,q:"O texto descreve com detalhes o momento em que a leitura é concluída. Dona Aurora sorriu ao final da leitura porque:",a:["a carta trazia novidades surpreendentes","desejava comprar papel novo na papelaria","a letra da remetente estava firme como antes","reconheceu que a repetição é a própria graça das velhas amizades","guardava mágoa antiga da remetente"],c:3,e:"O texto explicita: 'é justamente essa a graça das velhas amizades — dizer o mesmo, e ouvir o mesmo, como se fosse a primeira vez'. O sorriso decorre do reconhecimento do valor da repetição, não de novidade alguma."},
{s:4,n:2,t:4,q:"A conjunção 'embora' (A letra, embora trêmula, conservava a firmeza...) introduz ideia de:",a:["concessão","conclusão","finalidade","oposição entre fatos excludentes","alternância"],c:0,e:"'Embora' é concessivo: admite um fato contrário ao afirmado no principal, sem impedi-lo (a letra é trêmula E, ainda assim, firme). Concessão ≠ oposição: na oposição, os fatos se excluem."},
{s:4,n:3,t:4,q:"A frase 'Leu-a duas vezes, sem pressa' é complementada por uma comparação de sabor. A comparação 'como quem saboreia um prato antigo' indica que a leitura foi feita:",a:["com pressa, para logo terminar","com desconforto e esforço","com prazer e lentidão, degustando cada detalhe","por obrigação protocolar","em voz alta, para terceiros"],c:2,e:"O comparativo sugere degustação: leu duas vezes, sem pressa, com o prazer de quem saboreia algo familiar e estimado — coerente com o tom afetivo do trecho."},
{s:4,n:4,q:"Em frases extraídas do cotidiano do posto, o emprego da crase é posto à prova. Assinale a alternativa em que o emprego da crase está CORRETO:",a:["Comprou o equipamento à prazo.","Andou à cavalo até a fazenda.","Chegou à Brasília antes do meio-dia.","Entregou o equipamento à coordenadora do posto.","A coleta começará à partir de maio."],c:3,e:"Crase antes de feminino determinado (à coordenadora). Não há crase antes de masculino (a prazo, a cavalo), em 'a partir de' nem diante de nome de cidade sem artigo (chegou a Brasília)."},
{s:4,n:5,q:"Um recenseador redigiu cinco frases sobre o trabalho no IBGE. Assinale a frase com concordância verbal CORRETA:",a:["Faziam dez anos que ele trabalhava no IBGE.","Fazia dez anos que ele trabalhava no IBGE.","Houveram falhas na transmissão dos dados.","Existe setores pendentes no mapa.","Devem haver falhas no sistema."],c:1,e:"'Fazer' temporal e 'haver' (existir) são impessoais: fazia, houve, deve haver. 'Existir' é pessoal: existem setores."},
{s:4,n:6,q:"A concordância nominal exige atenção especial com palavras como 'anexo', 'meio' e 'sós'. Assinale a alternativa correta quanto à concordância nominal:",a:["As recenseadoras viajaram sós para o setor.","Segue anexo as fotos do estabelecimento.","É necessária o uso do EPI em campo.","Elas mesmo resolveram o problema da rota.","Comprei meio dúzia de mapas atualizados."],c:0,e:"'Sós' (= sozinhas, adjetivo) concorda com o feminino plural. Anexo → seguem anexas; com artigo, 'é necessário o uso'; mesma → elas mesmas; meio (numeral) → meia dúzia."},
{s:4,n:7,q:"Dúvidas de regência surgem até em frases simples do cotidiano do posto. Assinale a alternativa em que a regência está de acordo com a norma-padrão:",a:["O candidato aspira o cargo de supervisor.","Todos assistiram o vídeo de treinamento ontem.","Chegamos ao posto de coleta antes das oito horas.","O recenseador implicou em demora na entrevista.","O produtor obedeceu o regulamento do posto."],c:2,e:"'Chegar' no sentido de atingir um destino exige preposição 'a': chegamos ao posto. Aspirar (desejar), assistir (ver) e obedecer também pedem 'a' (aspira ao, assistiram ao, obedeceu ao); e implicar (acarretar) é transitivo direto (implicou demora)."},
{s:4,n:8,q:"Considere a frase que qualifica o recenseador e suas variantes de pontuação. Assinale a alternativa pontuada CORRETAMENTE:",a:["O recenseador, diligente e pontual concluiu a rota.","O recenseador, diligente e pontual, concluiu a rota.","O recenseador diligente, e pontual concluiu a rota.","O recenseador diligente e pontual concluiu, a rota.","O recenseador, diligente, e pontual, concluiu a rota."],c:1,e:"Adjetivos explicativos intercalados devem ser isolados por vírgulas — abrindo E fechando o intercalado. A alternativa A abre, mas não fecha, o intercalado; C e E retalham a sequência de adjetivos; D insere vírgula entre verbo e objeto."},
{s:4,n:9,q:"Em 'É dever do servidor observar as normas da instituição', o verbo 'observar' equivale a:",a:["vigiar","olhar","examinar minuciosamente","acatar","notar"],c:3,e:"No sentido de cumprir regras, 'observar' = acatar, respeitar — e não vigiar (monitorar) nem notar (perceber). Polissemia contextualizada, marca típica de banca."},
{s:4,n:10,q:"No vocabulário dos processos seletivos, adjetivos como 'equânime' qualificam avaliadores. Assinale o ANTÔNIMO de 'equânime':",a:["justo","sereno","prudente","parcial","imparcial"],c:3,e:"Equânime = justo, imparcial, sereno no julgamento. O antônimo exato é parcial (que toma partido)."},
{s:4,n:11,q:"Complete: 'O ______ do questionário foi rápido; o ACS conferiu o ______ do perímetro do setor.'",a:["cumprimento / comprimento","comprimento / cumprimento","cumprimento / cumprimento","comprimento / comprimento","comprimento / cumprimenta"],c:0,e:"Cumprimento = execução, realização; comprimento = extensão, medida. Parônimos clássicos de troca fácil."},
{s:4,n:12,q:"Considere o período: 'Se o tempo melhorar, a coleta prosseguirá amanhã'. Nele, a palavra 'se' classifica-se como:",a:["advérbio","pronome","conjunção subordinativa condicional","preposição","interjeição"],c:2,e:"'Se' introduce oração adverbial condicional, formulando a hipótese de que depende o futuro da principal."},
{s:4,n:13,q:"A classificação do sujeito depende do verbo empregado. Assinale a alternativa em que a oração é classificada como oração sem sujeito:",a:["Precisa-se de recenseadores dedicados.","Compraram-se mapas atualizados.","Choveu forte na serra durante a madrugada.","Falaram mal do coordenador na reunião.","Chegaram cedo os dois recenseadores."],c:2,e:"Verbo de fenômeno da natureza (chover) é impessoal: oração sem sujeito. 'Precisa-se de' (índice de indeterminação) e 'falaram mal' (3ª pessoa do plural sem agente) = sujeito indeterminado; 'compraram-se mapas' = passiva (sujeito paciente: mapas); 'chegaram os dois recenseadores' = sujeito posposto."},
{s:4,n:14,q:"Cinco palavras correntes no vocabulário administrativo foram grafadas de maneiras distintas. Assinale a palavra CORRETAMENTE acentuada:",a:["ônibus","ítems","juíz","vôo","rúbrica"],c:0,e:"'Ônibus' é proparoxítona: todas são acentuadas. Grafias corretas das demais: itens, juiz, voo e rubrica — todas sem acento."},
{s:4,n:15,q:"Qual reescrita do aviso 'O chefe mandou avisar que a reunião foi cancelada' mantém clareza, impessoalidade e padrão formal?",a:["O chefe deu um toque que não vai ter reunião.","A reunião caiu, segundo o chefe.","Comunicamos que a reunião prevista foi cancelada.","Cancelaram a parada da reunião.","Parece que a reunião não rola mais."],c:2,e:"Comunicação oficial: registro formal, impessoalidade e objetividade — sem coloquialismos ('toque', 'caiu', 'parada', 'rolar') nem vagueza ('parece')."},
{s:4,n:16,q:"Um preço sofreu aumento de 20% e, sobre o novo valor, novo aumento de 25%. O aumento total equivale a:",a:["45%","50%","55%","47,5%","40%"],c:1,e:"Fator = 1,20 × 1,25 = 1,50 → aumento de 50%. Somar as porcentagens (45%) ignora que a segunda incide sobre base já majorada."},
{s:4,n:17,q:"Dois recenseadores iniciam hoje, no mesmo posto, seus percursos de revisão: um retorna ao posto a cada 4 dias e o outro, a cada 6 dias. Voltarão a se encontrar no posto, simultaneamente, dali a:",a:["8 dias","10 dias","12 dias","24 dias","2 dias"],c:2,e:"O primeiro encontro simultâneo ocorre no mínimo múltiplo comum de 4 e 6: MMC = 2² × 3 = 12 dias. A alternativa D (24) é o produto 4 × 6; a E (2) é o MDC; a A (8) é apenas múltiplo de 4."},
{s:4,n:18,q:"Ao revisar a numeração dos lotes conferidos, o ACS anotou a sequência: 1, 2, 3, 5, 8, 13, ... Assinale o próximo termo da sequência:",a:["18","20","21","24","26"],c:2,e:"Cada termo é a soma dos dois anteriores: 1+2=3; 2+3=5; 3+5=8; 5+8=13; portanto, 8+13=21. Assinalar 26 (dobro de 13) ou 18 (somar 13 ao termo 5, em vez do 8) são os erros típicos."},
{s:4,n:19,q:"A proposição 'Se o questionário foi transmitido, então a coordenada de localização foi registrada' é logicamente equivalente a:",a:["Se a coordenada de localização não foi registrada, então o questionário não foi transmitido","Se a coordenada de localização foi registrada, então o questionário foi transmitido","O questionário foi transmitido e a coordenada não foi registrada","Se o questionário não foi transmitido, então a coordenada não foi registrada","A coordenada foi registrada, mas o questionário não foi transmitido"],c:0,e:"Toda condicional P → Q equivale à sua contrapositiva ¬Q → ¬P: negado o consequente (coordenada não registrada), nega-se o antecedente (questionário não transmitido). As alternativas B e D são, respectivamente, a conversa e a inversa — não equivalentes; C e E contrariam a própria condicional."},
{s:4,n:20,q:"Durante uma pausa no posto, lançam-se dois dados honestos. A probabilidade de a soma dos pontos ser maior que 10 é:",a:["1/12","1/18","1/9","1/6","1/4"],c:0,e:"Casos com soma 11 ou 12: (5,6), (6,5), (6,6) = 3 em 36 = 1/12. Confundir com 'maior ou igual a 10' (6/36 = 1/6) é a pegadinha."},
{s:4,n:21,q:"A média de quatro provas é 7. Para que a média de cinco provas atinja 7,5, a nota da quinta prova deverá ser:",a:["8","9,5","9","8,5","10"],c:1,e:"Soma atual: 4 × 7 = 28; soma alvo: 5 × 7,5 = 37,5; quinta nota = 9,5. Responder 8,5 iguala a média a 7,3 — erro de base."},
{s:4,n:22,q:"Em um mapa na escala 1:250.000, a distância entre dois pontos mede 4 cm. A distância real corresponde a:",a:["10 km","100 km","1 km","25 km","4 km"],c:0,e:"4 × 250.000 = 1.000.000 cm = 10.000 m = 10 km. A resposta 100 km erra por um fator de 10 na conversão."},
{s:4,n:23,q:"Em um ranking de produtividade entre quatro equipes, a equipe A está adiante da B, que está adiante da C; a equipe D está entre B e C. A ordem, da primeira para a última, é:",a:["A, B, D, C","A, D, B, C","D, A, B, C","A, B, C, D","B, A, D, C"],c:0,e:"A > B > C, com D entre B e C: A, B, D, C. A alternativa B coloca D antes de B, contradizendo 'D está entre B e C'."},
