{s:6,n:42,q:"Situação gerencial – O recenseador de melhor desempenho da equipe pede transferência para um posto mais próximo da família. Você deve:",a:["recusar o pedido, para não perder o melhor elemento da equipe","ouvir as razões, reconhecer o desempenho, verificar as alternativas previstas nas regras e encaminhar formalmente — sem prometer o que não depende de você","prometer a transferência imediata, como forma de retê-lo","oferecer recompensas futuras para convencê-lo a ficar","ignorar o pedido até o encerramento da coleta"],c:1,e:"Motivação de pedido pessoal merece escuta e reconhecimento; a resposta gerencial é encaminhar pelas vias próprias, com honestidade sobre o que está ao seu alcance. Prometer sem poder cumprir destrói a confiança; reter à força ou ignorar degrada o comprometimento que se quer preservar."},
{s:6,n:43,q:"Situação gerencial – Você distribuiu, por engano, um setor já concluído a um recenseador, que desperdiçou a manhã de trabalho nele. A atitude gerencial mais adequada é:",a:["atribuir a falha ao sistema de monitoramento, para não abalar a autoridade","sugerir ao recenseador que registre a jornada como treinamento","ignorar o episódio, pois falhas de planejamento são inevitáveis","assumir o erro abertamente, corrigir a distribuição com o mínimo de retrabalho e rebalancear a carga de forma justa","pedir que o recenseador compense a manhã perdida estendendo a jornada por conta própria"],c:3,e:"Credibilidade de liderança constrói-se com responsabilidade assumida: reconhecer o erro, corrigir rápido e reparar o desequilíbrio criado. Transferir a culpa ao sistema, disfarçar o prejuízo ou fazê-lo pagar pelo erro do gestor corroem a confiança da equipe."},
{s:6,n:44,q:"Situação gerencial – O informante só aceita conceder a entrevista se receber, em troca, acesso individual aos dados da pesquisa. O recenseador deve ser orientado a:",a:["prometer o acesso aos dados, para garantir a entrevista","fornecer os dados agregados dos vizinhos, para efeito de comparação","esclarecer que a pesquisa tem finalidade estatística e é protegida por sigilo, não sendo divulgados dados individuais — e registrar a recusa, caso ela se mantenha","encerrar imediatamente o contato e acionar a polícia militar","responder o questionário com base em informações de terceiros conhecidos"],c:2,e:"A finalidade das pesquisas do IBGE é estritamente estatística, e o sigilo das informações individuais é obrigação legal. A conduta é esclarecer com cortesia e, mantida a exigência, registrar a recusa — jamais barganhar, trocar dados ou inventar respostas."},
{s:6,n:45,q:"Situação gerencial – Você precisará se ausentar por dois dias e o andamento da coleta não pode parar. A providência mais adequada é:",a:["deixar que a equipe se oriente apenas pelos manuais durante a ausência","centralizar todas as decisões para o seu retorno","transferir integralmente suas atribuições ao ACR, que já tem a própria função","suspender a coleta pelos dois dias","designar previamente um substituto eventual, transmitir-lhe as informações necessárias e delimitar claramente o que ele pode decidir em seu nome"],c:4,e:"Continuidade do serviço prepara-se antes: substituto designado com legitimidade, informação suficiente e limites claros de decisão. Improvisar com manuais, acumular tudo para o retorno, sobrecarregar outra função ou parar a operação são alternativas que fragilizam a coleta."},
{s:6,n:46,q:"Na definição do estabelecimento agropecuário, um componente orienta onde a unidade é recenseada. Segundo o material do Censo, na conceituação de estabelecimento agropecuário, a Sede é:",a:["a maior construção existente no estabelecimento","o município em que o produtor reside","o local destinado à administração dos trabalhos do estabelecimento, desde que situado na sua área — em muitos casos, a própria residência do produtor","o posto censitário responsável pelo setor","a parcela do estabelecimento com maior produção"],c:2,e:"A Sede é o local destinado à administração dos trabalhos do estabelecimento, desde que localizada na sua área; em muitos casos, é a residência do produtor. É ela que determina em que setor — e, entre municípios, em que município — o estabelecimento é recenseado."},
{s:6,n:47,q:"Antes da coleta, a operação desenha cuidadosamente as áreas de trabalho. No planejamento dos setores censitários do Censo Agropecuário, busca-se que eles:",a:["tenham dimensões adequadas à carga de trabalho da coleta e respeitem a divisão político-administrativa brasileira","tenham sempre a mesma área em quilômetros quadrados","coincidam com os limites das propriedades rurais","sejam delimitados exclusivamente por rios e estradas","acompanhem a malha dos bairros urbanos"],c:0,e:"A extensão territorial e o número de estabelecimentos do setor influenciam a carga de trabalho; por isso, os setores são planejados com dimensões adequadas ao trabalho das pesquisas do IBGE e respeitando a divisão político-administrativa brasileira."},
{s:6,n:48,q:"Sobre registros de endereços e entrevistas realizados FORA da área na qual o Recenseador foi designado, o material do Censo estabelece que ele:",a:["pode realizá-los se o informante solicitar","não deve realizá-los: os limites do setor delimitam a sua área de trabalho","deve registrá-los e repassá-los ao Recenseador responsável","deve registrá-los apenas quando o setor vizinho estiver concluído","pode fazê-los com autorização verbal de outro Recenseador"],c:1,e:"O setor delimita a área de coleta sob responsabilidade do Recenseador: não devem ser realizados registros de endereços nem entrevistas fora da área na qual ele foi designado — cada área tem um responsável definido."},
{s:6,n:49,q:"No descritivo do setor, o item 'Acessibilidade e Observações' — por exemplo, 'RESTRIÇÃO DE ACESSO: ACESSO FLUVIAL A PARTIR DO POLO BASE' — indica que:",a:["o setor não pode ser recenseado","o acesso é restrito a servidores do IBGE","o polo base substitui o posto censitário na área","o acesso ao setor é feito por via fluvial, podendo exigir embarcação e maior tempo de deslocamento — situação que demanda planejamento logístico prévio","a coleta somente pode ocorrer no período seco"],c:3,e:"O registro exemplifica que o acesso é feito por rio: pode haver necessidade de embarcação e o deslocamento será mais demorado. Situações assim exigem planejamento logístico prévio junto à supervisão — não impedem a coleta."},
{s:6,n:50,q:"Aglomerados rurais ou localidades indígenas que, por não atingirem a quantidade mínima de domicílios, não foram destacados em setores censitários próprios devem ser:",a:["excluídos da coleta do Censo Agropecuário","recenseados apenas pelo supervisor do posto","agregados administrativamente ao setor urbano mais próximo","registrados apenas como pontos de referência","recenseados normalmente no setor em que se encontram, com atenção especial quanto ao acesso e à abordagem"],c:4,e:"São as 'estruturas territoriais não setorizadas': por não conterem a quantidade mínima de domicílios para formar setor, são recenseadas normalmente dentro do setor, exigindo atenção especial ao acesso e à abordagem."},
{s:6,n:51,q:"As atribuições do Recenseador estão definidas nos documentos operacionais da pesquisa. NÃO constitui atribuição do Recenseador, conforme o material do Censo:",a:["definir e alterar os limites do setor censitário","realizar a coleta regular de dados conforme os manuais técnicos e operacionais","agendar entrevistas, se solicitado pelo informante, e gerenciar sua realização","zelar pela integridade do Dispositivo Móvel de Coleta","zelar pela confidencialidade das informações coletadas"],c:0,e:"Cabe ao Recenseador coletar conforme os manuais, ir a campo diariamente seguindo a rota, abordar e entrevistar, registrar e transmitir dados, agendar entrevistas quando solicitado e zelar pelo DMC e pelo sigilo. Definir ou alterar limites do setor não lhe compete — em hipótese alguma o perímetro pode ser alterado por ele."},
{s:6,n:52,q:"Sempre que requisitado, o Recenseador deverá comparecer ao Posto censitário para que o supervisor avalie seu trabalho. Se a supervisão indicar a necessidade de corrigir algum dado coletado, o Recenseador:",a:["poderá corrigi-lo de memória, diretamente no sistema","deverá retornar a campo para efetuar a correção","ficará dispensado da correção se já tiver transmitido os dados","encaminhará o caso ao Centro Nacional de Qualidade","solicitará que o informante compareça ao posto"],c:1,e:"A correção de dado coletado exige verificação no local: o Recenseador retorna a campo. O posto censitário é o local de trabalho temporário criado pelo IBGE para dar suporte à operação, onde se avaliam os trabalhos e se corrigem possíveis falhas."},
{s:6,n:53,q:"Entre os objetivos do 12º Censo Agropecuário, Florestal e Aquícola está estruturar um cadastro de estabelecimentos agropecuários específico, destinado a:",a:["substituir o Código de Endereçamento Postal","controlar o pagamento de benefícios rurais","fiscalizar o cumprimento da legislação ambiental","viabilizar a implementação de pesquisas amostrais","registrar a titularidade das terras para fins cartoriais"],c:3,e:"O material lista como objetivo estruturar um cadastro de estabelecimentos agropecuários específico para a implementação de pesquisas amostrais — base para investigações posteriores com amostras."},
{s:6,n:54,q:"Quanto à abrangência, os resultados do Censo Agropecuário são referidos ao nível dos Municípios e permitem agregações e análises por diferentes recortes territoriais, como:",a:["bairros e quadras urbanas","zonas eleitorais","regiões administrativas das prefeituras","distritos industriais","Unidades de Conservação, Terras Indígenas, Territórios Quilombolas, Biomas e Projetos de Assentamento"],c:4,e:"Os resultados referem-se ao nível dos Municípios e permitem agregações e análises por recortes como Unidades de Conservação, Terras Indígenas, Territórios Quilombolas oficialmente delimitados, Biomas e Projetos de Assentamentos."},
{s:6,n:55,q:"As informações geradas pelo Censo Agropecuário possibilitam, por exemplo, a avaliação de políticas públicas como:",a:["o Bolsa Família e o piso do salário mínimo","o ProUni e o FIES","o Programa Nacional de Fortalecimento da Agricultura Familiar (Pronaf)","o Código Florestal e o licenciamento ambiental","o Imposto Territorial Rural (ITR)"],c:2,e:"O material cita expressamente o Pronaf como exemplo de política pública cuja avaliação é possibilitada pelas informações do Censo — ao lado de estudos sobre a expansão das fronteiras agrícolas e indicadores ambientais."},
{s:6,n:56,q:"O registro dos endereços segue normas expressas no material da operação. Nos componentes do endereço, o material do Censo proíbe expressamente:",a:["o uso de pontos de referência em áreas urbanas","a identificação de pessoas, por ferir o sigilo estatístico que o IBGE tem obrigação legal de preservar","o registro do complemento quando mais de uma unidade compartilha o mesmo número","a menção a rios e estradas no descritivo do setor","o uso da localidade em endereços rurais"],c:1,e:"'Não é permitido identificar pessoas nos componentes dos endereços': isso fere o sigilo estatístico que o IBGE tem obrigação legal de preservar. Pontos de referência, complementos e localidade são componentes legítimos do endereço."},
{s:6,n:57,q:"Para estimar distâncias rapidamente com a escala gráfica do mapa impresso, o material do Censo ensina que se pode:",a:["contar as curvas de nível entre os dois pontos","multiplicar a distância medida pelo número do setor","utilizar exclusivamente o receptor de GPS","medir a distância com os dedos — polegar e indicador — diretamente na escala gráfica e transferi-la para o trecho desejado do mapa","converter todas as medidas para pés e milhas"],c:3,e:"Além da régua e do cálculo pela escala numérica, o material ensina o método rápido de medir com os dedos (polegar e indicador) diretamente na escala gráfica e transferir a abertura para o trecho do mapa."},
{s:6,n:58,q:"As áreas de Povos e Comunidades Tradicionais podem ser organizadas em três categorias, que compreendem, respectivamente:",a:["municípios, estados e grandes regiões","agrovilas, povoados e vilas","áreas urbanas, rurais e periurbanas","terras particulares, reservas legais e parques estaduais","territórios oficialmente reconhecidos pelo Estado brasileiro; agrupamentos identificados pelo IBGE; e Áreas de Interesse Operacional delimitadas para a operação censitária"],c:4,e:"As três categorias são: territórios oficialmente reconhecidos pelo Estado brasileiro (terras indígenas, territórios quilombolas, unidades de conservação e parte dos projetos de assentamento); agrupamentos identificados pelo IBGE (indígenas e quilombolas); e AIOs de povos e comunidades tradicionais."},
{s:6,n:59,q:"As coordenadas geográficas obtidas por meio do receptor de sinais de satélites, como o GPS integrado ao DMC, constituirão importante recurso para:",a:["substituir o registro do endereço do estabelecimento","delimitar o perímetro do setor censitário","associar os pontos de coordenadas aos endereços","calcular a área dos estabelecimentos agropecuários","definir o geocódigo do setor"],c:2,e:"As coordenadas, capturadas com o receptor acoplado ao DMC, servem para associar os pontos de coordenadas aos endereços — método eficiente de localização que complementa, e não substitui, o registro do endereço."},
{s:6,n:60,q:"Durante a coleta, além dos questionários respondidos, o Recenseador deve registrar e transmitir os dados levantados, incluindo:",a:["apenas o total de estabelecimentos visitados no dia","o nome completo dos informantes, para fins de auditoria","cópias dos documentos pessoais do produtor","a placa dos veículos do estabelecimento","fotos, parcelas e coordenadas"],c:4,e:"Entre as atribuições do Recenseador está registrar e transmitir os dados levantados durante a coleta, incluindo fotos, parcelas, coordenadas e questionários respondidos. Identificação nominal de informantes fere o sigilo estatístico."}

  while(host.children.length>=2)host.firstChild.remove();

    const done=v=>{document.removeEventListener('keydown',kh,true);host.innerHTML='';res(v);};
    $('dlgNo').onclick=()=>done(false);

    setTimeout(()=>{const y=$('dlgYes');if(y)y.focus();},40);
  });
}

/* ============ SOM (WebAudio) E VIBRAÇÃO ============ */
let AC=null;
function beep(freqs,dur,type,vol){
  if(!state.set.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime;vol=vol||.1;
    freqs.forEach((f,i)=>{
      const osc=AC.createOscillator(),g=AC.createGain();
      osc.type=type||'sine';osc.frequency.value=f;
      g.gain.setValueAtTime(0,t0+i*.09);
      g.gain.linearRampToValueAtTime(vol,t0+i*.09+.015);
      g.gain.exponentialRampToValueAtTime(.0001,t0+i*.09+dur);
      osc.connect(g);g.connect(AC.destination);
      osc.start(t0+i*.09);osc.stop(t0+i*.09+dur+.03);
    });
  }catch(e){}
}

/* ============ BARRA DE PROGRESSO ONDULADA (M3 Expressive) ============ */
const WAVIES=[];
setInterval(function(){for(var i=WAVIES.length-1;i>=0;i--){if(!WAVIES[i].el.isConnected)WAVIES[i].destroy();}},3000);
let wavyColors={track:'#E6E0E9',fill:'#6750A4'};
function refreshWavyColors(){
  const cs=getComputedStyle(document.documentElement);
  wavyColors.track=(cs.getPropertyValue('--surface-chh')||'#E6E0E9').trim();
  wavyColors.fill=(cs.getPropertyValue('--primary')||'#6750A4').trim();
}
function makeWavy(container){
  const c=document.createElement('canvas');
  container.innerHTML='';container.appendChild(c);
  const w={el:container,cv:c,ctx:c.getContext('2d'),pct:0,phase:0,raf:null,last:0};
  function size(){
    const r=container.getBoundingClientRect();if(r.width<4)return false;
    const d=window.devicePixelRatio||1;
    c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);
    w.ctx.setTransform(d,0,0,d,0,0);w.w=r.width;w.h=r.height;return true;
  }
  function draw(ts){
    if(!w.w&&size()===false)return;
    const ctx=w.ctx,Wd=w.w,H=w.h;
    if(ts&&w.last)w.phase+=((ts-w.last)/1000)*4.4;
    w.last=ts||0;
    ctx.clearRect(0,0,Wd,H);
    const r=H/2;
    ctx.beginPath();
    roundRect(ctx,0,0,Wd,H,r);
    ctx.fillStyle=wavyColors.track;ctx.fill();
    const xf=Math.max(r,Math.min(Wd-r,Wd*w.pct));
    if(xf>r*.8){
      const lw=H*.58,amp=H*.22,cy=H/2,wl=26;
      ctx.beginPath();
      ctx.lineCap='round';ctx.lineWidth=lw;ctx.strokeStyle=wavyColors.fill;
      ctx.moveTo(r,cy);
      for(let x=r;x<=xf;x+=2){
        const y=cy+Math.sin((x/wl)*Math.PI*2-w.phase)*amp;
        ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
  }
  function loop(ts){
    if(!container.isConnected){w.destroy();return;}
    w.raf=requestAnimationFrame(loop);
    if(document.hidden||container.offsetParent===null)return;
    draw(ts);
  }
  w.set=function(p){
    w.pct=Math.max(0,Math.min(1,p));
    if(reducedMotion()){cancelAnimationFrame(w.raf);w.raf=null;draw(0);}
    else if(!w.raf){w.last=0;w.raf=requestAnimationFrame(loop);}
    else draw(0);
  };
  w.destroy=function(){cancelAnimationFrame(w.raf);if(w._ro)w._ro.disconnect();const ix=WAVIES.indexOf(w);if(ix>=0)WAVIES.splice(ix,1);};
  const ro=new ResizeObserver(()=>{if(size())draw(0);});
  ro.observe(container);
  w._ro=ro;
  WAVIES.push(w);
  size();
  return w;
}
function roundRect(ctx,x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ============ MÉTRICAS: TEMPO, DIAS, STREAK, XP ============ */
function fmtTime(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');}
function fmtDur(s){if(s<60)return s+'s';const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h?h+'h '+m+'min':m+'min';}
function fmtDay(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
function todayKey(){return fmtDay(new Date());}
function markDaily(){
  const k=todayKey();
  state.stats.days[k]=(state.stats.days[k]||0)+1;
  const g=state.set.goal;
  if(state.stats.days[k]===g&&state.stats.goalHitDay!==k){
    state.stats.goalHitDay=k;
    if(!inExamNow()){toast('Meta diária batida: '+g+' questões hoje!','target');SFX.ach();vib([30,40,30]);}
  }
}
function calcStreak(){
  const d=state.stats.days||{};
  let dt=new Date();dt.setHours(12,0,0,0);
  if(!d[fmtDay(dt)]){dt=new Date(dt.getTime()-864e5);if(!d[fmtDay(dt)])return 0;}
  let n=0;
  while(d[fmtDay(dt)]){n++;dt=new Date(dt.getTime()-864e5);}
  return n;
}

const LVL_TITLES=['Recruta do Censo','Aprendiz Censitário','Assistente de Campo','Agente Dedicado','ACS em Treinamento','Supervisor Júnior','Supervisor Pleno','Supervisor Sênior','Estrategista do Censo','Mestre do Censo','Lenda Censitária'];
function lvlOf(xp){let l=1,need=60,acc=0;while(xp>=acc+need){acc+=need;l++;need=60+(l-1)*30;}return{l:l,cur:xp-acc,need:need,base:acc};}
function lvlTitle(l){return LVL_TITLES[Math.min(l-1,LVL_TITLES.length-1)];}
function addXP(n){
  if(n<=0)return;
  const before=lvlOf(state.stats.xp).l;
  state.stats.xp+=n;
  const af=lvlOf(state.stats.xp);
  if(af.l>before&&!inExamNow()){toast('Subiu para o nível '+af.l+' — '+lvlTitle(af.l)+'!','trophy');SFX.ach();vib([30,50,30]);}
}
function masteryOf(k){
  const a=state.ans[k],rs=state.rs[k]||{r:0,w:0};
  if(!a&&!rs.r&&!rs.w)return null;
  const sc=(a?(a.ok?1:-1):0)+rs.r-rs.w;
  return sc>=2?'dom':(sc<=-1?'fragil':'aprendendo');
}
function masteryCounts(){
  let dom=0,apr=0,frg=0;
  Object.keys(state.ans).concat(Object.keys(state.rs)).forEach(k=>{
    const m=masteryOf(k);
    if(m==='dom')dom++;else if(m==='fragil')frg++;else if(m)apr++;
  });
  return{dom:dom,apr:apr,frg:frg};
}

function statsFor(s){let a=0,c=0;for(let n=1;n<=60;n++){const k=s+'-'+n;if(state.ans[k]){a++;if(state.ans[k].ok)c++;}}return{a:a,c:c};}
function countAnswered(sim){let c=0;for(let n=1;n<=60;n++)if(state.ans[sim+'-'+n])c++;return c;}
function allSimuladosDone(){for(let s=1;s<=N_SIMS;s++){const st=statsFor(s);if(!(state.fins[s]||st.a===60))return false;}return true;}
const MODE_DESC={estudo:'Feedback imediato: cada resposta é comentada na hora. Ideal para aprender o conteúdo.',simulado:'Prova fiel: cronômetro de 4h, sem feedback durante a prova. A correção comentada aparece apenas ao finalizar o caderno.'};

/* ============ PWA — CRIAR APLICATIVO (instalação) ============ */
/* Gera manifest em runtime (Blob). Ícones: quando o app está hospedado
   (p.ex. GitHub Pages) e os arquivos de ícone existem na raiz, ao lado do
   HTML (icon-192/512.png, icon-maskable-*.png), eles são usados no manifest
   e no instalador; caso contrário, desenha ícones em canvas como fallback.
   Aproveita o beforeinstallprompt dos navegadores que suportam PWA. */
const PWA={
  evt:null,installed:false,manifestIn:false,useFiles:false,
  isStandalone(){return !!(window.matchMedia&&(window.matchMedia('(display-mode: standalone)').matches||window.matchMedia('(display-mode: fullscreen)').matches))||window.navigator.standalone===true;},
  secure(){return location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';},
  makeIcon(size,maskable){
    const cv=document.createElement('canvas');cv.width=cv.height=size;
    const x=cv.getContext('2d');
    const pal=PALS.find(p=>p[0]===state.set.pal)||PALS[0];
    const g=x.createLinearGradient(0,0,size,size);
    g.addColorStop(0,pal[2]);g.addColorStop(1,pal[3]);
    if(maskable){x.fillStyle=g;x.fillRect(0,0,size,size);}
    else{
      const r=size*.235;
      x.beginPath();
      if(x.roundRect)x.roundRect(0,0,size,size,r);
      else{x.moveTo(r,0);x.arcTo(size,0,size,size,r);x.arcTo(size,size,0,size,r);x.arcTo(0,size,0,0,r);x.arcTo(0,0,size,0,r);x.closePath();}
      x.fillStyle=g;x.fill();
    }
    x.fillStyle='#fff';
    x.font='800 '+Math.round(size*(maskable?.28:.34))+'px Roboto,Arial,Helvetica,sans-serif';
    x.textAlign='center';x.textBaseline='middle';
    x.fillText('ACS',size/2,size/2+size*.02);
    return cv.toDataURL('image/png');
  },
  async probeIcons(){
    /* Em hospedagem (http/https) verifica uma vez se os ícones reais
       existem na raiz (GitHub Pages). Timeout de 3s para nunca atrasar
       demais o manifest; qualquer falha => fallback canvas. */
    if(!/^https?:$/.test(location.protocol))return false;
    try{
      const opt={method:'HEAD',cache:'no-store'};
      if(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)opt.signal=AbortSignal.timeout(3000);
      const r=await fetch('icon-512.png',opt);
      return !!(r&&r.ok);
    }catch(e){return false;}
  },
  iconList(){
    if(this.useFiles){
      const U=p=>new URL(p,location.href).href; /* URL absoluta: o manifest é um Blob */
      return [{src:U('icon-192.png'),sizes:'192x192',type:'image/png',purpose:'any'},
              {src:U('icon-512.png'),sizes:'512x512',type:'image/png',purpose:'any'},
              {src:U('icon-maskable-192.png'),sizes:'192x192',type:'image/png',purpose:'maskable'},
              {src:U('icon-maskable-512.png'),sizes:'512x512',type:'image/png',purpose:'maskable'}];
    }
    return [{src:this.makeIcon(192,false),sizes:'192x192',type:'image/png',purpose:'any'},
            {src:this.makeIcon(512,false),sizes:'512x512',type:'image/png',purpose:'any'},
            {src:this.makeIcon(512,true),sizes:'512x512',type:'image/png',purpose:'maskable'}];
  },
  async injectManifest(){
    if(this.manifestIn)return;
    this.useFiles=await this.probeIcons();
    this.applyManifest();
  },
  applyManifest(){
    if(this.manifestIn)return;
    try{
      const dark=resolveTheme()==='dark';
      const start=(location.href.split('#')[0].split('?')[0])||location.href;
      const mf={name:'Simulados IBGE — ACS (IBFC)',short_name:'Simulados ACS',
        description:'Simulados do cargo de Agente Censitário Supervisor (ACS) — banca IBFC: 6 provas de 60 questões com correção comentada, revisão inteligente, flashcards e estatísticas.',
        lang:'pt-BR',dir:'ltr',start_url:start,display:'standalone',display_override:['standalone','minimal-ui'],orientation:'any',
        background_color:dark?'#141218':'#FEF7FF',theme_color:dark?'#141218':'#FEF7FF',
        icons:this.iconList()};
      const blob=new Blob([JSON.stringify(mf)],{type:'application/manifest+json'});
      let link=document.querySelector('link[rel="manifest"]');
      if(!link){link=document.createElement('link');link.rel='manifest';document.head.appendChild(link);}
      link.href=URL.createObjectURL(blob);
      this.manifestIn=true;
    }catch(e){}
  },
  init(){
    this.installed=this.isStandalone();
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();this.evt=e;this.updateCard();});
    window.addEventListener('appinstalled',()=>{
      this.evt=null;this.installed=true;this.updateCard();
      if(!inExamNow()){toast('Aplicativo instalado! Procure o ícone na tela inicial.','sparkle');SFX.finish();vib([30,40,30]);}
    });
    this.injectManifest();
  },
  install(){
    const e=this.evt;if(!e)return;
    this.evt=null;
    try{e.prompt();if(e.userChoice)e.userChoice.catch(function(){});}catch(e2){}
    this.updateCard();
  },
  status(){
    if(this.installed)return{st:'ok',txt:'Já instalado — você está usando o aplicativo agora.'};
    if(this.evt)return{st:'ready',txt:'Tudo pronto: instale com um toque.'};
    if('onbeforeinstallprompt' in window){
      if(!this.secure())return{st:'host',txt:'Arquivo aberto direto do armazenamento — a instalação exige HTTPS.'};
      return{st:'wait',txt:'Disponível neste navegador — se o botão não ativar, use o menu ⋮.'};
    }
    return{st:'manual',txt:'Sem instalação automática neste navegador — dá para adicionar pelo menu.'};
  },
  cardHTML(){
    const s=this.status();
    const btn=s.st==='ready'?'<button class="btn btn-filled btn-sm" id="pwaInstall">'+icon('install',16)+' Instalar aplicativo</button>':'';
    let msg='';
    if(s.st==='ok')msg='Este app já roda em janela própria, sem a barra do navegador, e mantém todo o progresso salvo neste dispositivo.';
    else if(s.st==='ready')msg='A instalação adiciona o <b>Simulados ACS</b> à tela inicial: abre em janela independente, em tela cheia, e mantém todo o progresso atual.';
    else if(s.st==='host')msg='Os navegadores só permitem instalar páginas abertas por <b>HTTPS</b>. Hospede este arquivo em um serviço gratuito (GitHub Pages, Netlify…) e abra o endereço gerado — o botão de instalação ficará ativo. Para levar seu progresso, use <b>Exportar/Importar</b> acima.';
    else if(s.st==='wait')msg='A instalação foi habilitada, mas o atalho ainda não foi liberado. Abra o menu do navegador (⋮) e toque em <b>“Instalar aplicativo”</b> ou “Adicionar à tela inicial”.';
    else msg='Neste navegador, abra o menu (⋮ ou Compartilhar) e escolha <b>“Adicionar à tela inicial”</b>: o app ganha ícone próprio e abre em tela cheia, como um aplicativo comum.';
    return '<div class="setrow"><div class="sr-txt"><b>Instalar na tela inicial (PWA)</b><small>'+s.txt+'</small></div>'+btn+'</div><div class="msg" style="margin:0">'+msg+'</div>';
  },
  bindCard(){const b=$('pwaInstall');if(b)b.onclick=()=>{SFX.tap();PWA.install();};},
  updateCard(){
    if(ui.screen!=='settings')return;
    const c=$('pwaBody');
    if(c){c.innerHTML=this.cardHTML();this.bindCard();}
  }
};

const NAV_ITEMS=[['home','Início','home'],['practice','Praticar','play'],['review','Revisar','refresh'],['stats','Evolução','chart'],['settings','Ajustes','sliders']];
let pendingFw=false;
function buildChrome(){
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  NAV_ITEMS.forEach(it=>{
    const b=$('nav'+cap(it[0]));
    if(b){b.innerHTML=icon(it[2],21)+'<span>'+it[1]+'</span>';b.onclick=()=>{SFX.tap();vib(8);goScreen(it[0]);};}
  });
  const bn=$('bottomnav');
  bn.innerHTML=NAV_ITEMS.map(it=>'<button class="bn-item" data-nav="'+it[0]+'" aria-label="'+it[1]+'"><span class="bn-pill">'+icon(it[2],22)+'</span><span class="lbl">'+it[1]+'</span></button>').join('');
  bn.querySelectorAll('.bn-item').forEach(b=>b.onclick=()=>{SFX.tap();vib(8);goScreen(b.dataset.nav);});
  $('btnThemeRail').onclick=cycleTheme;
  $('btnThemeTop').onclick=cycleTheme;
  const fb=$('fabTop');if(fb)fb.innerHTML=icon('up',24);

function goScreen(id){
  stopTimer();
  stopStudyTick();
  session=null;
  if(typeof quizWavy!=='undefined'&&quizWavy){quizWavy.destroy();quizWavy=null;}
  const map={home:'scrHome',practice:'scrPractice',review:'scrReview',stats:'scrStats',settings:'scrSettings'};
  ui.screen=id;
  document.body.classList.remove('in-session');
  ['scrHome','scrPractice','scrReview','scrStats','scrSettings','scrQuiz','scrResult','scrRevSum'].forEach(s=>$(s).classList.toggle('hidden',s!==map[id]));
  const sec=$(map[id]);
  sec.classList.remove('screen');void sec.offsetWidth;sec.classList.add('screen');
  document.querySelectorAll('.navitem,.bn-item').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));
  if(id==='home')renderHome();
  else if(id==='practice')renderPractice();
  else if(id==='review')renderReview();
  else if(id==='stats')renderStats();
  else if(id==='settings')renderSettings();
  window.scrollTo(0,0);
  if(id==='home'&&pendingFw){pendingFw=false;if(!reducedMotion())setTimeout(()=>fwStart(9000),350);}
}
function ringSVG(pct,size,stroke){
  const r=(size-stroke)/2,C=2*Math.PI*r;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface-chh)" stroke-width="'+stroke+'"/>'
    +'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--primary)" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+(C*(1-Math.max(0,Math.min(1,pct)))).toFixed(1)+'" style="transition:stroke-dashoffset .9s var(--ease-spring)"/></svg>';
}
function daysToExam(){
  if(!state.set.examDate)return null;
  const t=new Date(state.set.examDate+'T12:00:00');
  const now=new Date();now.setHours(12,0,0,0);
  return Math.round((t-now)/864e5);
}
function nextUnfinished(){for(let s=1;s<=N_SIMS;s++){const st=statsFor(s);if(st.a>0&&st.a<60&&!state.fins[s])return s;}return null;}

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ============ TELA: PRATICAR ============ */
let trainCfg={mat:'all',cnt:20,shuf:true};
let flashCfg={mat:'all',tipo:'todas',cnt:10,shuf:true};
let searchQ='';
function matPool(mat){return mat==='all'?QUESTIONS.slice():QUESTIONS.filter(q=>{const r=MAT_RANGES[mat];return q.n>=r[0]&&q.n<=r[1];});}
function buildTrainList(){
  let L=matPool(trainCfg.mat);
  if(trainCfg.shuf)L=shuffleArr(L);
  else L.sort((a,b)=>(a.s-b.s)||(a.n-b.n));
  return L.slice(0,trainCfg.cnt);
}
function buildFlashList(mat,tipo,cnt,shuf){
  let L=matPool(mat);
  if(tipo==='erradas')L=L.filter(q=>{const a=state.ans[keyOf(q)];return a&&!a.ok;});
  else if(tipo==='fav')L=L.filter(q=>state.fav[keyOf(q)]);
  else if(tipo==='fragil')L=L.filter(q=>masteryOf(keyOf(q))!=='dom');
  if(shuf)L=shuffleArr(L);
  else L.sort((a,b)=>(a.s-b.s)||(a.n-b.n));
  if(cnt)L=L.slice(0,cnt);
  return L;
}

function renderSearchResults(){
  const box=$('srBox');if(!box)return;
  const q=searchQ.trim().toLowerCase();
  if(q.length<2){box.innerHTML='';return;}
  const hits=[];
  for(const qq of QUESTIONS){
    const hay=(qq.q+' '+qq.a.join(' ')+' '+qq.e+' '+(qq.t?TEXTS[qq.t]:'')).toLowerCase();
    if(hay.indexOf(q)>=0)hits.push(qq);
    if(hits.length>=40)break;
  }
  let html='<div class="sr-count">'+hits.length+' resultado(s)'+(hits.length>=40?' (mostrando os primeiros 40)':'')+'</div>';
  hits.forEach(qq=>{
    const k=keyOf(qq),an=state.ans[k],m=materiaOf(qq.n);
    let sn=qq.q;
    const pos=sn.toLowerCase().indexOf(q);
    if(pos>60)sn='… '+sn.slice(pos-60);
    sn=esc(sn.slice(0,190))+(qq.q.length>190?'…':'');
    html+='<button class="sr-item" data-k="'+k+'"><div class="sr-chips">'
      +'<span class="chip '+m.cls+'">'+m.name+'</span><span class="chip chip-neutral">S'+qq.s+' • Q'+String(qq.n).padStart(2,'0')+'</span>'
      +(an?(an.ok?'<span class="chip chip-ok">Acertou</span>':'<span class="chip chip-bad">Errou</span>'):'<span class="chip chip-neutral">Sem resposta</span>')
      +(state.fav[k]?'<span class="chip chip-neutral">'+icon('star',12)+'</span>':'')
      +(masteryOf(k)==='dom'?'<span class="chip chip-ok">Dominada</span>':'')
      +'</div><div class="sr-tx">'+sn+'</div></button>';
  });
  box.innerHTML=html;
  box.querySelectorAll('.sr-item').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,parts=k.split('-');
    const q=QUESTIONS.find(x=>x.s==parts[0]&&x.n==parts[1]);
    const idx=hits.indexOf(q);
    startSession('peek',null,hits.slice(),{startIdx:Math.max(0,idx)});
  });
}


/* ============ TELA: REVISAR ============ */
let reviewCfg={mat:'all',tipo:'todas'};
function buildReviewList(matId,tipo){
  let L=QUESTIONS.filter(q=>state.ans[keyOf(q)]);
  if(matId&&matId!=='all'&&MAT_RANGES[matId]){const r=MAT_RANGES[matId];L=L.filter(q=>q.n>=r[0]&&q.n<=r[1]);}
  if(tipo==='erradas')L=L.filter(q=>!state.ans[keyOf(q)].ok);
  else if(tipo==='fav')L=L.filter(q=>state.fav[keyOf(q)]);
  else if(tipo==='flag')L=L.filter(q=>state.flags[keyOf(q)]);
  else if(tipo==='fragil')L=L.filter(q=>masteryOf(keyOf(q))!=='dom');
  L.sort((x,y)=>{const sx=revScore(x),sy=revScore(y);if(sx!==sy)return sy-sx;return (x.s-y.s)||(x.n-y.n);});
  return L;
}
function revScore(q){const k=keyOf(q),a=state.ans[k],rs=state.rs[k]||{r:0,w:0};return (a&&!a.ok?1:0)+(rs.w-rs.r);}
function renderReview(){
  let rr=0,rw=0,errCount=0;
  Object.keys(state.rs).forEach(k=>{rr+=state.rs[k].r;rw+=state.rs[k].w;});

    +'<div class="donut-cell"><span class="dc-ico" style="background:var(--error-container);color:var(--on-error-container)">'+icon('close',20)+'</span><div><div class="dc-num">'+rw+'</div><small>Erros em revisão</small></div></div>'
    +'<div class="donut-cell"><span class="dc-ico" style="background:var(--ok-container);color:var(--on-ok-container)">'+icon('trophy',20)+'</span><div><div class="dc-num">'+mc.dom+'</div><small>Dominadas</small></div></div>'
    +'<div class="donut-cell"><span class="dc-ico" style="background:var(--tertiary-container);color:var(--on-tertiary-container)">'+icon('bulb',20)+'</span><div><div class="dc-num">'+mc.apr+'</div><small>Em aprendizado</small></div></div>'

    +'<div class="chips" style="margin-bottom:16px">'+tipos.map(t=>'<button class="mchip'+(reviewCfg.tipo===t[0]?' on':'')+'" data-rtipo="'+t[0]+'">'+t[1]+(t[0]==='erradas'?' ('+errCount+')':t[0]==='fav'?' ('+Object.keys(state.fav).length+')':t[0]==='flag'?' ('+Object.keys(state.flags).length+')':'')+'</button>').join('')+'</div>'

    +'<button class="btn btn-filled btn-xl" id="btnRevStart"'+(pool.length?'':' disabled')+'>'+icon('play',20)+' Iniciar revisão ('+pool.length+')</button>'
    +'<div class="kbd-hints" style="margin-top:16px"><span class="kbd">1–5 / A–E</span><span class="kbd">Enter</span><span class="kbd">← →</span></div>'
    +'</div>';
  document.querySelectorAll('[data-rmat]').forEach(b=>b.onclick=()=>{reviewCfg.mat=b.dataset.rmat;SFX.tap();renderReview();});

/* ============ TELA: EVOLUÇÃO ============ */
function lineChartSVG(hist){
  if(!hist.length)return '<div class="msg">Conclua simulados para acompanhar sua evolução aqui.</div>';
  const W=560,H=190,P=34;
  const n=hist.length;
  const xs=i=>n===1?W/2:P+i*((W-2*P)/Math.max(1,n-1));
  const ys=p=>H-P-(p/100)*(H-2*P);
  let g='';
  [0,25,50,75,100].forEach(v=>{g+='<line x1="'+P+'" y1="'+ys(v)+'" x2="'+(W-P)+'" y2="'+ys(v)+'" stroke="var(--outline-var)" stroke-width="1" stroke-dasharray="3 5"/><text x="'+(P-8)+'" y="'+(ys(v)+4)+'" text-anchor="end" font-size="10" fill="var(--on-surface-var)">'+v+'</text>';});
  let area='M'+xs(0)+','+ys(hist[0].pct);
  hist.forEach((h,i)=>{if(i)area+=' L'+xs(i)+','+ys(h.pct);});
  const line=area;
  area+=' L'+xs(n-1)+','+(H-P)+' L'+xs(0)+','+(H-P)+' Z';
  let dots='',lbl='';
  hist.forEach((h,i)=>{
    dots+='<circle cx="'+xs(i)+'" cy="'+ys(h.pct)+'" r="5" fill="var(--primary)" stroke="var(--surface-c)" stroke-width="2.5"><title>Simulado '+h.sim+' — '+h.pct+'%</title></circle>';
    lbl+='<text x="'+xs(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--on-surface-var)">S'+h.sim+'</text>';
    lbl+='<text x="'+xs(i)+'" y="'+(ys(h.pct)-10)+'" text-anchor="middle" font-size="10" font-weight="800" fill="var(--primary)">'+h.pct+'%</text>';
  });
  return '<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução das notas"><path d="'+area+'" fill="var(--primary)" opacity=".08"/>'+g+'<path d="'+line+'" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+dots+lbl+'</svg></div>';
}
function heatHTML(){
  const days=state.stats.days||{},weeks=16;
  const today=new Date();today.setHours(12,0,0,0);
  const dow=(today.getDay()+6)%7;
  const start=new Date(today.getTime()-(dow+(weeks-1)*7)*864e5);
  let cells='';
  for(let w=0;w<weeks;w++)for(let d=0;d<7;d++){
    const dt=new Date(start.getTime()+(w*7+d)*864e5);
    const k=fmtDay(dt);
    if(dt>today){cells+='<div class="hc" style="visibility:hidden"></div>';continue;}
    const c=days[k]||0;
    const lvl=c===0?0:Math.min(4,Math.ceil(c/Math.max(1,state.set.goal/4)));
    cells+='<div class="hc h'+lvl+(k===todayKey()?' today':'')+'" title="'+k.split('-').reverse().join('/')+' • '+c+' questão(ões)"></div>';
  }
  return '<div class="heat-wrap"><div class="heat">'+cells+'</div></div>'
    +'<div class="heat-legend">menos <div class="hc"></div><div class="hc h1"></div><div class="hc h2"></div><div class="hc h3"></div><div class="hc h4"></div> mais</div>';
}

  const stats={};MATERIAS.forEach(mi=>stats[mi[1]]={t:0,c:0});

  MATERIAS.forEach(mi=>{

  html+='<div class="card" style="margin-bottom:22px"><h3>Aproveitamento por matéria</h3>'+rows+'</div>';

  if(hist.length){

    });
    html+='</div>';
  }
  html+='</div>';

  html+='<div class="card" style="margin-bottom:22px"><h3>Atividade de estudo</h3><div class="card-sub">Últimas 16 semanas — intensidade conforme a meta diária ('+state.set.goal+' questões)</div>'+heatHTML()+'</div>';

  const unlocked=Object.keys(state.ach).length;

  });
  html+='</div></div>';
  $('scrStats').innerHTML=html;
}

function exportData(){
  const data=JSON.stringify({app:'IBGE-ACS-Simulados',v:APP_VER,when:new Date().toISOString(),state:state},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ibge-acs-progresso-'+todayKey()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('Progresso exportado com sucesso!','download');
}
function importData(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const p=JSON.parse(rd.result);
      if(!p||!p.state||typeof p.state!=='object'||!p.state.set)throw 0;
      const keep=state.set;
      state=Object.assign({ans:{},rs:{},mode:'estudo',flags:{},times:{},fins:{},fav:{},notes:{},history:[],ach:{},stats:{xp:0,days:{},studySec:0,flashSeen:0,goalHitDay:''},set:{},ob:true},p.state);
      state.set=Object.assign({},keep,p.state.set||{});
      save();applyPalette();applyFont();applyTheme();
      toast('Progresso importado com sucesso!','upload');
      goScreen('home');
    }catch(e){toast('Arquivo inválido — importe um JSON exportado por este app.','info');}
  };
  rd.readAsText(file);
}

let timerInt=null,tickCount=0,studyInt=null,quizWavy=null;
function startTimer(sim){
  stopTimer();tickCount=0;
  timerInt=setInterval(()=>{
    state.times[sim]=(state.times[sim]||0)+1;tickCount++;
    if(tickCount%10===0)save();
    updateTimerDisplay();
    if(state.times[sim]>=EXAM_SECONDS){stopTimer();toast('Tempo esgotado! A prova será encerrada.','clock');SFX.bad();finalizeExam(true);}
  },1000);
  updateTimerDisplay();
}
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null;save();}}
function startStudyTick(){stopStudyTick();studyInt=setInterval(()=>{state.stats.studySec=(state.stats.studySec||0)+1;if(state.stats.studySec%15===0)save();},1000);}
function stopStudyTick(){if(studyInt){clearInterval(studyInt);studyInt=null;}}
function updateTimerDisplay(){
  const el=$('examTimer');if(!el||!session)return;
  const rem=Math.max(0,EXAM_SECONDS-(state.times[session.sim]||0));
  el.innerHTML=icon('clock',15)+fmtTime(rem);
  el.classList.toggle('urgent',rem<=600);
}
function showSessionScreen(secId){
  if(secId!=='scrQuiz'&&quizWavy){quizWavy.destroy();quizWavy=null;}
  ui.screen=secId==='scrQuiz'?'quiz':'other';
  document.body.classList.add('in-session');
  ['scrHome','scrPractice','scrReview','scrStats','scrSettings','scrQuiz','scrResult','scrRevSum'].forEach(s=>$(s).classList.toggle('hidden',s!==secId));
}
function startSession(kind,sim,customList,opts){
  opts=opts||{};
  stopTimer();stopStudyTick();fwStop();
  let list;
  if(kind==='sim'||kind==='correcao')list=QUESTIONS.filter(q=>q.s===sim).sort((a,b)=>a.n-b.n);
  else if(kind==='rev'&&!customList)list=buildReviewList(null,'todas');
  else list=customList||[];
  if(!list.length){toast('Nenhuma questão disponível neste filtro.','info');return;}
  session={kind:kind,sim:sim||(list[0]?list[0].s:null),list:list,i:opts.startIdx||0,sel:null,locked:false,right:0,wrong:0,wrongKeys:[],textCollapsed:false,exam:(kind==='sim'&&state.mode==='simulado'),opts:opts,flipped:false,notesOpen:false};
  session.ret=(kind==='rev')?'review':'practice';
  if(kind==='correcao')session.ret=()=>renderExamSummary(sim);
  if(session.exam){
    const idx=session.list.findIndex(q=>!state.ans[keyOf(q)]);
    if(idx>0)session.i=idx;
    startTimer(sim);
  }
  startStudyTick();
  renderQuizShell();
  showSessionScreen('scrQuiz');
  renderQuestion();
  if(IS_TOUCH&&!state.gh&&!session.exam){state.gh=true;save();setTimeout(()=>{if(session&&!session.exam)toast('Dica: deslize para os lados para trocar de questão • toque duplo na questão para favoritar ★','info');},1000);}
}

async function exitSession(){
  if(!session)return;
  if(session.exam){

function sessionLabel(){
  if(!session)return'';
  if(session.kind==='sim')return session.exam?'Simulado '+session.sim+' — prova':'Simulado '+session.sim;
  if(session.kind==='correcao')return'Correção — Simulado '+session.sim;
  if(session.kind==='rev')return'Revisão';
  if(session.kind==='flash')return session.opts.label||'Flashcards';
  if(session.kind==='peek')return'Visualizando questão';
  return session.opts.label||'Treino';
}
function renderQuestion(){
  const q=session.list[session.i],k=keyOf(q),m=materiaOf(q.n);
  const answered=state.ans[k];
  const isExam=session.exam;
  session.locked=(session.kind==='correcao')||(session.kind==='peek')||(session.kind==='sim'&&!isExam&&!!answered);
  session.sel=(session.locked&&answered)?answered.p:null;
  $('quizTitle').textContent=sessionLabel();
  if(isExam){$('quizCount').textContent='Respondidas '+countAnswered(session.sim)+'/60';if(quizWavy)quizWavy.set(countAnswered(session.sim)/60);}
  else{$('quizCount').textContent=(session.i+1)+' de '+session.list.length;if(quizWavy)quizWavy.set((session.i+1)/session.list.length);}
  $('btnNav').style.display=session.kind==='sim'?'':'none';
  $('examTimer').classList.toggle('hidden',!isExam);
  if(isExam)updateTimerDisplay();
  let badges='<span class="chip '+m.cls+'">'+m.name+'</span><span class="chip chip-neutral">Questão '+String(q.n).padStart(2,'0')+' • Simulado '+q.s+'</span>';
  if(isExam)badges+='<span class="chip chip-neutral">Modo prova</span>';
  if(session.kind==='correcao'){
    badges+=answered?(answered.ok?'<span class="chip chip-ok">Você acertou</span>':'<span class="chip chip-bad">Você errou</span>'):'<span class="chip chip-bad">Em branco</span>';
  }else if(session.kind==='rev'){
    if(answered)badges+=answered.ok?'<span class="chip chip-ok">Na prova: acertou</span>':'<span class="chip chip-bad">Na prova: errou</span>';
    const rs=state.rs[k];if(rs&&(rs.r||rs.w))badges+='<span class="chip chip-neutral">Revisões: '+rs.r+'✓ '+rs.w+'✗</span>';
  }else if(session.kind==='train'){
    const rs=state.rs[k];if(rs&&(rs.r||rs.w))badges+='<span class="chip chip-neutral">Treinos: '+rs.r+'✓ '+rs.w+'✗</span>';
  }
  if(session.kind!=='peek'){
    badges+='<button class="star-btn'+(state.fav[k]?' starred':'')+'" id="btnStar" title="Favoritar (S)">'+icon('star',14)+' '+(state.fav[k]?'Favorita':'Favoritar')+'</button>';
  }
  if(isExam)badges+='<button class="flag-btn'+(state.flags[k]?' flagged':'')+'" id="btnFlag" title="Marcar para revisar depois (F)">'+icon('flag',14)+' '+(state.flags[k]?'Marcada':'Marcar')+'</button>';
  let textoHtml='';

    const open=!session.textCollapsed;
    textoHtml='<div class="texto-wrap'+(open?' open':'')+'"><button class="texto-head" id="btnTextToggle"><span class="t-arrow">▶</span>'+icon('book',15)+' Texto-base<span class="t-hint">'+(open?'recolher':'expandir')+'</span></button>'+(open?'<div class="texto-base">'+TEXTS[q.t]+'</div>':'')+'</div>';
  }
  let bodyHtml='';
  if(session.kind==='flash'){
    const flipped=session.flipped;
    bodyHtml='<div class="fc-scene"><div class="fcard'+(flipped?' flip':'')+'" id="fcard" role="button" tabindex="0" aria-label="Cartão de pergunta e resposta">'
      +'<div class="fc-face fc-front"><div class="fc-tag"><span class="chip '+m.cls+'">'+m.name+'</span><span class="chip chip-neutral">S'+q.s+' • Q'+String(q.n).padStart(2,'0')+'</span></div>'
      +'<div class="fc-q">'+q.q+'</div>'
      +'<div class="fc-hint">'+icon('refresh',14)+' Toque no cartão (ou Espaço) para ver a resposta</div></div>'
      +'<div class="fc-face fc-back"><div class="fc-tag"><span class="chip chip-ok">Resposta</span></div>'
      +'<div class="fc-ans"><b>('+'ABCDE'[q.c]+') '+q.a[q.c]+'</b></div>'
      +'<div class="fc-exp">'+q.e+'</div></div></div></div>';
  }else{
    let alts='';
    q.a.forEach((alt,idx)=>{
      let cls='alt';
      if(session.locked||session.kind==='peek'){
        if(idx===q.c)cls+=' correct';
        else if(answered&&idx===answered.p)cls+=' wrong';
        else cls+=' dim';
        cls+=' locked';
      }else if(isExam&&answered&&idx===answered.p){cls+=' selected';}
      alts+='<button class="'+cls+'" data-i="'+idx+'"><span class="alt-letter">'+'ABCDE'[idx]+'</span><span>'+alt+'</span></button>';

      ?kb(['Espaço','virar'])+' '+kb(['1','errei'])+' '+kb(['2','acertei'])+' '+kb(['←','→','navegar'])+' '+kb(['Esc','sair'])
      :(session.kind==='peek'
        ?kb(['←','→','navegar'])+' '+kb(['Esc','voltar'])
        :(session.exam
          ?kb(['1–5 ou A–E','marcar'])+' '+kb(['Enter','avançar'])+' '+kb(['←','→','navegar'])+' '+kb(['F','marcar 🚩'])+' '+kb(['S','favoritar'])+' '+kb(['G','quadro'])+' '+kb(['Esc','sair'])
          :kb(['1–5 ou A–E','selecionar'])+' '+kb(['Enter','confirmar / avançar'])+' '+kb(['←','→','navegar'])+' '+kb(['S','favoritar'])+' '+kb(['Esc','sair'])));
  }
}
function appendFeedback(q,ans){
  const ok=ans&&ans.ok;
  const head=ans?(ok?'Você acertou esta questão!':'Você errou esta questão.'):'Você não respondeu esta questão.';
  const sua=ans?('Sua resposta: ('+'ABCDE'[ans.p]+') '+q.a[ans.p]):'Sua resposta: (em branco)';
  const k=keyOf(q);
  const box=document.createElement('div');box.id='fbBox';box.className='feedback '+(ans?(ok?'ok':'bad'):'bad');
  box.innerHTML='<h4>'+(ok?icon('check',18):(ans?icon('close',18):icon('info',18)))+' '+head+'</h4>'
    +'<p><b>Alternativa correta: ('+'ABCDE'[q.c]+') '+q.a[q.c]+'</b></p>'
    +'<p style="margin-top:6px">'+sua+'</p>'
    +'<p style="margin-top:8px">'+q.e+'</p>'
    +noteHTML(k);
  $('qCard').appendChild(box);
  wireNote(k);
}
function appendPeekInfo(q,k){
  const box=document.createElement('div');box.id='fbBox';box.className='feedback '+(state.ans[k]?(state.ans[k].ok?'ok':'bad'):'ok');
  const an=state.ans[k];
  box.innerHTML='<h4>'+icon('eye',18)+' Questão '+(an?(an.ok?'que você acertou':'que você errou'):'ainda não respondida')+'</h4>'
    +'<p><b>Alternativa correta: ('+'ABCDE'[q.c]+') '+q.a[q.c]+'</b></p>'
    +(an?'<p style="margin-top:6px">Sua resposta na prova: ('+'ABCDE'[an.p]+') '+q.a[an.p]+'</p>':'')
    +'<p style="margin-top:8px">'+q.e+'</p>'
    +noteHTML(k);
  $('qCard').appendChild(box);
  wireNote(k);
}
function noteHTML(k){
  const n=state.notes[k]||'';
  return '<div style="margin-top:14px"><button class="btn btn-text btn-sm" id="btnNote" style="padding:6px 10px">'+icon('edit',15)+' '+(session.notesOpen||n?'Editar nota':'Adicionar nota')+'</button>'
    +(session.notesOpen||n?'<textarea class="note-area" id="noteArea" placeholder="Sua anotação sobre esta questão...">'+esc(n)+'</textarea><div class="note-saved" id="noteSaved">Nota salva ✓</div>':'')+'</div>';
}
function wireNote(k){
  const bn=$('btnNote');if(bn)bn.onclick=()=>{session.notesOpen=true;const y=window.scrollY;renderQuestion();window.scrollTo(0,y);};
  const na=$('noteArea');
  if(na){
    let deb=null;
    na.addEventListener('input',()=>{
      clearTimeout(deb);
      deb=setTimeout(()=>{
        const v=na.value.trim();
        if(v)state.notes[k]=v;else delete state.notes[k];
        save();
        const ns=$('noteSaved');if(ns){ns.classList.add('show');setTimeout(()=>ns.classList.remove('show'),1200);}
      },400);
    });
  }
}
function updateActions(){
  const parent=IS_TOUCH?$('touchBar'):$('qCard');
  let act=$('quizActions');
  if(act&&act.parentElement!==parent){act.remove();act=null;}
  if(!act){act=document.createElement('div');act.id='quizActions';act.className='quiz-actions';parent.appendChild(act);}
  const q=session.list[session.i],k=keyOf(q),answered=state.ans[k];
  const last=session.i===session.list.length-1;
  let html='';
  if(session.kind==='correcao'){
    html='<button class="btn btn-tonal" id="btnPrev" '+(session.i===0?'disabled':'')+'>'+icon('chevL',17)+' Anterior</button><div class="spacer"></div><button class="btn btn-filled" id="btnNext">'+(last?'Voltar ao resumo':'Próxima '+icon('chevR',17))+'</button>';
  }else if(session.kind==='peek'){
    html='<button class="btn btn-tonal" id="btnPrev" '+(session.i===0?'disabled':'')+'>'+icon('chevL',17)+' Anterior</button><div class="spacer"></div><button class="btn btn-filled" id="btnNext">'+(last?'Voltar à busca':'Próxima '+icon('chevR',17))+'</button>';
  }else if(session.kind==='flash'){
    if(session.flipped){
      html='<button class="btn btn-tonal" id="btnPrev" '+(session.i===0?'disabled':'')+'>'+icon('chevL',17)+'</button><button class="btn btn-danger" id="btnFlashBad" style="flex:1">'+icon('close',17)+' Errei</button><button class="btn btn-filled" id="btnFlashOk" style="flex:1">'+icon('check',17)+' Acertei</button>';
    }else{
      html='<button class="btn btn-tonal" id="btnPrev" '+(session.i===0?'disabled':'')+'>'+icon('chevL',17)+'</button><div class="spacer"></div><button class="btn btn-text" id="btnSkip">'+(last?'Finalizar':'Pular '+icon('chevR',17))+'</button>';
    }
  }else if(session.exam){
    html='<button class="btn btn-tonal" id="btnPrev" '+(session.i===0?'disabled':'')+'>'+icon('chevL',17)+' Anterior</button>'+(answered?'<button class="btn btn-outline" id="btnClear">Apagar resposta</button>':'')+'<div class="spacer"></div><button class="btn btn-filled" id="btnNext">'+(last?'Finalizar simulado ▸':'Próxima '+icon('chevR',17))+'</button>';
  }else{
    html='<button class="btn btn-tonal" id="btnPrev" '+(session.i===0?'disabled':'')+'>'+icon('chevL',17)+' Anterior</button><div class="spacer"></div>'
      +(!session.locked?'<button class="btn btn-filled" id="btnConfirm" '+(session.sel===null?'disabled':'')+'>Confirmar resposta</button>':'')
      +(session.locked?'<button class="btn btn-filled" id="btnNext">'+(last?(session.kind==='sim'?'Ver resultado':'Concluir '+(session.kind==='rev'?'revisão':(session.kind==='flash'?'flashcards':'treino'))):'Próxima '+icon('chevR',17))+'</button>':'')
      +(!session.locked?'<button class="btn btn-text" id="btnSkip">'+(last?'Finalizar':'Pular '+icon('chevR',17))+'</button>':'');
  }
  act.innerHTML=html;
  const bp=$('btnPrev');if(bp)bp.onclick=()=>nav(-1);
  const bc=$('btnConfirm');if(bc)bc.onclick=confirmAnswer;
  const bn=$('btnNext');if(bn)bn.onclick=()=>{if(session.exam&&last)finalizeExam();else if(session.kind==='peek'&&last)exitSession();else nav(1);};
  const bs=$('btnSkip');if(bs)bs.onclick=()=>nav(1);
  const bcl=$('btnClear');if(bcl)bcl.onclick=clearAnswer;
  const fo=$('btnFlashOk');if(fo)fo.onclick=()=>gradeFlash(true);
  const fx=$('btnFlashBad');if(fx)fx.onclick=()=>gradeFlash(false);
}
function selectAlt(i){if(!session||session.locked)return;session.sel=i;document.querySelectorAll('#altsBox .alt').forEach(b=>b.classList.toggle('selected',+b.dataset.i===i));updateActions();}
function recordExamAnswer(q,i){
  const k=keyOf(q);
  /* XP/contagem diária apenas na PRIMEIRA resposta da questão — re-marcá-la
     (ou apagar e responder de novo na mesma sessão) não pontua novamente. */
  const first=!state.ans[k]&&!(session.xpQ&&session.xpQ[k]);
  state.ans[k]={p:i,ok:i===q.c};
  if(first){session.xpQ=session.xpQ||{};session.xpQ[k]=1;markDaily();addXP(3);}
  save();checkAch();
  document.querySelectorAll('#altsBox .alt').forEach(b=>b.classList.toggle('selected',+b.dataset.i===i));
  $('quizCount').textContent='Respondidas '+countAnswered(session.sim)+'/60';
  if(quizWavy)quizWavy.set(countAnswered(session.sim)/60);
  updateActions();
}
function clearAnswer(){const q=session.list[session.i];delete state.ans[keyOf(q)];save();const y=window.scrollY;renderQuestion();window.scrollTo(0,y);}
function toggleFlag(){
  if(!session||session.kind!=='sim')return;
  const k=keyOf(session.list[session.i]);
  if(state.flags[k])delete state.flags[k];else state.flags[k]=true;
  save();vib(12);
  const b=$('btnFlag');
  if(b){b.classList.toggle('flagged',!!state.flags[k]);b.innerHTML=icon('flag',14)+' '+(state.flags[k]?'Marcada':'Marcar');}
}
function toggleStar(k){
  if(!k&&session)k=keyOf(session.list[session.i]);
  if(!k)return;
  const quiet=inExamNow();
  if(state.fav[k]){delete state.fav[k];if(!quiet)toast('Removida das favoritas.','star');}
  else{state.fav[k]=true;if(!quiet){toast('Adicionada às favoritas ★','star');SFX.tap();}}
  save();vib(10);checkAch();
  const b=$('btnStar');
  if(b){b.classList.toggle('starred',!!state.fav[k]);b.innerHTML=icon('star',14)+' '+(state.fav[k]?'Favorita':'Favoritar');}
}
function flipFlash(){
  if(!session||session.kind!=='flash'||session.flipped)return;
  session.flipped=true;
  SFX.flip();vib(10);
  const c=$('fcard');if(c)c.classList.add('flip');
  setTimeout(()=>{if(session&&session.kind==='flash')updateActions();},320);
}
function gradeFlash(ok){
  if(!session||session.kind!=='flash'||!session.flipped)return;
  const q=session.list[session.i],k=keyOf(q);
  state.rs[k]=state.rs[k]||{r:0,w:0};
  state.rs[k][ok?'r':'w']++;
  state.stats.flashSeen=(state.stats.flashSeen||0)+1;
  markDaily();
  addXP(ok?4:1);
  if(ok){session.right++;SFX.ok();vib(15);}
  else{session.wrong++;session.wrongKeys.push(k);SFX.bad();vib([10,40,10]);}
  save();checkAch();
  nav(1);
}
function confirmAnswer(){
  const q=session.list[session.i],k=keyOf(q);
  if(session.sel===null||session.locked)return;
  const ok=session.sel===q.c;
  let ans;
  if(session.kind==='sim'){
    ans={p:session.sel,ok:ok};state.ans[k]=ans;
    markDaily();addXP(ok?10:2);
  }else{
    state.rs[k]=state.rs[k]||{r:0,w:0};
    state.rs[k][ok?'r':'w']++;
    if(ok)session.right++;else{session.wrong++;session.wrongKeys.push(k);}
    ans={p:session.sel,ok:ok};
    markDaily();addXP(ok?6:1);
  }
  if(ok){SFX.ok();vib(15);}else{SFX.bad();vib([10,40,10]);}
  save();checkAch();
  session.locked=true;
  document.querySelectorAll('#altsBox .alt').forEach(b=>{const i=+b.dataset.i;b.classList.remove('selected');b.classList.add('locked');if(i===q.c)b.classList.add('correct');else if(i===session.sel&&!ok)b.classList.add('wrong');else b.classList.add('dim');});
  appendFeedback(q,ans);
  updateActions();
}
function nav(dir){
  const ni=session.i+dir;
  if(dir>0&&ni>=session.list.length){
    if(session.kind==='sim'){if(session.exam)finalizeExam();else renderResults();}
    else if(session.kind==='correcao')renderExamSummary(session.sim);
    else if(session.kind==='peek')exitSession();
    else renderRevSummary();
    return;
  }
  if(ni<0)return;
  session.i=ni;session.sel=null;session.locked=false;session.flipped=false;
  renderQuestion();
}
function jumpTo(n){
  if(!session)return;
  let idx=session.list.findIndex(q=>q.n===n&&q.s===session.sim);
  if(idx<0)idx=session.list.findIndex(q=>q.n===n);
  if(idx>=0){session.i=idx;session.sel=null;session.locked=false;session.flipped=false;renderQuestion();}
}

/* ============ HISTÓRICO DE TENTATIVAS ============ */
function pushHistory(mode,sim,ok,blank){
  state.history=state.history||[];
  state.history.push({t:Date.now(),sim:sim,mode:mode,pct:Math.round(ok/60*100),ok:ok,tot:60,blank:blank,timeSec:Math.min(state.times[sim]||0,EXAM_SECONDS)});
  if(state.history.length>60)state.history=state.history.slice(-60);
  save();
}

/* ============ FINALIZAÇÃO DA PROVA ============ */
async function finalizeExam(auto){
  if(!session||!session.exam)return;
  if(!auto){
    const blank=60-countAnswered(session.sim);
    const msg=blank>0?('Você ainda tem '+blank+' questão(ões) sem resposta.\n\n'):'';
    if(!await mConfirm({title:'Finalizar o simulado?',body:msg+'Ao finalizar, o resultado e a correção comentada serão apresentados.',ok:'Finalizar prova'}))return;
  }
  stopTimer();
  const sim=session.sim;
  session.exam=false; /* prova encerrada: notificações (nível, conquistas) voltam a poder aparecer */
  let ok=0,blankN=0;
  for(let n=1;n<=60;n++){const an=state.ans[sim+'-'+n];if(an){if(an.ok)ok++;}else blankN++;}
  const pct=Math.round(ok/60*100);
  const was=allSimuladosDone();
  const firstTime=!state.fins[sim];
  state.fins[sim]=true;
  if(firstTime){addXP(25+Math.round(pct/2));pushHistory('prova',sim,ok,blankN);}
  save();checkAch();
  if(!was&&allSimuladosDone()){pendingFw=true;SFX.finish();}
  renderExamSummary(sim);
}
function renderExamSummary(sim){
  stopTimer();stopStudyTick();session=null;
  const groups=[['Língua Portuguesa',1,15],['Raciocínio Lógico',16,25],['Administração',26,45],['Conhecimentos Técnicos',46,60]];
  let ok=0,blank=0,cells='';
  groups.forEach(g=>{
    let c=0;
    for(let n=g[1];n<=g[2];n++){const k=sim+'-'+n;if(state.ans[k]){if(state.ans[k].ok)c++;}else blank++;}
    ok+=c;
    cells+='<div class="result-cell"><b>'+Math.round(c/(g[2]-g[1]+1)*100)+'%</b><span>'+g[0]+' ('+c+'/'+(g[2]-g[1]+1)+')</span></div>';
  });
  const pct=Math.round(ok/60*100);
  const msg=pct>=80?'Excelente desempenho! Mantenha a constância nos estudos.':(pct>=60?'Bom desempenho! Reforce os pontos fracos na correção comentada.':'Continue estudando: percorra a correção comentada para dominar as questões que geraram erro.');
  const wrongList=QUESTIONS.filter(q=>q.s===sim&&state.ans[keyOf(q)]&&!state.ans[keyOf(q)].ok);
  const blankList=QUESTIONS.filter(q=>q.s===sim&&!state.ans[keyOf(q)]);
  const tsec=Math.min(state.times[sim]||0,EXAM_SECONDS);
  $('scrResult').innerHTML='<div class="card result-hero">'
    +'<div class="pct">Resultado — Simulado '+sim+' (modo prova)</div>'
    +'<div class="big">'+pct+'%</div>'
    +'<div class="msg">'+ok+' acerto(s), '+(60-ok-blank)+' erro(s) e '+blank+' em branco em 60 questões.</div>'
    +(tsec?'<div class="time-chip">'+icon('clock',15)+' Tempo utilizado: '+fmtTime(tsec)+' de 04:00:00 • média de '+Math.round(tsec/60)+'s por questão</div>':'')
    +'<div class="result-grid">'+cells+'</div>'
    +'<div class="msg">'+msg+'</div>'
    +answerGridHTML(sim)
    +'<div class="result-actions">'
    +'<button class="btn btn-filled" id="rCorr">Correção comentada (60)</button>'
    +(wrongList.length?'<button class="btn btn-tonal" id="rWrong">Revisar as que errei ('+wrongList.length+')</button>':'')
    +(blankList.length?'<button class="btn btn-tonal" id="rBlank">Revisar as em branco ('+blankList.length+')</button>':'')
    +(sim<N_SIMS?'<button class="btn btn-tonal" id="rNext">Ir ao Simulado '+(sim+1)+'</button>':'')
    +'<button class="btn btn-outline" id="rRedo">Refazer do zero</button>'
    +'<button class="btn btn-outline" id="rHome">Voltar ao início</button>'
    +'</div>'
    +summaryImageHTML()
    +'</div>';
  showSessionScreen('scrResult');
  wireGrid($('scrResult'),sim,'correcao');
  $('rCorr').onclick=()=>startSession('correcao',sim);
  const rw=$('rWrong');if(rw)rw.onclick=()=>startSession('correcao',sim,wrongList);
  const rb=$('rBlank');if(rb)rb.onclick=()=>startSession('correcao',sim,blankList);
  const rn=$('rNext');if(rn)rn.onclick=()=>startSession('sim',sim+1);
  $('rRedo').onclick=async()=>{
    if(await mConfirm({title:'Refazer o Simulado '+sim+'?',body:'As respostas deste simulado serão apagadas para você refazê-lo do zero.',ok:'Apagar e refazer',danger:true}))
      {for(let n=1;n<=60;n++){delete state.ans[sim+'-'+n];delete state.flags[sim+'-'+n];}delete state.times[sim];delete state.fins[sim];save();startSession('sim',sim);}
  };
  $('rHome').onclick=()=>goScreen('home');
  window.scrollTo(0,0);
}
function renderResults(){

    pushHistory('estudo',s,ok,blank);
    addXP(25+Math.round(ok/60*100/2));
  }
  save();checkAch();
  if(!was&&allSimuladosDone()){pendingFw=true;SFX.finish();}
  const groups=[['Língua Portuguesa',1,15],['Raciocínio Lógico',16,25],['Administração',26,45],['Conhecimentos Técnicos',46,60]];

    +'<div class="result-grid">'+cells+'</div>'
    +'<div class="msg">'+msg+'</div>'
    +'<div class="chips" style="justify-content:center;margin-top:18px"><span class="chip chip-ok">✓ Acertou</span><span class="chip chip-bad">✗ Errou</span></div>'
    +'<div class="agrid">'+tiles+'</div>'
    +'<div class="msg" style="font-size:.8rem">Toque/clique em um número para rever a questão com a explicação.</div>'
    +'<div class="result-actions">'
    +(s<N_SIMS?'<button class="btn btn-filled" id="rNext">Ir ao Simulado '+(s+1)+'</button>':'')
    +'<button class="btn btn-tonal" id="rRev">Modo revisão geral</button>'
    +'<button class="btn btn-outline" id="rHome">Voltar ao início</button>'
    +'</div>'
    +summaryImageHTML()
    +'</div>';
  session=null;
  showSessionScreen('scrResult');
  wireGrid($('scrResult'),s,'sim');
  const rn=$('rNext');if(rn)rn.onclick=()=>startSession('sim',s+1);
  $('rRev').onclick=()=>startSession('rev');
  $('rHome').onclick=()=>goScreen('home');
  window.scrollTo(0,0);
}
function renderRevSummary(){
  const isFlash=session.kind==='flash',isTrain=session.kind==='train';
  const t=session.right+session.wrong;
  const pct=t?Math.round(session.right/t*100):0;
  const title=isFlash?'Sessão de flashcards concluída':(isTrain?'Treino concluído':'Sessão de revisão concluída');
  const chips=session.wrongKeys.map(k=>{const p=k.split('-');return '<span class="chip chip-bad">S'+p[0]+' • Q'+p[1]+'</span>';}).join('');
  stopStudyTick();
  $('scrRevSum').innerHTML='<div class="card result-hero">'
    +'<div class="pct">'+title+'</div>'
    +'<div class="big">'+pct+'%</div>'
    +'<div class="msg">'+session.right+' acerto(s) e '+session.wrong+' erro(s) nesta sessão'+(isFlash?' — '+(state.stats.flashSeen||0)+' flashcards avaliados no total':'')+'.</div>'
    +(session.wrongKeys.length?'<div class="msg"><b>Questões erradas nesta sessão:</b></div><div class="wrong-list">'+chips+'</div>':'<div class="msg">Nenhum erro nesta sessão. Excelente! 🎉</div>')
    +'<div class="result-actions">'
    +(session.wrongKeys.length?'<button class="btn btn-filled" id="rvAgain">Revisar apenas as que errei</button>':'')
    +'<button class="btn btn-tonal" id="rvFull">Repetir '+(isFlash?'flashcards':(isTrain?'treino':'revisão completa'))+'</button>'
    +'<button class="btn btn-outline" id="rvHome">Voltar ao início</button>'
    +'</div>'
    +summaryImageHTML()
    +'</div>';
  const wk=session.wrongKeys.slice();
  const kind=session.kind,opts=session.opts;
  session=null;
  showSessionScreen('scrRevSum');
  const ra=$('rvAgain');
  if(ra)ra.onclick=()=>{
    const list=wk.map(k=>{const p=k.split('-');return QUESTIONS.find(q=>q.s==p[0]&&q.n==p[1]);}).filter(Boolean);
    startSession('rev',null,list,{label:'Reforço dos erros'});
  };
  $('rvFull').onclick=()=>{
    if(kind==='flash')goScreen('practice');
    else if(kind==='train')goScreen('practice');
    else goScreen('review');
  };
  $('rvHome').onclick=()=>goScreen('home');
  window.scrollTo(0,0);
}

function renderNav(){
  if(!session||session.kind!=='sim')return;
  const sim=session.sim;
  $('navTitle').textContent='Questões — Simulado '+sim;
  const grid=$('navGrid');grid.innerHTML='';
  session.list.forEach((q,idx)=>{
    const k=keyOf(q);
    const b=document.createElement('button');
    b.className='nq'+(state.ans[k]?' done':'')+(idx===session.i?' cur':'')+(state.flags[k]?' flag':'');
    b.textContent=q.n;
    b.onclick=()=>{session.i=idx;session.sel=null;session.locked=false;session.flipped=false;hideNav();renderQuestion();};
    grid.appendChild(b);
  });
  const done=countAnswered(sim);
  const fl=Object.keys(state.flags).filter(k=>k.indexOf(sim+'-')===0).length;
  $('navStats').innerHTML='Respondidas: <b>'+done+'/60</b> &nbsp;•&nbsp; Marcadas: <b>'+fl+'</b>';
  $('navFinish').style.display=session.exam?'':'none';
  $('navOverlay').classList.remove('hidden');
}
function hideNav(){$('navOverlay').classList.add('hidden');}

/* ================================================================
   FOGOS DE ARTIFÍCIO — efeitos surpresa, sem aviso prévio:
   1) ao abrir o app, quando TODOS os simulados já estiverem
      concluídos; e
   2) na primeira volta à tela inicial logo após concluir o
      último simulado.
   Motor próprio em canvas (foguetes + explosões + faíscas com
   gravidade, atrito e tremulação), sem bibliotecas externas.
   ================================================================ */
const FW={
  running:false,canvas:null,ctx:null,raf:null,
  rockets:[],sparks:[],flashes:[],
  endsAt:0,nextLaunch:0,palette:[]
};
function fwPalette(){
  return document.documentElement.getAttribute('data-theme')==='dark'
    ?['#FFD54F','#FF6FB5','#B388FF','#4FE0D6','#FF8A65','#F48FB1','#FFF176','#82B1FF']
    :['#F50057','#7C4DFF','#00BFA5','#F57C00','#C2185B','#3949AB','#EF6C00','#6A1B9A'];
}
function fwStart(durationMs){
  if(FW.running)return;
  const c=document.createElement('canvas');
  c.setAttribute('aria-hidden','true');
  c.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;z-index:1000;pointer-events:none;';
  document.body.appendChild(c);
  FW.canvas=c;FW.ctx=c.getContext('2d');
  const d=window.devicePixelRatio||1;
  c.width=innerWidth*d;c.height=innerHeight*d;
  FW.ctx.setTransform(d,0,0,d,0,0);
  FW.running=true;FW.rockets=[];FW.sparks=[];FW.flashes=[];
  FW.palette=fwPalette();
  FW.endsAt=performance.now()+durationMs;
  FW.nextLaunch=performance.now()+250;
  fwLoop();
}
function fwStop(){
  FW.running=false;
  if(FW.raf)cancelAnimationFrame(FW.raf);
  if(FW.canvas){FW.canvas.remove();FW.canvas=null;}
  FW.rockets=[];FW.sparks=[];FW.flashes=[];
}
window.addEventListener('resize',()=>{
  if(FW.running&&FW.canvas){
    const d=window.devicePixelRatio||1;
    FW.canvas.width=innerWidth*d;FW.canvas.height=innerHeight*d;
    FW.ctx.setTransform(d,0,0,d,0,0);
  }
});
function fwLoop(){
  if(!FW.running)return;
  FW.raf=requestAnimationFrame(fwLoop);
  const ctx=FW.ctx,now=performance.now(),W=innerWidth,H=innerHeight;
  ctx.globalCompositeOperation='destination-out';
  ctx.fillStyle='rgba(0,0,0,0.16)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  if(now<FW.endsAt-900&&now>=FW.nextLaunch){
    FW.nextLaunch=now+260+Math.random()*420;
    FW.rockets.push({
      x:W*(0.08+Math.random()*0.84),
      y:H+6,
      vx:(Math.random()-0.5)*1.4,
      vy:-(H*0.0115+Math.random()*H*0.0035),
      ty:H*(0.14+Math.random()*0.30),
      col:FW.palette[Math.floor(Math.random()*FW.palette.length)],
      trail:0
    });
  }
  for(let i=FW.rockets.length-1;i>=0;i--){
    const r=FW.rockets[i];
    r.x+=r.vx;r.y+=r.vy;r.vy+=H*0.00022;
    if(++r.trail%2===0){
      FW.sparks.push({x:r.x,y:r.y,vx:r.vx*0.15+(Math.random()-0.5)*0.3,vy:Math.random()*0.5,g:0.02,life:16,max:16,col:'#FFE9A8',sz:1.4});
    }
    ctx.fillStyle='#FFFFFF';
    ctx.beginPath();ctx.arc(r.x,r.y,1.8,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.55;ctx.fillStyle=r.col;
    ctx.beginPath();ctx.arc(r.x,r.y,3.4,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    if(r.y<=r.ty||r.vy>=-1.2){
      fwExplode(r.x,r.y,r.col);
      FW.rockets.splice(i,1);
    }
  }
  for(let i=FW.flashes.length-1;i>=0;i--){
    const f=FW.flashes[i];
    f.r+=f.vr;f.a*=0.88;
    if(f.a<0.03){FW.flashes.splice(i,1);continue;}
    ctx.globalAlpha=f.a;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.strokeStyle=f.col;ctx.lineWidth=2;ctx.stroke();
    ctx.globalAlpha=1;
  }
  for(let i=FW.sparks.length-1;i>=0;i--){
    const s=FW.sparks[i];
    s.x+=s.vx;s.y+=s.vy;s.vy+=s.g;s.vx*=0.985;s.vy*=0.99;
    s.life--;
    if(s.life<=0||s.y>H+30){FW.sparks.splice(i,1);continue;}
    const t=s.life/s.max;
    let a=t<0.35?(Math.random()<0.5?t:t*0.3):t;
    ctx.globalAlpha=Math.max(a,0);
    ctx.fillStyle=s.col;
    ctx.beginPath();ctx.arc(s.x,s.y,s.sz*(0.5+t*0.7),0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  if(now>FW.endsAt&&FW.rockets.length===0&&FW.sparks.length===0&&FW.flashes.length===0){
    fwStop();
  }
}
function fwExplode(x,y,col){
  const H=innerHeight;
  const big=Math.random()<0.3;
  const room=Math.max(20,1500-FW.sparks.length);
  let n=Math.floor((big?110:70)*(innerWidth<560?0.7:1));
  n=Math.min(n,room);
  FW.flashes.push({x:x,y:y,r:4,vr:big?7:5,a:0.85,col:col});
  const sym=big?Math.random()<0.5:Math.random()<0.35;
  const base=Math.random()*Math.PI*2;
  for(let i=0;i<n;i++){
    let ang,sp;
    if(sym){ang=base+(i/n)*Math.PI*2;sp=(big?3.4:2.6)+Math.random()*1.4;}
    else{ang=Math.random()*Math.PI*2;sp=0.6+Math.random()*(big?5.2:4.2);}
    const life=50+Math.random()*70;
    FW.sparks.push({
      x:x,y:y,
      vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
      g:H*0.00030+0.018,
      life:life,max:life,
      col:Math.random()<0.22?'#FFF6D5':col,
      sz:big?2.0:1.7
    });
  }
  if(Math.random()<0.5){
    setTimeout(()=>{
      if(!FW.running)return;
      for(let k=0;k<18;k++){
        const a=Math.random()*Math.PI*2;
        const life=24+Math.random()*20;
        FW.sparks.push({x:x+(Math.random()-0.5)*20,y:y+(Math.random()-0.5)*20,vx:Math.cos(a)*1.4,vy:Math.sin(a)*1.4,g:0.02,life:life,max:life,col:'#FFE9A8',sz:1.2});
      }
    },320+Math.random()*380);
  }
}

/* ============ ATALHOS DE TECLADO ============ */
document.addEventListener('keydown',e=>{
  if(e.defaultPrevented)return;
  if(document.querySelector('#dlgHost .overlay'))return;
  if(!$('navOverlay').classList.contains('hidden')){if(e.key==='Escape')hideNav();return;}
  if(!$('obHost').classList.contains('hidden'))return;
  if(!session||ui.screen!=='quiz')return;
  if(e.target&&(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT'))return;
  const k=e.key;
  if(session.kind==='flash'){
    if(k===' '||k==='Spacebar'){flipFlash();e.preventDefault();}
    else if(k==='Enter'){if(!session.flipped)flipFlash();else gradeFlash(true);e.preventDefault();}
    else if(k==='1'){if(session.flipped)gradeFlash(false);e.preventDefault();}
    else if(k==='2'){if(session.flipped)gradeFlash(true);e.preventDefault();}
    else if(k==='ArrowRight'){nav(1);e.preventDefault();}
    else if(k==='ArrowLeft'){nav(-1);e.preventDefault();}
    else if(k==='Escape'){exitSession();}
    return;
  }
  if(k>='1'&&k<='5'){if(session.locked)return;if(session.exam)recordExamAnswer(session.list[session.i],+k-1);else selectAlt(+k-1);e.preventDefault();}
  else if(/^[a-eA-E]$/.test(k)){if(session.locked)return;const i='abcde'.indexOf(k.toLowerCase());if(session.exam)recordExamAnswer(session.list[session.i],i);else selectAlt(i);e.preventDefault();}
  else if(k==='Enter'){
    if(session.exam){if(session.i===session.list.length-1)finalizeExam();else nav(1);}
    else if(!session.locked&&session.sel!==null)confirmAnswer();
    else if(session.locked)nav(1);
    e.preventDefault();
  }
  else if(k==='ArrowRight'){nav(1);e.preventDefault();}
  else if(k==='ArrowLeft'){nav(-1);e.preventDefault();}
  else if(k==='f'||k==='F'){if(session.exam)toggleFlag();e.preventDefault();}
  else if(k==='s'||k==='S'){toggleStar();e.preventDefault();}
  else if(k==='g'||k==='G'){if(session.kind==='sim')renderNav();e.preventDefault();}
  else if(k==='Escape'){exitSession();}
});

/* ============ GESTOS DE TOQUE (deslizar) ============ */
let swipeX=null,swipeY=null;
document.addEventListener('touchstart',e=>{
  if(ui.screen!=='quiz'||!session)return;
  if(!$('navOverlay').classList.contains('hidden'))return;
  if(e.target&&e.target.closest&&e.target.closest('.note-area'))return;
  const t=e.touches[0];swipeX=t.clientX;swipeY=t.clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(ui.screen!=='quiz'||!session||swipeX===null)return;
  const t=e.changedTouches[0];
  const dx=t.clientX-swipeX,dy=t.clientY-swipeY;
  swipeX=null;
  if(Math.abs(dx)>70&&Math.abs(dy)<50){
    if(dx<0)nav(1);else nav(-1);
  }
},{passive:true});

/* ============ TOQUE DUPLO NA QUESTÃO = FAVORITAR ============ */
(function(){
  let lastTap=0,lastX=0,lastY=0;
  const tappable=e=>!(e.target&&e.target.closest&&e.target.closest('button,textarea,a,input,select,.alt,.nq,.fcard,.note-area'));
  document.addEventListener('pointerdown',e=>{
    if(!IS_TOUCH||!session||ui.screen!=='quiz'||session.kind==='flash')return;
    if(e.pointerType==='mouse')return;
    if(!tappable(e))return;
    const now=performance.now();
    if(now-lastTap<340&&Math.abs(e.clientX-lastX)<52&&Math.abs(e.clientY-lastY)<52){
      lastTap=0;toggleStar();
    }else{lastTap=now;lastX=e.clientX;lastY=e.clientY;}
  });
  document.addEventListener('dblclick',e=>{
    if(!session||ui.screen!=='quiz'||session.kind==='flash')return;
    if(!tappable(e))return;
    toggleStar();
  });
})();

/* ============ ARRASTAR PARA FECHAR (bottom sheets no toque) ============ */
(function(){
  if(!IS_TOUCH)return;
  let drag=null;
  document.addEventListener('touchstart',e=>{
    const sh=e.target&&e.target.closest?e.target.closest('#dlgHost .dlg, #navOverlay .nav-card'):null;
    if(!sh)return;
    if(sh.scrollHeight>sh.clientHeight+4&&sh.scrollTop>2)return; /* conteúdo rolado: não sequestrar o gesto */
    const t=e.touches[0];
    drag={sh:sh,x:t.clientX,y:t.clientY,t:performance.now(),dy:0,active:false};
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!drag)return;
    const t=e.touches[0];
    const dx=t.clientX-drag.x,dy=t.clientY-drag.y;
    if(!drag.active){
      if(Math.abs(dy)<10)return;
      if(Math.abs(dx)>Math.abs(dy)){drag=null;return;}
      drag.active=true;drag.sh.classList.add('dragging');
    }
    drag.dy=Math.max(0,dy);
    e.preventDefault();
    drag.sh.style.transform='translateY('+drag.dy+'px)';
    drag.sh.style.opacity=String(Math.max(.35,1-drag.dy/500));
  },{passive:false});
  document.addEventListener('touchend',()=>{
    if(!drag)return;
    const d=drag;drag=null;
    const elapsed=performance.now()-d.t;
    const vel=d.dy/Math.max(1,elapsed); /* px por ms */
    const close=d.dy>110||vel>0.55;
    d.sh.classList.remove('dragging');
    d.sh.style.transform='';d.sh.style.opacity='';
    if(close){
      if(d.sh.closest('#dlgHost')){const b=$('dlgNo');if(b)b.click();}
      else hideNav();
    }
  });
})();

/* ============ BOTÃO FLUTUANTE VOLTAR AO TOPO ============ */
