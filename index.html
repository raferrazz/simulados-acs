{s:4,n:24,q:"Uma receita de R$ 900,00 será dividida em partes diretamente proporcionais a 3, 5 e 7. A maior parte corresponde a:",a:["R$ 350,00","R$ 380,00","R$ 450,00","R$ 420,00","R$ 400,00"],c:3,e:"Total de partes: 3 + 5 + 7 = 15; 900 ÷ 15 = 60; maior = 7 × 60 = R$ 420,00. Quem marca 450 divide por 2 partes em vez de 3."},
{s:4,n:25,q:"Em um número de dois algarismos, o algarismo das dezenas excede o das unidades em 4, e a soma dos algarismos é 12. O número é:",a:["84","48","93","75","66"],c:0,e:"d + u = 12 e d − u = 4 → d = 8, u = 4 → 84. Inverter a relação (responder 48) é o erro mais comum."},
{s:4,n:26,q:"As funções administrativas foram formuladas pelos teóricos clássicos da Administração. As funções clássicas da administração segundo Fayol são:",a:["planejar, executar, pagar e avaliar","motivar, comunicar e liderar","recrutar, selecionar e treinar","prever, orçar e auditar","prever (planejar), organizar, comandar, coordenar e controlar"],c:4,e:"Fayol definiu as cinco funções clássicas: prever/planificar, organizar, comandar, coordenar e controlar — base do PODC moderno."},
{s:4,n:27,q:"O sociólogo Max Weber descreveu um tipo ideal de organização. O modelo burocrático de Weber caracteriza-se por:",a:["hierarquia de autoridade, normas escritas e impessoalidade","relações informais como base da gestão","eliminação dos registros documentais","decisões essencialmente intuitivas","cargos atribuídos por afinidade pessoal"],c:0,e:"Burocracia weberiana: hierarquia bem definida, normas formais escritas, impessoalidade (o cargo, não a pessoa) e documentação dos atos — racionalidade legal."},
{s:4,n:28,q:"A Teoria de Sistemas transformou a compreensão das organizações. As organizações compreendidas como sistemas abertos:",a:["mantêm-se estáveis por ignorar o ambiente","funcionam de modo autônomo, sem entrada de recursos","eliminam as incertezas externas por decreto","dependem apenas de recursos financeiros internos","recebem insumos do ambiente, processam-nos e devolvem produtos/serviços, retroalimentando-se e adaptando-se às mudanças"],c:4,e:"Sistema aberto: entradas (insumos), processamento, saídas e retroalimentação contínua com o ambiente — a sobrevivência depende da adaptação."},
{s:4,n:29,q:"Na reunião, a meta 'reduzir as pendências de coleta' foi criticada por não permitir verificação objetiva de cumprimento. Pela classificação SMART, faltou à meta o atributo:",a:["específica","mensurável","alcançável","relevante","temporal"],c:1,e:"'Reduzir pendências' sem número-alvo não é mensurável: não há como verificar objetivamente se foi cumprida. Especificidade e prazo são outros atributos, mas a crítica aponta para a mensuração."},
{s:4,n:30,q:"A motivação pode ser explicada por modelos que articulam crenças e valores do trabalhador. Na teoria da expectativa (Vroom), a motivação depende de:",a:["apenas do salário recebido","fatores higiênicos do ambiente","hierarquia de necessidades fixa","traços imutáveis de personalidade","da expectativa de que o esforço gera desempenho e de que o desempenho leva a recompensas valorizadas"],c:4,e:"Vroom: motivação = expectativa (esforço→desempenho) × instrumentalidade (desempenho→recompensa) × valência (valor da recompensa para a pessoa). Se qualquer elo quebra, a motivação desaba."},
{s:4,n:31,q:"Cada estilo clássico de liderança traça um modo próprio de decidir e comunicar. A liderança autocrática caracteriza-se por:",a:["decidir sozinho e determinar as tarefas, com comunicação predominantemente descendente","compartilhar todas as decisões com a equipe","estimular a participação ampla","evitar qualquer direção à equipe","basear-se em consenso permanente"],c:0,e:"O líder autocrático centraliza decisões e a comunicação flui de cima para baixo; eficiência a curto prazo em tarefas simples, mas sacrifica comprometimento e iniciativa."},
{s:4,n:32,q:"Abordar informantes e conduzir a equipe exige do ACS uma comunicação de qualidade. A escuta ativa, essencial na abordagem de informantes e na gestão de equipe, consiste em:",a:["preparar a resposta enquanto o outro fala","interromper para acelerar o diálogo","ignorar os aspectos não verbais","fingir atenção para ser educado","ouvir com atenção plena, sem interromper, verificando o entendimento do que foi dito"],c:4,e:"Escuta ativa: atenção total, empatia, paráfrase de verificação ('entendi corretamente que...?') e leitura da comunicação não verbal."},
{s:4,n:33,q:"Decidir em grupo tem virtudes e riscos estudados pela Administração. O fenômeno do 'groupthink' (pensamento de grupo) consiste em:",a:["decisão grupal sempre superior à individual","técnica estruturada de brainstorming","conflito saudável de ideias","consenso obtido por votação","pressão à conformidade que compromete a avaliação crítica de alternativas"],c:4,e:"No groupthink, a coesão e o desejo de harmonia levam à autocrítica e ao silêncio diante de riscos — o grupo 'pensa igual' para não romper o consenso, decidindo pior."},
{s:4,n:34,q:"Há várias maneiras de agrupar as atividades de uma organização. A departamentalização geográfica consiste em:",a:["agrupar as atividades por tipo de cliente","agrupar por fases do processo produtivo","agrupar por especialidade técnica","eliminar gerentes regionais","agrupar atividades por território/localização"],c:4,e:"A departamentalização territorial agrupa atividades por região — adequada a operações dispersas como a censitária (postos, setores, municípios)."},
{s:4,n:35,q:"Um avaliador atribui nota máxima a um recenseador por ele ter sido destaque no treinamento, desconsiderando falhas posteriores registradas na coleta. O erro de avaliação cometido foi:",a:["tendência central","efeito halo","leniência generalizada","comparação com pares","rigor excessivo"],c:1,e:"Efeito halo: uma impressão forte e saliente (destaque no treinamento) contamina o julgamento global, cegando o avaliador para evidências posteriores contrárias."},
{s:4,n:36,q:"Situação gerencial – Um recenseador competente, porém tímido, evita pedir ajuda e acumula dúvidas. O ACS deve:",a:["esperar que o problema se resolva sozinho","criticá-lo publicamente na reunião de equipe","substituí-lo imediatamente","reduzir-lhe a carga de trabalho sem conversar","criar momentos regulares de aproximação, estimular perguntas e oferecer apoio técnico"],c:4,e:"Liderança de suporte: aproximação estruturada (contatos regulares), estímulo explícito a perguntas e suporte técnico — reduz a barreira sem expor nem punir o profissional tímido."},
{s:4,n:37,q:"Situação gerencial – Um informante altera o tom e agride verbalmente o recenseador. O ACS deve orientar:",a:["instruir o recenseador a revidar a agressão","exigir que o recenseador permaneça até concluir a entrevista","ignorar o fato","orientar postura profissional e serena, encerrar o contato com segurança, registrar a ocorrência e comunicar a supervisão","publicar o caso nas redes sociais"],c:3,e:"Prioridade: integridade física e profissional — encerrar o contato com segurança, registrar a ocorrência e acionar a supervisão. Revide, submissão forçada e exposição pública agravam o risco."},
{s:4,n:38,q:"Situação gerencial – O ACS identifica indícios de que questionários foram preenchidos sem visita real (possível fraude). Deve:",a:["confrontar publicamente o suspeito","apagar os questionários suspeitos","ignorar por receio de conflito","pedir ao suspeito que refaça tudo sozinho","apurar com discrição por meio de verificações (revisão de percurso, reentrevistas), documentar evidências e comunicar/encaminhar às instâncias competentes"],c:4,e:"O dever de denunciar irregularidades passa por apuração discreta e documentada (verificações e reentrevistas), sigilo e encaminhamento formal — nunca justiça própria, apagamento de provas ou omissão."},
{s:4,n:39,q:"Situação gerencial – Um recenseador tem carga de setores muito maior que a dos colegas. O ACS deve:",a:["manter, pois ele já está acostumado","transferir a diferença para o mais recente","solicitar o desligamento do sobrecarregado","deixar que a própria equipe resolva sem dados","redistribuir as cargas com base em critérios técnicos (área, dificuldade, acessos) e comunicar o novo plano"],c:4,e:"Equidade de carga: critérios técnicos e transparentes (extensão, dificuldade de acesso, número de estabelecimentos), plano comunicado — sobrecarga crônica gera queda de qualidade e absenteísmo."},
{s:4,n:40,q:"Situação gerencial – Uma falha de energia impediu as transmissões noturnas de dados. O ACS deve:",a:["ocultar o fato do ACR","culpar o ACI publicamente","ignorar, pois a internet resolve","suspender toda a coleta até a resolução","registrar a ocorrência, replanejar as transmissões e comunicar a supervisão, monitorando as pendências no sistema"],c:4,e:"Controle gerencial: registrar o evento, replanejar (rotina alternativa de transmissão) e comunicar a cadeia de supervisão com transparência, monitorando as pendências — ocultar ou suspender tudo são extremos igualmente ruins."},
{s:4,n:41,q:"Situação gerencial – A equipe solicita mudança do horário de trabalho, alegando dificuldades de deslocamento até o posto. O ACS deve:",a:["negar sem qualquer análise","acatar sem avaliar o impacto","permitir que cada um faça o que quiser","escalar ao AOR sem qualquer análise","avaliar o impacto no serviço e na cobertura, negociar condições que preservem as metas e formalizar o combinado"],c:4,e:"Negociação ganha-ganha: análise de impacto (cobertura, coincidência com informantes), acordo que preserve as metas e formalização — abrir mão de critérios ou engavetar o pedido gera conflito maior."},
{s:4,n:42,q:"Situação gerencial – O CEQ notifica uma inconsistência em setores da área, com prazo curto para resposta. O ACS deve:",a:["responder que o prazo é impossível","questionar o CEQ sem evidências","delegar ao recenseador sem orientação","aguardar um novo prazo","priorizar a demanda, organizar as verificações/reentrevistas e responder dentro do prazo, implantando as correções"],c:4,e:"Demandas de qualidade têm prioridade e prazo: organizar as verificações, responder dentro do prazo e implantar as correções — reclamar do prazo ou delegar sem orientação agrava o problema."},
{s:4,n:43,q:"Situação gerencial – Uma nova política da coordenação é impopular na equipe, que questiona seus critérios em conversas informais. O ACS deve:",a:["ignorar a orientação","sabotar discretamente a política","prometer que não será aplicada","deixar a equipe decidir se cumpre","implementá-la conforme as normas, explicar o racional à equipe e canalizar formalmente as dúvidas e o feedback"],c:4,e:"O gestor intermediário executa as decisões institucionais, explica o racional (reduz resistência), reprime boatos e canaliza formalmente o feedback — sabotar ou prometer não-cumprimento é insubordinação."},
{s:4,n:44,q:"Situação gerencial – Um recenseador superou as metas da semana com qualidade excepcional de preenchimento. Para reconhecer um bom desempenho, a prática mais eficaz é:",a:["reconhecimento genérico, apenas anual","conceder apenas bônus financeiro","não reconhecer, pois cumprir metas é obrigação","reconhecer imediatamente e de forma específica, vinculando o elogio ao comportamento observado","reconhecer apenas os favoritos"],c:3,e:"Reforço positivo eficaz: imediato, específico e justo, ligado ao comportamento que se quer consolidar — elogio genérico e tardio (ou só dinheiro) não ensina o que deve ser repetido."},
{s:4,n:45,q:"Situação gerencial – O ACS percebe que vem microgerenciando a equipe e o ritmo de trabalho caiu. Deve:",a:["intensificar ainda mais o controle","isolar-se da equipe","delegar tudo sem critério nem monitoramento","reduzir as metas da equipe","delegar com autonomia e clareza de resultados, monitorando indicadores em vez de cada passo"],c:4,e:"Gestão por resultados: autonomia com expectativas claras e monitoramento por indicadores. Microgestão engessa e desmotiva; delegação sem controle é abdicação — o equilíbrio está no acompanhamento por resultados."},
{s:4,n:46,q:"À estrutura permanente do IBGE, a operação censitária soma unidades temporárias. A estrutura permanente do IBGE, na operação censitária, é distribuída:",a:["apenas nos postos censitários","na Sede (diretorias e coordenações-gerais) e nas Superintendências Estaduais (SES)","apenas na Sede","apenas nos CEQs","apenas nos municípios"],c:1,e:"A estrutura permanente distribui-se na Sede e nas SES, ambas ligadas à presidência; para o Censo, ela é ampliada por estrutura temporária (CNQ, CEQ, postos censitários)."},
{s:4,n:47,q:"Julgue as afirmativas sobre tipos de setores censitários, conforme o material do Censo, e assinale a alternativa correta.\n\nI. Quartel e Base Militar é o setor de instalação administrada por um comando das forças armadas, assim considerado caso possua pelo menos 50 habitantes permanentes residindo há mais de um ano no local.\nII. Unidade prisional é o setor relacionado às unidades prisionais que abrigam mais de 50 presos permanentes.\nIII. Convento, Hospital, ILPI e IACA correspondem a setores de domicílios coletivos que contenham, cada um, mais de 15 habitantes permanentes residindo há mais de um ano.",a:["apenas I está correta","apenas II está correta","I e II estão corretas, e III está incorreta","todas estão corretas","apenas III está correta"],c:2,e:"I e II reproduzem literalmente o material. III está incorreta: conventos, hospitais, ILPI e IACA caracterizam setores quando contêm, cada um, mais de 50 habitantes permanentes residindo há mais de um ano — o número 15 é o marco dos agrupamentos indígena e quilombola."},
{s:4,n:48,q:"Os postos censitários apoiam materialmente a operação de coleta. Os postos censitários, unidades de apoio à operação, são vinculados:",a:["às Superintendências Estaduais e Agências","diretamente à Presidência da República","ao CNQ","ao CEQ","às prefeituras municipais"],c:0,e:"Os postos censitários são vinculados às SES e Agências (a rede permanente conta com 27 SES e 566 Agências municipais), atendendo a um município ou conjunto de municípios."},
{s:4,n:49,q:"Para a realização do 12º Censo Agropecuário, em 2027, serão contratados cerca de quantos profissionais temporários?",a:["8 mil","20 mil","cerca de 36 mil","100 mil","5 mil"],c:2,e:"O material informa a contratação de cerca de 36 mil profissionais temporários, via processos seletivos simplificados, para ampliar a estrutura permanente do IBGE."},
{s:4,n:50,q:"A coleta do 12º Censo Agropecuário, Florestal e Aquícola será realizada em 2027, tendo como referência:",a:["os dados do ano de 2025","os dados do próprio ano de 2027","os dados do ano de 2024","os dados do ano de 2026","os dados do ano de 2028"],c:3,e:"A coleta ocorrerá em 2027, com referência nos dados de 2026 — ou seja, o período de referência é o ano anterior à coleta."},
{s:4,n:51,q:"A série dos Censos Agropecuários brasileiros confunde-se com a própria história da estatística nacional. O Brasil realizou seu primeiro Censo Agropecuário em:",a:["1940","1936","2007","1996","1920"],c:4,e:"O primeiro Censo Agropecuário foi em 1920; o IBGE, hoje responsável pelos censos do País, foi fundado em 1936."},
{s:4,n:52,q:"Os Censos Agropecuários brasileiros foram realizados de dez em dez anos de 1940 a 1970. A partir de então, passaram a ocorrer:",a:["a cada dois anos","sem periodicidade definida","anualmente","a cada cinco anos","a cada quinze anos"],c:3,e:"A partir de 1970, os Censos Agro passaram a quinquenais (1975, 1980, 1985). Em 1990 não foi possível executá-lo, realizado somente em 1996; no século XXI, 2007 e 2017."},
{s:4,n:53,q:"Plantação que nasce, cresce e é colhida no mesmo ano, precisando ser replantada a cada ciclo, é classificada como:",a:["lavoura permanente","lavoura temporária","horticultura","silvicultura","exploração comunitária"],c:1,e:"Lavoura temporária: milho, feijão, arroz, soja. Lavoura permanente planta-se uma vez e produz por muitos anos (café, laranja, uva) — a distinção afeta o registro de estabelecimentos novos com 'pés novos'."},
{s:4,n:54,q:"A hidroponia — cultivo de plantas sem solo, com as raízes recebendo solução nutritiva balanceada — é classificada no material como:",a:["cultivo em outros meios","lavoura permanente","aquicultura","extrativismo vegetal","atividade não recenseável"],c:0,e:"A hidroponia é exemplo de 'cultivo em outros meios' — atividade agropecuária investigada pelo Censo, ainda que sem uso do solo."},
{s:4,n:55,q:"O Censo Agropecuário investiga, além da lavoura e da pecuária, as atividades aquícolas. São exemplos de atividades aquícolas investigadas pelo Censo:",a:["a criação de peixes, camarões, moluscos, jacarés e rãs","a pesca industrial em alto-mar","a criação de cães e gatos","o plantio de eucalipto para celulose","a coleta de látex de seringueiras"],c:0,e:"Aquicultura: criação de peixes, camarões, moluscos, jacarés e rãs — produção aquícola investigada (incluindo o pesque-pague com criação/engorda). Pesca de captura e criação de animais domésticos não são."},
{s:4,n:56,q:"Em uma área de exploração comunitária, as famílias trabalham juntas em uma mesma área e dividem entre si a produção. Nesse caso, deve-se preencher:",a:["um questionário por família","apenas um questionário","um questionário por trabalhador","nenhum questionário, por se tratar de terra coletiva","dois questionários: um coletivo e um individual"],c:1,e:"Produção coletiva (famílias juntas na mesma área, dividindo o resultado): um único questionário. Produção individual (cada família decide o que produzir e o destino): um questionário por família."},
{s:4,n:57,q:"Lojas, escolas, hospitais e igrejas, bem como as unidades domiciliares encontradas no setor:",a:["devem ser recenseados com questionário simplificado","devem ser encaminhados ao ACR para decisão","são recenseados apenas se tiverem horta ou criação de animais","não fazem parte da coleta do Censo Agropecuário, que recenseia apenas estabelecimentos agropecuários","recebem o questionário do Censo Demográfico no mesmo DMC"],c:3,e:"Apenas estabelecimentos agropecuários (com produção/exploração para venda ou subsistência) são recenseados — lojas, escolas, hospitais, igrejas e domicílios ficam fora do Censo Agro. (Uma escola com horta de lazer também não é recenseável.)"},
{s:4,n:58,q:"A tecnologia embarcada no DMC auxilia a orientação em campo. Sobre o uso do GPS integrado ao DMC, o material alerta que:",a:["o GPS dispensa o mapa do setor em papel","o mapa em papel deve substituir integralmente o DMC","confiar exclusivamente no GPS ou deixar de utilizar o mapa em papel são erros que devem ser evitados","o GPS deve ser desativado em setores rurais","as coordenadas capturadas dispensam o registro do endereço"],c:2,e:"Alerta expresso: a tecnologia auxilia o trabalho, mas a interpretação correta das informações depende do Recenseador — nem confiança cega no GPS, nem abandono do mapa em papel."},
{s:4,n:59,q:"O tipo de setor censitário que abrange baixa quantidade de domicílios, ou no qual não foi identificada a presença de domicílios, denomina-se:",a:["Aglomerado rural","Setor com Baixo Patamar Domiciliar","Área urbana de baixa densidade de edificações","Agrupamento Indígena","Núcleo urbano"],c:1,e:"Setor com Baixo Patamar Domiciliar é exatamente o que abrange baixa quantidade de domicílios ou no qual não se identificou a presença de domicílios. Não confundir com a área urbana de baixa densidade de edificações (expansão urbana, áreas verdes desabitadas) nem com o aglomerado rural (domicílios próximos entre si, afastados de cidades e vilas)."},
{s:4,n:60,q:"Um produtor explora área contínua formada por 15,5 ha de terras próprias e 4,5 ha de terras arrendadas. Para o Censo, trata-se de:",a:["dois estabelecimentos, um por forma de posse","um único estabelecimento agropecuário, com área total de 20 ha","um único estabelecimento, com área de 15,5 ha","dois estabelecimentos, com 10 ha cada","estabelecimento não recenseável, por misturar formas de posse"],c:1,e:"É o exemplo do próprio material: áreas contínuas com formas de posse distintas (próprias + arrendadas) compõem um único estabelecimento — registra-se a área total de 20 ha. A forma de posse não fragmenta o estabelecimento contínuo."},

/* ==================== SIMULADO 5 ==================== */
{s:5,n:1,t:5,q:"O autor constrói seu argumento em oposição a uma tese corrente sobre a leitura. A tese defendida pelo autor é:",a:["a leitura rápida é a única compatível com o mundo atual","as telas aumentaram a compreensão dos textos","a leitura profunda exige método e não é um luxo dispensável","os textos antigos eram melhor escritos","deve-se evitar qualquer extração de informação útil"],c:2,e:"O autor rebate a tese contrária ('é um erro de avaliação') e defende que ler devagar 'não é nostalgia: é método' — a lentidão permite perceber o que o texto esconde, formular perguntas e contestar o autor."},
{s:5,n:2,t:5,q:"No fecho do texto, o autor alerta para o risco de colher 'as conclusões prontas de outrem'. No texto, a palavra 'outrem' significa:",a:["o próprio autor do texto","os leitores distraídos","os editores das revistas","outra pessoa, um terceiro","ninguém, em sentido absoluto"],c:3,e:"Outrem = outra pessoa, alguém distinto de mim. As 'conclusões prontas de outrem' são as formuladas por terceiros — o leitor que apenas as colhe abre mão do próprio juízo."},
{s:5,n:3,t:5,q:"O parágrafo final sintetiza a crítica do autor à leitura apressada. Segundo o texto, quem se contenta com as 'conclusões prontas de outrem':",a:["economiza tempo sem qualquer prejuízo intelectual","renuncia, sem perceber, ao próprio juízo","compreende mais profundamente o texto","passa a respeitar mais o autor","aprende a ler com mais velocidade"],c:1,e:"O texto conclui: colher frases e conclusões prontas significa 'abrir mão, sem perceber, do próprio juízo' — a perda é justamente a capacidade de julgar por conta própria, e o 'sem perceber' indica que a renúncia é inconsciente."},
{s:5,n:4,q:"Nos avisos fixados no quadro do posto, o emprego da crase é frequente — e nem sempre correto. Assinale a alternativa em que o emprego da crase está CORRETO:",a:["A partir de hoje, o posto abre às 8 horas.","Dirigiu-se a diretoria estadual.","Estamos à seu dispor.","Vendeu os equipamentos à prazo.","Retornou à cavalo ao posto."],c:0,e:"Crase antes de horas determinadas (às 8 horas). Não ocorre antes de possessivo (a seu dispor), masculino (a prazo, a cavalo) nem em 'a partir de'; 'a diretoria' (feminino determinado, com preposição) exigiria crase: à diretoria."},
{s:5,n:5,q:"Ao encerrar o expediente, o recenseador anotou em seu diário de campo a frase a seguir, com uma lacuna. Complete corretamente: '______ duas horas da tarde quando o recenseador encerrou a rota.'",a:["Era","É","Será","Fora","Eram"],c:4,e:"O verbo 'ser', com sujeito expresso por palavras de tempo (horas), concorda com elas: Eram duas horas."},
{s:5,n:6,q:"O envio de planilhas ao posto motivou a redação de cinco frases. Assinale a alternativa correta quanto à concordância nominal:",a:["Segue anexo as planilhas da coleta.","Seguem anexas as planilhas da coleta.","As planilhas segue anexas.","A fotografia do setor seguem anexa.","Seguem anexo as planilhas da coleta."],c:1,e:"'Anexo' é adjetivo: concorda com o substantivo (planilhas) — seguem anexas. As demais violam a concordância em gênero/número ou de sujeito-verbo."},
{s:5,n:7,q:"A norma-padrão exige atenção a verbos como esquecer-se, assistir e obedecer. Assinale a alternativa em que a regência está de acordo com a norma-padrão:",a:["Esqueci-me do prazo da transmissão dos dados.","Esqueci-me o prazo da transmissão dos dados.","O ACS assistiu a palestra sem fazer anotações.","A equipe obedeceu o cronograma estabelecido.","Prefiro mais o escritório do que o trabalho de campo."],c:0,e:"'Esquecer-se DE algo' (pronominal + preposição). Assistir (ver) exige 'a' (à palestra); obedecer exige 'a' (ao cronograma); 'prefiro mais... do que' é redundância incompatível com 'preferir X a Y'."},
{s:5,n:8,q:"Cinco versões da mesma frase do coordenador diferem apenas na pontuação. Assinale a alternativa pontuada CORRETAMENTE:",a:["O coordenador disse, que a meta foi cumprida.","O coordenador, disse que a meta foi cumprida.","O coordenador disse que a meta foi cumprida.","O coordenador disse que, a meta foi cumprida.","O coordenador disse que a meta, foi cumprida."],c:2,e:"Oração subordinada substantiva objetiva direta não se separa do verbo por vírgula — vírgula entre verbo e seu complemento oracional é erro clássico."},
{s:5,n:9,q:"A palavra 'eventual' aparece destacada em uma frase do relatório do ACS. Em 'A visita do ACS ao setor foi apenas EVENTUAL', a palavra destacada significa:",a:["frequente","constante","previsível","ocasional","habitual"],c:3,e:"Eventual = ocasional, esporádico. Cuidado com o sentido coloquial de 'eventual' como 'possível' — aqui é 'que ocorre de vez em quando'."},
{s:5,n:10,q:"No vocabulário formal, verbos como 'dissuadir' exigem precisão de sentido. Assinale o ANTÔNIMO de 'dissuadir':",a:["dissolver","enganar","persuadir","distorcer","adiar"],c:2,e:"Dissuadir = desestimular, convencer a não fazer. O antônimo é persuadir (convencer a fazer). Dissolver é parônimo, não antônimo."},
{s:5,n:11,q:"Complete: 'O supervisor chegou ao local em ______ hora; o ______ perfume das flores impregnava o ar.'",a:["fragrante / flagrante","flagrante / flagrante","fragrante / fragrante","flagrante / flagelante","flagrante / fragrante"],c:4,e:"Flagrante = evidente, atual (em flagrante hora = naquele momento); fragrante = perfumado, que exala fragrância. Parônimos de troca fácil."},
{s:5,n:12,q:"O modo verbal escolhido pelo falante expressa sua atitude diante do fato. Em 'Espero que o setor seja fechado hoje', a forma verbal 'seja' está no:",a:["presente do subjuntivo","futuro do subjuntivo","imperativo","presente do indicativo","pretérito perfeito do indicativo"],c:0,e:"Verbo 'esperar que' (desejo/expectativa) exige presente do subjuntivo: 'seja'. O futuro do subjuntivo apareceria em orações condicionais/temporais ('quando o setor for fechado')."},
{s:5,n:13,q:"No registro de uma entrevista, o recenseador deixou a frase a seguir por completar. Complete: 'O informante ______ o recenseador falou era surdo.'",a:["que","cujo","com quem","onde","a cujo"],c:2,e:"A regência de 'falar COM alguém' exige o relativo preposicionado 'com quem'. 'Que' ignoraria a preposição exigida; 'cujo' expressa posse; 'onde' indica lugar."},
{s:5,n:14,q:"No vocabulário cotidiano da equipe, há palavras cuja acentuação gera dúvida. Assinale a palavra CORRETAMENTE acentuada:",a:["rúbrica","ítem","juíz","ônix","vazío"],c:3,e:"'Ônix' é paroxítona terminada em -x e é acentuada, como látex e fênix. As grafias corretas das demais são: rubrica, item, juiz e vazio — todas sem acento."},
{s:5,n:15,q:"As formas verbais irregulares são ponto clássico de avaliação. Assinale a alternativa em que o emprego da forma verbal está de acordo com a norma-padrão:",a:["O fiscal interviu na discussão.","O fiscal interveio na discussão.","Quando eu ver o resultado, avisarei.","Se ele pôde vir, teria participado.","Eles vêm ontem ao posto para assinar."],c:1,e:"'Intervir' deriva de 'vir': interveio (nunca 'interviu'). Corretos seriam: quando eu vir (futuro do subjuntivo), se ele pudesse vir, teria participado (correlação), eles vieram ontem (passado)."},
{s:5,n:16,q:"Um empréstimo de R$ 1.500,00, contratado a juros simples de 3% ao mês, foi quitado por R$ 1.860,00. O prazo do empréstimo foi de:",a:["4 meses","6 meses","8 meses","9 meses","12 meses"],c:2,e:"Juros produzidos: M − C = 1.860 − 1.500 = R$ 360,00. Na fórmula dos juros simples, J = C × i × t: 360 = 1.500 × 0,03 × t → 360 = 45t → t = 8 meses. Basta dividir os juros pelo valor da taxa mensal em reais (45); usar 1.860 como capital, em vez de 1.500, é o erro que leva às demais alternativas."},
{s:5,n:17,q:"Dois ACS treinam 30 recenseadores em 9 dias, mantido o padrão de produtividade. Três ACS treinarão 45 recenseadores em:",a:["6","9","12","8","10"],c:1,e:"Ritmo: 30 ÷ (2 × 9) = 5/3 recenseador por ACS-dia. Novo total: 45 ÷ (3 × 5/3) = 45 ÷ 5 = 9 dias. Quem responde 6 ou 12 varia só um dos dois fatores."},
{s:5,n:18,q:"Considere a sequência registrada no painel de produção do setor: 121, 100, 81, 64, ... Assinale o próximo termo da sequência:",a:["36","45","55","49","42"],c:3,e:"Quadrados perfeitos decrescentes: 11², 10², 9², 8² → 7² = 49. As diferenças (21, 19, 17, 15) também conduzem a 49 (64 − 15): dois padrões convergentes, sinal de resposta correta."},
{s:5,n:19,q:"A negação de uma conjunção exige cuidado especial. Considere a proposição: 'O recenseador é pontual e assíduo'. A negação dessa proposição é:",a:["O recenseador não é pontual e não é assíduo","O recenseador não é pontual ou não é assíduo","O recenseador é pontual ou assíduo","O recenseador não é pontual, mas é assíduo","Nenhum recenseador da equipe é pontual nem assíduo"],c:1,e:"De Morgan: ¬(P ∧ Q) = ¬P ∨ ¬Q — basta que UM dos atributos falhe para negar a conjunção. A alternativa A é mais forte do que a negação exige (ambos falhando); D nega apenas um traço; E troca o quantificador (um indivíduo → toda a equipe); C nem sequer contém negação."},
{s:5,n:20,q:"Uma sacola contém 3 maçãs e 5 laranjas. Retiram-se duas frutas ao acaso, sem reposição. A probabilidade de haver ao menos uma maçã é:",a:["9/14","5/14","3/28","15/28","3/8"],c:0,e:"P(ao menos uma) = 1 − P(nenhuma maçã) = 1 − (5/8 × 4/7) = 1 − 20/56 = 36/56 = 9/14. A alternativa 15/28 (= 30/56) é a probabilidade de exatamente uma maçã — pegadinha de leitura."},
{s:5,n:21,q:"O ACS registrou, em um gráfico de barras, os estabelecimentos recenseados por dia da semana: segunda, 20; terça, 35; quarta, 30; quinta, 45; sexta, 40. A porcentagem de dias da semana com produção diária superior à média semanal é:",a:["40%","50%","60%","70%","80%"],c:2,e:"Média semanal = (20 + 35 + 30 + 45 + 40) ÷ 5 = 170 ÷ 5 = 34. Dias acima da média: terça (35), quinta (45) e sexta (40) → 3 de 5 = 60%. A leitura de gráfico seguida de cálculo de média e porcentagem é formato recorrente da banca."},
{s:5,n:22,q:"A leitura de escalas aplica-se também ao cálculo de áreas representadas. Uma área real de 4 km² é representada, em um mapa de escala 1:50.000, por uma área de:",a:["16 cm²","8 cm²","80 cm²","4 cm²","160 cm²"],c:0,e:"Lado real de 2 km → 200.000 cm ÷ 50.000 = 4 cm no mapa; área no mapa: 4 × 4 = 16 cm². Equivale a dividir a área real pelo fator de escala ao quadrado (50.000²). Erro comum: dividir a área pelo fator linear uma só vez (80 cm²)."},
{s:5,n:23,q:"Considere: 'Nenhum ACS é Recenseador' e 'Todo Recenseador é agente censitário'. Conclui-se validamente que:",a:["todo agente censitário é ACS","nenhum agente censitário é ACS","alguns agentes censitários não são ACS","alguns ACS são recenseadores","nada se pode concluir"],c:2,e:"Todo Recenseador é agente censitário e nenhum Recenseador é ACS: os recenseadores são agentes censitários que não pertencem ao conjunto dos ACS — logo, alguns agentes censitários (os recenseadores) não são ACS. As alternativas A e B extrapolam o que as premissas autorizam."},
{s:5,n:24,q:"Em uma turma, 60% dos candidatos foram aprovados em Língua Portuguesa, 50% em Raciocínio Lógico e 20% em ambas. A porcentagem de candidatos reprovados nas duas disciplinas é:",a:["10%","20%","30%","5%","15%"],c:0,e:"P(A ou B) = 60 + 50 − 20 = 90% aprovados em ao menos uma → 10% reprovados em ambas. Quem responde 30% soma as reprovações individuais (40% + 50%), esquecendo a interseção."},
{s:5,n:25,q:"Sobre a conclusão de um levantamento no setor, três informantes fizeram afirmações. Ana disse: 'Bia mente.' Bia disse: 'Caio mente.' Caio disse: 'Ana e Bia mentem.' Considerando que cada um ou sempre diz a verdade ou sempre mente, conclui-se que:",a:["Ana é a única que diz a verdade","Bia é a única que diz a verdade","Caio é o único que diz a verdade","todas as três pessoas mentem","todas as três pessoas dizem a verdade"],c:1,e:"Teste por contradição: se Ana falasse a verdade, Bia mentiria, logo 'Caio mente' seria falso e Caio falaria a verdade — mas Caio afirma que Ana e Bia mentem, contradizendo Ana verdadeira. Logo Ana mente → 'Bia mente' é falso → Bia fala a verdade → 'Caio mente' é verdadeiro → Caio mente → 'Ana e Bia mentem' é falso (Ana mente, Bia não): tudo consistente. Questão clássica de estruturas lógicas (verdade/mentira)."},
{s:5,n:26,q:"Dois conceitos fundamentais avaliam o desempenho de qualquer operação. Eficiência e eficácia diferenciam-se porque:",a:["são conceitos idênticos","eficiência é o alcance de metas e eficácia é a economia de meios","eficácia ignora os resultados obtidos","eficiência é apenas financeira","a eficiência relaciona-se ao melhor uso dos recursos e a eficácia, ao alcance dos objetivos"],c:4,e:"Eficiência = meios (bom uso dos recursos); eficácia = fins (objetivo alcançado). Uma operação pode ser eficiente e ineficaz (bom processo, meta errada) — e vice-versa."},
{s:5,n:27,q:"O tempo de supervisão é um recurso escasso. O princípio da exceção, aplicado ao controle, orienta o gestor a:",a:["controlar tudo igualmente, todos os dias","dispensar o controle de processos estáveis","controlar apenas ao final do projeto","dispensar o registro das exceções","concentrar a atenção nos desvios relevantes em relação ao padrão"],c:4,e:"Controle por exceção: o esforço gerencial concentra-se nos desvios significativos — monitorar rotina estável em detalhe é desperdício do tempo de supervisão."},
{s:5,n:28,q:"O ACS passou a definir as metas de cobertura junto com a própria equipe e observou aumento no comprometimento com os prazos. O efeito descrito é resultado típico do:",a:["controle orçamentário","planejamento participativo","organograma funcional","planejamento centralizado","princípio da exceção"],c:1,e:"Planejamento participativo: quem executa conhece o terreno e adere mais às metas que ajudou a construir — comprometimento e realismo, benefícios centrais da participação."},
{s:5,n:29,q:"Além da linha hierárquica, as organizações contam com órgãos de apoio especializado. Sobre autoridade de linha e de assessoria (staff), é correto afirmar que:",a:["a linha assessora e o staff decide","são idênticas na prática","o staff comanda diretamente a linha","a linha não possui autoridade formal","a linha decide e executa na cadeia formal de comando, enquanto o staff assessora e recomenda"],c:4,e:"Linha: autoridade decisória na hierarquia (decide e executa); staff: apoio especializado que assessora e recomenda, sem comando direto sobre a linha."},
{s:5,n:30,q:"Para sustentar a motivação de equipes de campo, na ausência de bônus financeiros, o gestor deve apoiar-se, sobretudo em:",a:["ameaças de desligamento","pagamentos informais","trocas constantes de função","metas imprecisas","reconhecimento, senso de realização e bom clima de trabalho"],c:4,e:"Conforme Herzberg, reconhecimento, realização e responsabilidade são motivadores duradouros — dinheiro (higiênico) evita insatisfação, mas não gera engajamento sustentado."},
{s:5,n:31,q:"Cada estilo de liderança encontra condições em que rende mais. A liderança liberal (laissez-faire) é mais adequada quando:",a:["a equipe é nova e inexperiente","se quer eliminar as metas","se deseja substituir a autocracia em equipes novas","a equipe é madura e altamente qualificada","a organização proíbe qualquer direção"],c:3,e:"Equipes maduras e qualificadas rendem mais com autonomia; equipes novas exigem direção e estrutura — usar laissez-faire com novatos é abandono disfarçado de liderança."},
{s:5,n:32,q:"Conversas paralelas e redes de amizade atravessam qualquer equipe de trabalho. Sobre a comunicação informal nas organizações, é correto afirmar que:",a:["deve ser exterminada pela gestão","existe naturalmente e pode ser aproveitada com transparência e integração","substitui integralmente a comunicação formal","é sempre nociva ao clima","ocorre apenas entre chefes"],c:1,e:"A informalidade é inevitável (convivência humana) e pode complementar a formal — o erro é gerir por ela ou tentar extingui-la; o gestor prudente mantém transparência para que boatos não a dominem."},
{s:5,n:33,q:"Decidir é lidar com a escassez de tempo e de informação. Quanto ao uso da informação no processo decisório, é correto afirmar que:",a:["deve-se sempre esperar a informação total","informação tem custo e prazo nulos","decidir sem qualquer informação é o melhor caminho","o prazo é irrelevante na decisão","deve-se equilibrar o custo e o prazo de obter mais informação com o ganho de certeza que ela traz"],c:4,e:"Informação adicional reduz incerteza, mas tem custo e atrasa a decisão: o gestor decide quando o ganho marginal de certeza já não compensa — caso típico de decisões sob pressão na coleta."},
{s:5,n:34,q:"Tendências contemporâneas de gestão redistribuem decisão e autonomia. Empowerment (empoderamento) consiste em:",a:["apenas delegar tarefas operacionais","abandonar a equipe à própria sorte","transferir culpa pelos resultados","eliminar definitivamente a supervisão","conceder autonomia, informação e recursos para que as pessoas decidam e atuem com responsabilidade"],c:4,e:"Empowerment = autonomia + recursos + informação + responsabilização por resultados. Não é abdicação: mantêm-se expectativas claras e acompanhamento por indicadores."},
{s:5,n:35,q:"Erros de avaliação distorcem a percepção do desempenho da equipe. O erro de avaliação chamado 'tendência central' consiste em:",a:["atribuir notas medianas a todos, evitando extremos","dar nota máxima a todos","avaliar com rigor excessivo","comparar o avaliado com colegas","avaliar por pura intuição"],c:0,e:"O avaliador 'senta no meio': evita tanto elogiar quanto apontar problemas, por comodismo ou receio de conflito — distorcendo a avaliação e privando a equipe de feedback útil."},
{s:5,n:36,q:"Situação gerencial – Dois recenseadores reclamam que a escala de horários da equipe está injusta. O ACS deve:",a:["manter a escala sem qualquer explicação","punir quem reclamou","sortear os horários","deixar de fixar qualquer escala","rever os critérios com transparência e corrigir as distorções, comunicando as mudanças"],c:4,e:"Percepção de justiça exige critérios transparentes e correção de distorções, comunicada — manter sem explicar alimenta o conflito; sortear abre exceções; abolir escala é caos."},
{s:5,n:37,q:"Situação gerencial – A qualidade dos registros cai no fim do expediente, indicando fadiga. O ACS deve:",a:["exigir mais esforço da equipe","estender a jornada de trabalho","ignorar o padrão observado","cortar as pausas da equipe","reorganizar as pausas e programar as tarefas críticas nos horários de melhor desempenho"],c:4,e:"Organizar o trabalho respeitando limites humanos: pausas programadas e tarefas exigentes nos picos de desempenho — estender jornada ou cortar pausas piora exatamente o problema identificado."},
{s:5,n:38,q:"Situação gerencial – Um produtor pede para 'corrigir' dados já transmitidos. O ACS deve orientá-lo:",a:["a alterar os dados diretamente no DMC, de forma informal","que a alteração é garantida mediante pedido verbal","que não existe qualquer possibilidade de revisão","a enviar e-mail pessoal ao recenseador","a seguir o procedimento correto: a solicitação tramita pelos canais oficiais, com eventual reentrevista/correção conforme as regras do Censo"],c:4,e:"Correções pós-transmissão seguem canais oficiais e procedimentos (reentrevistas e verificações de qualidade) — alterações informais ferem a integridade dos dados e o sigilo estatístico."},
{s:5,n:39,q:"Situação gerencial – O ACS vive atrito com o ACI quanto à guarda dos equipamentos do posto, cada um invocando as próprias atribuições. Deve:",a:["confrontar o ACI publicamente","ignorar o impasse","determinar ao recenseador obedecer a ambos","desmoralizar o colega diante da equipe","dialogar, esclarecer as atribuições de cada função com base nas normas e, persistindo o impasse, escalonar ao AOR"],c:4,e:"Conflito de competência se resolve com esclarecimento de papéis pelas normas; só se o diálogo falhar é que se escala ao AOR — conflito público ou 'obedecer a dois' exporta o problema à equipe."},
{s:5,n:40,q:"Situação gerencial – Após chuvas intensas, o plano de coleta está desatualizado. O ACS deve:",a:["manter o plano original a qualquer custo","cancelar a operação da equipe","esconder o atraso da supervisão","improvisar individualmente, sem comunicar","revisar o plano (replanejamento), redistribuir setores e comunicar a equipe e a supervisão"],c:4,e:"Planejamento é cíclico: replanejamento documentado, redistribuição de cargas e comunicação às partes (equipe e supervisão) mantêm a operação viável e rastreável."},
{s:5,n:41,q:"Situação gerencial – Um recenseador pede demissão em plena coleta. O ACS deve, imediatamente:",a:["reorganizar a cobertura (redistribuição/plano de contingência) e acionar os procedimentos de reposição de pessoal","manter tudo igual até a contratação do substituto","cancelar a coleta do setor dele","forçar a permanência do recenseador","assumir sozinho o setor, sem comunicar ninguém"],c:0,e:"Plano de contingência: redistribuição imediata da cobertura e acionamento da reposição conforme os procedimentos do posto — deixar o setor descoberto 'até o substituto chegar' compromete cronograma e cobertura."},
{s:5,n:42,q:"Situação gerencial – Na sexta-feira, ao consolidar os números, o ACS constata que a meta semanal foi cumprida antes do prazo. O ACS deve:",a:["liberar a equipe por conta própria","reportar o fato e encerrar a semana","inventar metas impossíveis para ocupar a equipe","ocultar o adiantamento ao ACR","aproveitar a folga para avançar áreas críticas e revisões de qualidade, em alinhamento com o ACR"],c:4,e:"Gestão proativa: tempo ganho vira qualidade (revisões, reentrevistas) e antecipação de áreas críticas — sempre alinhada à supervisão; liberar por conta própria ou inventar metas é improviso indevido."},
{s:5,n:43,q:"Situação gerencial – Durante a coleta, o recenseador depara com um informante que não sabe ler. O recenseador deve ser orientado a:",a:["preencher o questionário por ele, sem qualquer explicação","dispensar a entrevista do informante","pedir a um vizinho que decida pelo informante","usar terceiros para pressionar o informante","ler os termos com clareza, garantir a compreensão e registrar as respostas com respeito, conforme os procedimentos"],c:4,e:"Acessibilidade e respeito: ler com clareza, confirmar a compreensão e registrar fielmente — a dignidade do informante e a qualidade da informação andam juntas. Dispensá-lo ou substituir-lhe a voz é inaceitável."},
{s:5,n:44,q:"Situação gerencial – Você, ACS, precisa dar feedback negativo a um recenseador. A prática correta é fazê-lo:",a:["em público, para servir de exemplo à equipe","por mensagem informal de aplicativo","adiá-lo indefinidamente","de forma genérica, sem citar fatos","em privado, de forma específica e factual, orientado à melhoria, com acordo e prazo de acompanhamento"],c:4,e:"Feedback corretivo eficaz: privado (preserva a dignidade), factual e específico (sem generalizações), orientado à melhoria, com plano e prazo de acompanhamento — público vira punição; genérico não ensina; adiá-lo deixa o problema crescer."},
{s:5,n:45,q:"Situação gerencial – Um produtor influente pressiona para que sua propriedade seja recenseada antes das outras. O ACS deve:",a:["manter a imparcialidade, explicar os critérios técnicos de roteirização e registrar a pressão sofrida","atender para agradar o produtor","punir o produtor pela pressão","atender mediante contrapartida","transferir o caso ao recenseador sem orientação"],c:0,e:"Imparcialidade protege a integridade da operação: critérios técnicos explicados, pressão registrada — favorecer (ou punir) por influência corrompe o processo e a confiança da equipe."},
{s:5,n:46,q:"De acordo com o material do Censo, para realizar a coleta de dados em terras indígenas, o Recenseador precisa, muitas vezes, estar acompanhado por um guia institucional e/ou guia-intérprete, cuja indicação é feita com apoio:",a:["do IBFC e da ONU","da prefeitura municipal e da Polícia Federal","do CNQ e do CEQ","da FUNAI e da Secretaria Especial de Saúde Indígena (SESAI)","das cooperativas agrícolas locais"],c:3,e:"A indicação é feita com apoio da FUNAI e da SESAI. Segundo o Censo Demográfico 2022, apenas 67,1% dos indígenas residentes em terras indígenas falam português no domicílio — daí a necessidade do guia-intérprete."},
{s:5,n:47,q:"A realização de pesquisas do IBGE em áreas de povos e comunidades tradicionais, assegurada pela Convenção nº 169 da OIT, implica que:",a:["a coleta nessas áreas dispensa qualquer consulta prévia","a consulta ocorre apenas após o encerramento da coleta","as condições de acesso e deslocamento são previamente negociadas com as lideranças comunitárias, associações e órgãos parceiros do IBGE","a negociação de acesso é feita diretamente com as prefeituras","os Recenseadores entrem nas áreas sem comunicação prévia"],c:3,e:"A Convenção nº 169 da OIT determina consulta obrigatória aos povos e comunidades tradicionais, mediante suas instituições representativas. No Censo, acesso e deslocamento nessas áreas são previamente negociados com lideranças, associações e órgãos parceiros do IBGE."},
{s:5,n:48,q:"Cada edição do Censo Agropecuário delimita com precisão o seu universo de pesquisa. No último Censo Agropecuário (2017), a unidade de investigação compreendeu:",a:["apenas unidades patronais","apenas a agricultura familiar","toda unidade de produção dedicada total ou parcialmente às atividades — mais de 5 milhões de estabelecimentos visitados","apenas unidades urbanas","apenas os produtores sem área"],c:2,e:"Em 2017, o questionário eletrônico foi preenchido para cada um dos mais de 5 milhões de estabelecimentos visitados — universo que o 12º Censo estima em cerca de 5,1 milhões."},
{s:5,n:49,q:"Na estrutura censitária, o responsável por gerir o posto censitário e garantir que as instruções operacionais, técnicas e administrativas sejam observadas é:",a:["o ACS","o ACR","o ACA","o AOR","o coordenador do CNQ"],c:3,e:"O AOR responde pela gestão do posto; o ACR coordena as atividades censitárias no âmbito do posto, o ACS supervisiona os Recenseadores, o ACA dá apoio administrativo e o ACI, de TI."},
{s:5,n:50,q:"A operação censitária conta com agentes de apoio com atribuições específicas. O Agente Censitário Administrativo (ACA) é responsável por:",a:["apoiar as atividades administrativas executadas pelo AOR","gerir o posto censitário","supervisionar a coleta dos recenseadores","coordenar o CEQ","acompanhar guias-intérpretes em terras indígenas"],c:0,e:"O ACA apoia as atividades administrativas do posto; o suporte de tecnologia da informação cabe ao ACI — ambos sob gestão do AOR."},
{s:5,n:51,q:"O funcionamento do posto depende de apoio técnico dedicado. O Agente Censitário de Informática (ACI) é responsável por:",a:["realizar a coleta especial","prestar apoio relativo às questões de tecnologia da informação ao AOR","treinar os produtores rurais","gerenciar o SIGC em âmbito nacional","dirigir a Superintendência Estadual"],c:1,e:"O ACI dá suporte de TI ao posto: instalação, manutenção e funcionamento de computadores, periféricos e dispositivos eletrônicos da operação."},
{s:5,n:52,q:"Além de acompanhar a coleta em sua região, o ACR acumula encargos definidos pela operação. Sobre o Agente Censitário Regional (ACR), o material indica, entre suas atribuições:",a:["coletar apenas em setores urbanos","responder pelo CNQ","substituir permanentemente o AOR","apenas treinar recenseadores","realizar a coleta especial e a coleta descentralizada, quando determinado"],c:4,e:"O ACR é responsável também pela realização da coleta especial e da coleta descentralizada, conforme designação — além de monitorar cobertura, cronograma, indicadores e gerir alertas do sistema."},
{s:5,n:53,q:"Cada setor recebe um código numérico único que o identifica nos mapas e nos sistemas da operação. O geocódigo do setor censitário reúne informações de:",a:["Unidade da Federação, município, distrito, subdistrito e número do setor","nome do produtor e CPF","área total e número de estabelecimentos","coordenadas geográficas do centro do setor","tipo de atividade agropecuária predominante"],c:0,e:"O geocódigo identifica unicamente o setor (ex.: 51 04104 05 00 0016), em ordem: UF, município, distrito, subdistrito e número do setor. Constam no título e rodapé dos mapas e no canto superior direito do descritivo."},
{s:5,n:54,q:"A 'situação' e o 'tipo' do setor censitário correspondem, respectivamente, à classificação:",a:["pelo tipo de produção agropecuária e pela forma jurídica da terra","pela renda média e pelo tipo especial de pré-abordagem","pelo número de produtores e pela acessibilidade do terreno","entre urbano e rural, segundo a forma de ocupação do espaço; e a categorias especiais, com restrições de acesso e/ou procedimentos diferenciados","pela densidade demográfica e pela situação fundiária"],c:3,e:"Situação = urbano/rural (forma de ocupação); tipo = categoria especial que, em geral, exige pré-abordagem específica com informante ou responsável (quartel, agrovila, agrupamentos etc.)."},
{s:5,n:55,q:"Sobre o componente 'localidade' no registro de endereços em áreas rurais, é correto afirmar que:",a:["corresponde ao CEP do estabelecimento","é o nome pelo qual é conhecido o local ou a região onde se situa o endereço (povoados, lugarejos, assentamentos, comunidades etc.)","deve ser substituído pelas coordenadas geográficas","equivale ao número do estabelecimento no logradouro","é vedado perguntá-lo à população local"],c:1,e:"Localidade é o nome do local/região (ex.: 'Serra das Flores', 'Assentamento Chico Mendes'); nas áreas urbanas assemelha-se ao bairro. Recomenda-se perguntar à população local e evitar expressões genéricas que não identifiquem a localidade."},
{s:5,n:56,q:"Nem todos os produtores investigados pelo Censo exploram uma área de terra própria. São exemplos de produtores sem área:",a:["o produtor de mel que instala colmeias em matas ou em áreas de outros estabelecimentos, e o extrativista que coleta produtos de matas, como babaçu e castanha-do-brasil","o produtor que cultiva apenas em terras próprias registradas em cartório","o produtor que arrenda terras e nelas permanece na data de referência","a indústria que mantém criação de gado próprio","o sítio de lazer com horta para deleite da família"],c:0,e:"Produtor sem área utiliza recursos naturais ou áreas de terceiros temporariamente: colmeias em matas alheias, extrativismo (babaçu, castanha, látex, lenha), criação em beira de estrada, vazantes e roças itinerantes — e quem já não ocupava as terras na data de referência. Nesses casos, registra-se a atividade e aplica-se o questionário."},
{s:5,n:57,q:"Sobre os setores censitários do tipo Agrupamento Indígena e Agrupamento Quilombola, é correto afirmar que são compostos:",a:["por 50 ou mais indivíduos, em ambos os casos","por 15 ou mais indivíduos (autodeclarados quilombolas, neste caso), residentes em uma ou mais moradias contíguas, por vínculos familiares ou comunitários","por qualquer aldeia ou comunidade, independentemente do número de moradores","por 15 ou mais famílias cadastradas no CadÚnico","por indivíduos cujo pertencimento étnico é verificado pelo Recenseador"],c:1,e:"Ambos: 15 ou mais indivíduos residentes em moradias contíguas, por vínculos familiares/comunitários (quilombolas: autodeclarados). O pertencimento étnico é autodeclaratório, registrado conforme a fala do informante, sem questionamentos. (Agrovila, diversamente: mais de 50 domicílios em Projetos de Assentamento.)"},
{s:5,n:58,q:"Na interpretação de imagens de satélite, o material orienta o Recenseador a observar forma, tamanho, localização e cores dos elementos representados. Como exemplo de identificação pela FORMA, o material indica que:",a:["rios aparecem nas imagens como círculos","galpões possuem dimensões menores que as casas","rotatórias são observadas como círculos nas imagens","estradas não aparecem em imagens de satélite","telhados são identificados por tons de verde"],c:2,e:"Forma: rotatórias aparecem como círculos. Tamanho: grandes construções e galpões são maiores que casas ou árvores. Localização: estradas podem acompanhar rios ou ligar propriedades. Cores: pastagens em tons de verde; telhados em vermelho, laranja, cinza ou branco."},
{s:5,n:59,q:"Os setores de tipos especiais (quartel, alojamento, agrovila, unidade prisional etc.) só serão visitados no Censo Agropecuário se:",a:["tiverem mais de 50 habitantes","tiverem produção agropecuária, florestal ou aquícola","estiverem localizados em áreas urbanas","forem indicados pelo CEQ","tiverem sido visitados em 2017"],c:1,e:"Regra expressa: esses tipos só serão visitados no Censo Agro se tiverem produção agropecuária, florestal ou aquícola — os limites de habitantes (50) definem o tipo de setor, não a condição de visita do Censo Agro."},
{s:5,n:60,q:"Para orientar a abordagem de povos e comunidades tradicionais, a operação utiliza recortes territoriais próprios. Sobre as Áreas de Interesse Operacional (AIOs), é correto afirmar que:",a:["seguem exatamente os limites dos setores censitários","têm sempre o tamanho de um setor","existem apenas dentro de terras indígenas","são definidas pela FUNAI","não seguem a setorização do IBGE: podem ser menores ou maiores que um setor, cobrindo até um município inteiro"],c:4,e:"AIOs são recortes independentes da setorização que indicam presença efetiva ou potencial de PCTs. Setor pertencente total ou parcialmente a uma AIO: a área é carregada automaticamente no mapa digital e as perguntas específicas aparecem no DMC."}
,
{s:6,n:1,t:6,q:"A compreensão do narrador — 'Só décadas depois entendi o que ele guardava ali' — revela que o caderno:",a:["era apenas um registro contábil das vendas de café da fazenda","guardava muito mais que contas: um registro metódico do tempo da terra, capaz de revelar o que a memória sozinha não alcança","servia para provar aos vizinhos que o avô sabia ler e escrever","era um passatempo usado para suportar as noites sem rádio","registrava apenas os anos ruins, para que a família se preparasse"],c:1,e:"O narrador descobre tarde o sentido do gesto do avô: os números, somados ao longo dos anos, formam uma memória verificável que revela padrões — a 'conversa' entre anos bons e ruins — invisíveis à lembrança isolada."},
{s:6,n:2,t:6,q:"A descrição do caderno inclui a qualidade material da escrita do avô. No texto, 'tosca' (a letra era tosca) significa:",a:["diminuta","elegante e caprichada","apressada","rústica, sem acabamento refinado","completamente ilegível"],c:3,e:"'Tosca' = grosseira, rústica, sem polimento — coerente com os números 'desengonçados' e os acentos que faltavam; não chega a tornar a escrita ilegível, pois os registros cumpriam sua função."},
{s:6,n:3,t:6,q:"As falas dos vizinhos pontuam a narrativa com ironia. No texto, a fala dos vizinhos ('Livro de conta é coisa de agiota') funciona como:",a:["contraponto que, pelo contraste, realça a constância e o propósito do avô","conselho prático que o avô acabou seguindo","prova de que o caderno causava prejuízos à fazenda","indício de que os vizinhos também mantinham cadastros semelhantes","explicação das práticas contábeis então usuais na região"],c:0,e:"A zombaria dos vizinhos cria oposição que valoriza o protagonista: diante do deboche, o avô 'não respondia' e seguia anotando — a constância destaca-se justamente pelo contraste."},
{s:6,n:4,q:"Assinale a alternativa que completa corretamente as frases: 'Quando ele ______ o mapa, seguiremos para o setor' e 'Se você ______ dúvidas, consulte o manual.'",a:["trazer ... ter","trouxesse ... tivesse","trouxer ... tiver","trará ... terá","traria ... teria"],c:2,e:"'Quando' com sentido futuro pede futuro do subjuntivo (trouxer), correlacionado ao futuro do indicativo (seguiremos); 'se' condicional com sentido futuro também o exige (tiver), seguido de imperativo (consulte)."},
{s:6,n:5,q:"Passando a frase 'A lista de endereços foi atualizada pelo recenseador' para a voz passiva sintética, obtém-se:",a:["Atualizou-se a lista de endereços.","O recenseador atualizou a lista de endereços.","A lista de endereços era atualizada.","Atualizaram-se a lista de endereços pelo recenseador.","Atualizou-se a lista de endereços pelo recenseador."],c:0,e:"Na passiva sintética (ou pronominal), o verbo com a partícula apassivadora 'se' concorda com o sujeito paciente ('a lista'): 'Atualizou-se a lista'. Essa construção não admite o complemento agente ('pelo recenseador')."},
{s:6,n:6,q:"O ACS precisa comunicar por escrito ao ACR que a coleta de um setor será interrompida por chuvas. A redação mais adequada ao padrão formal é:",a:["'A coleta parou por causa da chuva; depois a gente vê como fica.'","'É um absurdo que chova tanto nesta época do ano! Interromperei a coleta do setor.'","'Coleta do setor interrompida. Chuva.'","'Comunico que, em razão das chuvas, a coleta do setor será interrompida, sendo retomada assim que as condições de acesso permitirem.'","'qdo parar de chover retomo a coleta, depois vcs ficam sabendo'"],c:3,e:"Comunicado formal exige clareza, objetividade, impessoalidade e cortesia: informa o fato, a causa e a condição de retomada — sem gíria, abreviação, laconia excessiva nem carga emocional."},
{s:6,n:7,q:"Assinale a alternativa que preenche corretamente a frase, expressando adição de informações: 'O treinamento abrangeu ______ os procedimentos de campo ______ as normas de sigilo.'",a:["ou ... ou","não apenas ... mas também","embora ... no entanto","caso ... logo","já que ... portanto"],c:1,e:"A correlação 'não apenas ... mas também' soma informações (adição). 'Ou...ou' alterna; 'embora' é concessivo; 'caso' é condicional; 'já que' é causal — nenhum expressa adição."},
{s:6,n:8,q:"As palavras podem ser empregadas em sentido literal ou figurado, conforme o contexto. Assinale a alternativa em que a palavra destacada está empregada em sentido conotativo:",a:["terra — 'A chuva danificou a estrada de terra.'","preta — 'O gato preto dormia na varanda do posto.'","pedra — 'O informante tem um coração de pedra.'","concreto — 'O recenseador atravessou a ponte de concreto.'","ferro — 'A cerca de ferro foi reparada antes da coleta.'"],c:2,e:"Sentido conotativo é o figurado, sustentado por associação simbólica: 'coração de pedra' significa insensibilidade, não um órgão literalmente mineral. Nas demais, as palavras conservam o sentido literal, denotativo."},
{s:6,n:9,q:"Compare as frases: I. 'Os recenseadores que concluíram a rota retornaram ao posto.' II. 'Os recenseadores, que concluíram a rota, retornaram ao posto.' É correto afirmar que:",a:["as duas frases transmitem exatamente o mesmo sentido","a frase II indica que apenas alguns recenseadores concluíram a rota","a frase I indica que todos os recenseadores concluíram a rota","na frase II, a vírgula isola um vocativo","a frase I restringe o retorno aos que concluíram a rota; na frase II, a oração intercalada apenas acrescenta uma explicação sobre todos"],c:4,e:"Sem vírgulas, a oração adjetiva é restritiva: só os que concluíram a rota retornaram. Com vírgulas, torna-se explicativa: pressupõe-se que todos concluíram, e a oração apenas comenta esse fato."},
{s:6,n:10,q:"Cada acento gráfico obedece a uma regra precisa. Assinale a alternativa em que a regra de acentuação gráfica está CORRETAMENTE indicada:",a:["público — proparoxítona","saúde — paroxítona terminada em ditongo crescente","domicílio — oxítona terminada em ditongo","você — monossílabo tônico terminado em vogal","através — paroxítona terminada em -s"],c:0,e:"'Público' é proparoxítona (sílaba tônica na antepenúltima), todas acentuadas. 'Saúde' tem o 'u' tônico em hiato; 'domicílio' também é proparoxítona; 'você' é oxítona terminada em vogal; 'através' é oxítona terminada em -s."},
{s:6,n:11,q:"A ortografia oficial registra grafias que frequentemente geram dúvida, mesmo entre usuários cultos da língua. Assinale a alternativa em que TODAS as palavras estão escritas de acordo com a ortografia oficial:",a:["previlégio, excessão, análise","privilégio, exceção, caderneta","impecilho, beneficência, mendigo","análize, privilégio, exceção","excessão, mendigo, beneficência"],c:1,e:"Grafam-se 'privilégio', 'exceção' (do latim exceptio) e 'caderneta' (diminutivo de caderno). São erros clássicos: 'previlégio', 'excessão', 'análize' e 'impecilho' — a forma correta é 'empecilho'."},
{s:6,n:12,q:"Em 'Estamos certos de que o setor será concluído hoje', a palavra 'de' classifica-se como:",a:["conjunção subordinativa integrante","pronome relativo","advérbio","preposição exigida pelo adjetivo 'certos'","partícula expletiva"],c:3,e:"A regência de 'certo de alguma coisa' exige a preposição 'de', que liga o adjetivo à oração subordinada substantiva completiva introduzida pela conjunção 'que'."},
{s:6,n:13,q:"O pronome relativo 'cujo' segue regras próprias de emprego. Assinale a frase em que o emprego de 'cujo' está de acordo com a norma-padrão:",a:["O produtor cuja fazenda fica além do rio aguardará o recenseador.","O produtor cujo o filho atendeu o recenseador estava ausente.","A fazenda cujo eu falei é grande.","O manual cujo as páginas estão rasgadas foi trocado.","O informante cujos os dados foram declarados aguarda o resultado."],c:0,e:"'Cujo' exprime posse, concorda com a coisa possuída e não admite artigo logo depois de si — daí os erros 'cujo o filho', 'cujo as páginas' e 'cujos os dados'. Quando o verbo exige preposição, emprega-se 'de que' ('A fazenda de que eu falei')."},
{s:6,n:14,q:"Na frase 'Dona Marta, produtora da região vizinha, recebeu o recenseador com café fresco', o termo 'produtora da região vizinha' exerce a função sintática de:",a:["vocativo","adjunto adnominal","aposto","complemento nominal","predicativo do sujeito"],c:2,e:"O termo isola-se por vírgulas e explica, resume ou especifica outro termo da oração — o núcleo do sujeito 'Dona Marta': é um aposto explicativo. Vocativo chama o interlocutor; adjunto adnominal e complemento nominal se ligam por adjacência, sem vírgulas."},
{s:6,n:15,q:"Assinale a alternativa que reproduz com fidelidade o sentido da frase: 'Os dados só são divulgados depois de esgotadas todas as conferências.'",a:["Os dados são divulgados antes de as conferências terminarem.","Algumas conferências bastam para que os dados sejam divulgados.","Os dados são divulgados durante as conferências.","As conferências só terminam depois da divulgação dos dados.","Somente após a finalização de todas as conferências é que os dados são divulgados."],c:4,e:"'Só ... depois de esgotadas todas' = 'somente após a finalização de todas': a restrição vale para o tempo da divulgação, que ocorre no fim absoluto do processo de conferência — sem antecipação parcial."},
{s:6,n:16,q:"O preço de um insumo agrícola sofreu aumento de 25%. Para que ele volte ao valor anterior, o desconto necessário sobre o novo preço deve ser de:",a:["25%","15%","20%","75%","12,5%"],c:2,e:"Se o preço virou 1,25 do original, basta multiplicar por 0,80 para voltar a 1: 1,25 × 0,80 = 1. Logo, o desconto é de 20% — e não 25%, pois a base de cálculo mudou (o desconto incide sobre o valor majorado)."},
{s:6,n:17,q:"Uma aplicação de R$ 8.000,00 rende juros simples de 1,5% ao mês. Após 5 meses, o montante será de:",a:["R$ 8.600,00","R$ 8.060,00","R$ 8.120,00","R$ 9.200,00","R$ 8.450,00"],c:0,e:"J = 8.000 × 0,015 × 5 = 600. Montante = 8.000 + 600 = R$ 8.600,00. Nos juros simples, a base de incidência permanece o capital inicial, mês a mês."},
{s:6,n:18,q:"Considere a sequência formada pelos resultados acumulados de uma rotina de conferência: 1, 2, 6, 24, 120, ... Assinale o próximo termo da sequência:",a:["240","600","480","840","720"],c:4,e:"Cada termo é o anterior multiplicado pelos naturais sucessores: 1×2=2, 2×3=6, 6×4=24, 24×5=120. Logo, 120×6=720 (fatoriais)."},
{s:6,n:19,q:"Considere a proposição: 'Se o questionário foi validado, então ele foi transmitido no mesmo dia.' Sabe-se que o questionário NÃO foi transmitido no mesmo dia. Conclui-se validamente que o questionário:",a:["foi validado","foi validado e transmitido em outro dia","deveria ter sido validado","não foi validado","foi transmitido sem validação"],c:3,e:"É um modus tollens: negada a consequência (não foi transmitido no mesmo dia), nega-se necessariamente o antecedente — o questionário não foi validado. As demais opções trocam ou contradizem as premissas."},
{s:6,n:20,q:"Uma urna contém 3 bolas verdes e 7 amarelas. Retira-se uma bola, anota-se a cor e ela é devolvida à urna; repete-se o procedimento. A probabilidade de se obter exatamente uma bola verde nas duas retiradas é:",a:["0,21","0,42","0,49","0,09","0,50"],c:1,e:"Com reposição, os eventos são independentes: P(verde e amarela) = 0,3 × 0,7 = 0,21; P(amarela e verde) = 0,7 × 0,3 = 0,21. A soma dá 0,42. (0,49 seria 'duas amarelas'; 0,09, 'duas verdes'.)"},
{s:6,n:21,q:"Quantos códigos de três algarismos DISTINTOS podem ser formados utilizando-se apenas os algarismos 1, 2, 3, 4 e 5?",a:["125","120","60","20","35"],c:2,e:"São arranjos sem repetição: 5 opções para a 1ª posição, 4 para a 2ª e 3 para a 3ª — 5 × 4 × 3 = 60. (125 = 5³ pressupõe repetição; 120 = permutação de todos os cinco.)"},
{s:6,n:22,q:"Um terreno retangular tem perímetro de 240 m, e seu comprimento é o dobro da largura. A área desse terreno, em metros quadrados, é:",a:["3.200","6.400","2.400","3.600","4.800"],c:0,e:"2(c + l) = 240 → c + l = 120; com c = 2l, tem-se 3l = 120, l = 40 e c = 80. Área = 40 × 80 = 3.200 m²."},
{s:6,n:23,q:"Considere as premissas: 'Todo produtor recenseado recebe o folheto explicativo' e 'Alguns produtores recenseados são parceiros do posto'. Conclui-se validamente que:",a:["todo parceiro do posto recebe o folheto explicativo","nenhum parceiro do posto recebe o folheto explicativo","alguns produtores não são recenseados","todos os que recebem o folheto são parceiros do posto","alguns parceiros do posto recebem o folheto explicativo"],c:4,e:"Se ao menos um produtor recenseado é parceiro, e todos os recenseados recebem o folheto, esse parceiro o recebe — logo, alguns parceiros o recebem. Generalizar para 'todos' ou negar a distribuição extrapola as premissas."},
{s:6,n:24,q:"Em dois dias de coleta, uma equipe transmitiu 240 questionários, tendo transmitido, no segundo dia, o triplo do primeiro. O número de questionários transmitidos no primeiro dia foi:",a:["80","60","120","40","180"],c:1,e:"x + 3x = 240 → 4x = 240 → x = 60. No primeiro dia, 60; no segundo, 180."},
{s:6,n:25,q:"Em um posto censitário, três agentes — Heitor, Iris e Jairo — respondem, cada um, por uma função diferente: um é ACA, outro é ACI e outro é ACR. Sabe-se que Heitor não atua no apoio relativo às questões de tecnologia da informação e que Iris supervisiona a cobertura territorial da operação. Heitor, Iris e Jairo são, respectivamente:",a:["ACI, ACA e ACR","ACR, ACA e ACI","ACA, ACI e ACR","ACA, ACR e ACI","ACI, ACR e ACA"],c:3,e:"Supervisionar a cobertura territorial é atribuição do ACR — logo Iris é ACR. Heitor não é ACI (apoio de TI) nem ACR (já ocupado por Iris): é ACA. Jairo, por exclusão, é ACI."},
{s:6,n:26,q:"Segundo a teoria das necessidades aprendidas de McClelland, o recenseador que busca superar metas próprias, prefere tarefas desafiadoras e deseja retorno imediato sobre seu desempenho manifesta, de modo preponderante, a necessidade de:",a:["afiliação","poder","segurança","realização","autonomia"],c:3,e:"McClelland descreve três necessidades aprendidas: realização (metas desafiadoras e feedback), afiliação (relações harmoniosas e aceitação) e poder (influência sobre pessoas e resultados). O quadro descrito é típico da necessidade de realização."},
{s:6,n:27,q:"Na integração, um recenseador recém-contratado não compreendeu a instrução 'Sincronize o DMC, confira o geocódigo no descritivo e siga para o polo base', por não conhecer os termos técnicos empregados. A falha de comunicação ilustra, sobretudo, uma barreira:",a:["física","semântica","psicológica","organizacional","fisiológica"],c:1,e:"Barreira semântica diz respeito ao significado: jargões, siglas e vocabulário técnico só comunicam se o receptor os domina. O emissor deve adaptar a linguagem ao público — no caso, explicitar os termos na integração do novato."},
{s:6,n:28,q:"Para consolidar um comportamento desejado — como a transmissão diária e pontual dos dados — a prática mais eficaz, segundo a abordagem do condicionamento operante, é:",a:["reconhecer e elogiar o comportamento logo após ele ocorrer, reforçando-o positivamente","punir levemente os atrasos, para criar o hábito","ignorar o comportamento até que se torne espontâneo","prometer uma recompensa vaga e distante","cobrar o comportamento apenas no encerramento da coleta"],c:0,e:"O reforço positivo — reconhecimento imediato, contingente ao comportamento — aumenta a probabilidade de ele se repetir. Punição gera efeitos colaterais; reforço distante ou indefinido perde a contingência que sustenta a aprendizagem."},
{s:6,n:29,q:"A visão contemporânea revisou o papel do conflito nas organizações. Nas organizações, o chamado conflito funcional caracteriza-se por:",a:["dever ser evitado a qualquer custo, pois toda divergência é destrutiva","constituir sempre indício de falha na gestão da equipe","expor divergências e testar pressupostos, podendo melhorar a qualidade das decisões quando bem administrado","ocorrer apenas na estrutura informal dos grupos","dever ser resolvido pelo gestor sozinho, sem envolver a equipe"],c:2,e:"A visão contemporânea distingue o conflito funcional (construtivo: revela problemas, testa pressupostos e melhora decisões) do disfuncional (desgastante). Cabe ao gestor administrá-lo — não eliminá-lo por princípio nem sufocá-lo decidindo sozinho."},
{s:6,n:30,q:"Valores compartilhados, rituais, símbolos e formas típicas de enfrentar problemas, aprendidos e transmitidos aos novos membros, compõem, em uma organização:",a:["a estrutura formal","o organograma","o clima organizacional, por definição estável","a departamentalização","a cultura organizacional"],c:4,e:"Cultura organizacional é o conjunto profundo e relativamente estável de valores, crenças, rituais e símbolos que orienta o comportamento. Clima é o estado emocional transitório; estrutura, organograma e departamentalização pertencem ao desenho formal."},
{s:6,n:31,q:"Reuniões de equipe são o cenário habitual das decisões coletivas. A principal vantagem das decisões tomadas em grupo, quando bem conduzidas, é:",a:["a rapidez, pois grupos decidem mais velozmente que indivíduos","a eliminação total do risco de erro","a dispensa de um responsável final pela decisão","o maior comprometimento com a implementação, fruto da participação, somado à diversidade de perspectivas","a garantia de unanimidade automática"],c:3,e:"Quem participa da formulação compromete-se com a execução; além disso, o grupo agrega conhecimentos e pontos de vista. Em contrapartida, decisões em grupo tendem a ser mais lentas e seguem exigindo um responsável — e a unanimidade nunca é automática."},
{s:6,n:32,q:"Um dos marcos do movimento da qualidade foi a criação de grupos voltados à melhoria contínua. Os Círculos de Controle de Qualidade caracterizam-se por:",a:["grupos pequenos de trabalhadores da própria área que se reúnem periodicamente para identificar e propor soluções para problemas do seu trabalho","equipes de auditores externos contratadas para fiscalizar a qualidade","reuniões da alta direção para comunicar metas de produtividade","programas de bônus individual por desempenho","treinamentos formais ministrados por consultoria externa"],c:0,e:"Nos CCQ, os próprios executores analisam e propõem melhorias contínuas para o seu processo — qualidade delegada a quem faz, e não auditada de fora. Daí o ganho em envolvimento e em conhecimento do processo real."},
{s:6,n:33,q:"Diversas abordagens surgiram para aproximar objetivos organizacionais e desempenho individual. A Administração por Objetivos (APO) caracteriza-se, essencialmente, por:",a:["definir objetivos gerais e imutáveis, exclusivamente pela cúpula","estabelecer objetivos específicos e mensuráveis acordados entre gestor e subordinados, com acompanhamento e avaliação periódicos contra as metas","avaliar pessoas apenas por traços de personalidade","substituir objetivos por improvisação criativa","restringir as metas ao controle de custos"],c:1,e:"Na APO, gestor e subordinado acordam objetivos claros, mensuráveis e desafiantes, e o desempenho é avaliado por resultados frente a essas metas — com autocontrole e revisões periódicas, em cascata pelos níveis da organização."},
{s:6,n:34,q:"Em dinâmica de grupo, os papéis de MANUTENÇÃO (ou socioemocionais) distinguem-se dos papéis de TAREFA porque visam a:",a:["propor e coordenar ideias voltadas ao cumprimento do trabalho","dominar as discussões para acelerar as decisões","preservar a coesão, o clima e as relações interpessoais que sustentam o funcionamento do grupo","registrar formalmente as atas e os encaminhamentos","representar o grupo perante a chefia"],c:2,e:"Papéis de tarefa fazem o trabalho avançar (propor, buscar informação, coordenar); papéis de manutenção cuidam do grupo em si — harmonizar, mediar, encorajar a participação — sem os quais a equipe se desgasta e se desfaz."},
{s:6,n:35,q:"A distribuição do poder de decisão estrutura o desenho organizacional. A descentralização das decisões, em uma organização, tende a:",a:["reduzir a necessidade de comunicação interna","eliminar a responsabilidade final da chefia pelas decisões","aumentar o tempo de resposta aos problemas locais","dispensar o planejamento central","agilizar as respostas locais e desenvolver capacidades gerenciais nos níveis inferiores, desde que preservadas diretrizes e padrões claros"],c:4,e:"Aproximar a decisão do problema agiliza a resposta e forma gestores. Em contrapartida, exige diretrizes, padrões e comunicação fortes — e a responsabilidade final da chefia permanece, assim como o planejamento central de rumo."},
{s:6,n:36,q:"Situação gerencial – Dois recenseadores solicitam folga para a mesma data, e a cobertura dos setores não permite liberar ambos. O ACS deve:",a:["negar as duas solicitações, para evitar qualquer atrito","deixar que os dois resolvam a divergência entre si","conceder ao que tiver mais tempo de casa, ainda que esse critério nunca tenha sido anunciado","aplicar critérios objetivos previamente divulgados — como a ordem de solicitação e a necessidade do serviço — e comunicar a decisão com antecedência","sortear publicamente a folga diante da equipe"],c:3,e:"Decisões que afetam pessoas pedem critérios explícitos e isonômicos, conhecidos antes: decisão + comunicação antecipada preservam a percepção de justiça. Deixar a escolha com a equipe, sortear ou usar regra surpresa corroem a autoridade e o clima."},
{s:6,n:37,q:"Situação gerencial – Você acabou de assumir a supervisão de uma equipe habituada a um gestor extremamente permissivo, e os prazos vêm sendo descumpridos. A postura mais adequada é:",a:["reunir a equipe, explicitar os padrões exigidos e as razões deles, definir responsabilidades com prazos claros e cobrar de modo consistente e gradual","manter a tolerância anterior até conquistar a confiança da equipe","punir exemplarmente o primeiro descumprimento de prazo","cobrar exclusivamente por comunicados escritos, sem diálogo direto","delegar a disciplina da equipe ao ACR"],c:0,e:"Nova liderança precisa estabelecer limites com transparência: regras explicadas, responsabilidades e prazos definidos e cobrança consistente. Rigor imediato punitivo assusta e ressentimentos minam a adesão; a omissão, por sua vez, consolida o atraso."},
{s:6,n:38,q:"Situação gerencial – Ao iniciar uma entrevista, o recenseador percebe que o informante é seu tio, sócio de um dos estabelecimentos do setor. Ele deve:",a:["conduzir a entrevista normalmente, pois o parentesco não afeta dados objetivos","comunicar de imediato o fato ao supervisor e seguir a orientação recebida quanto à substituição ou ao procedimento aplicável","omitir o parentesco para não complicar a escala de trabalho","preencher ele mesmo o questionário com o que sabe sobre o estabelecimento","pedir ao informante que procure um posto censitário de outro município"],c:1,e:"Vínculo pessoal com o informante caracteriza conflito de interesse que compromete a isenção percebida da coleta. A conduta é transparentá-lo ao supervisor e seguir o procedimento — jamais omiti-lo, contorná-lo por conta própria ou transferir o ônus ao informante."},
{s:6,n:39,q:"Situação gerencial – A equipe bateu o recorde de setores concluídos, mas a taxa de erros de preenchimento superou o limite tolerado; os elogios recentes valorizaram apenas a velocidade. O ACS deve:",a:["manter o ritmo atual e corrigir os erros no posto, um a um, ao final do dia","suspender os elogios até o encerramento da coleta","recalibrar os critérios de reconhecimento para contemplar qualidade e produtividade, definir o padrão esperado e reforçar o que for bem-feito","devolver todos os questionários com erro aos próprios autores, para refazimento imediato","reduzir a meta de setores de toda a equipe"],c:2,e:"O que é medido e reconhecido é o que a equipe prioriza: o desalinhamento entre elogio e padrão gerou o problema, e é nele que se intervém. Corrigir no posto trata o sintoma; punir a todos ou refazer tudo em bloco desmoraliza — o caminho é redefinir o padrão e reforçar positivamente o que estiver correto."},
{s:6,n:40,q:"Situação gerencial – Nas reuniões semanais, dois recenseadores experientes dominam as discussões e os mais reservados quase não opinam. O ACS deve:",a:["limitar a palavra aos dois experientes, que conhecem melhor a operação","cancelar as reuniões e comunicar-se apenas por escrito","reduzir a reunião à leitura das metas, sem espaço para comentários","deixar que o grupo se auto-organize a cada encontro","estruturar a pauta com antecedência, garantir espaço para cada participante e dirigir perguntas específicas aos mais silenciosos, registrando os encaminhamentos"],c:4,e:"Reunião produtiva é conduzida: pauta prévia, participação deliberadamente ampliada — inclusive dirigindo perguntas aos calados — e encaminhamentos registrados. A condução livre tende a reproduzir o domínio dos mais falantes; eliminá-la descarta justamente o conhecimento de quem cala."},
{s:6,n:41,q:"Situação gerencial – No mesmo prazo, o ACR solicita um relatório de cobertura e o posto pede apoio no recebimento de materiais; você não conseguirá executar as duas tarefas com qualidade. A conduta mais adequada é:",a:["explicitar o conflito às partes envolvidas, negociar prazos ou redistribuir recursos com base na prioridade do serviço e comunicar claramente a decisão assumida","executar as duas tarefas às pressas, mesmo com perda de qualidade","escolher silenciosamente uma e deixar a outra atrasar sem avisar","delegar o relatório a um recenseador, sem lhe repassar o contexto necessário","aguardar nova ordem antes de iniciar qualquer das tarefas"],c:0,e:"Sobrecarga conflitante resolve-se com transparência e negociação: expor o conflito, priorizar pelo objetivo do serviço e comunicar a decisão. Fazer tudo mal, escolher em silêncio ou repassar sem contexto transferem o problema; aguardar novas ordens é omissão."},
