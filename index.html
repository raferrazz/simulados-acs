<style>
/* ============ TOKENS M3 EXPRESSIVE ============ */
:root{
  --primary:#6750A4;--on-primary:#FFFFFF;--primary-container:#EADDFF;--on-primary-container:#21005D;
  --secondary-container:#E8DEF8;--on-secondary-container:#1D192B;
  --tertiary-container:#FFD8E4;--on-tertiary-container:#31111D;
  --info-container:#D8E2FF;--on-info-container:#10184F;
  --error:#B3261E;--on-error:#fff;--error-container:#F9DEDC;--on-error-container:#410E0B;
  --ok:#146C2E;--on-ok:#fff;--ok-container:#C4EED0;--on-ok-container:#072711;
  --bg:#FEF7FF;--surface-c:#F3EDF7;--surface-ch:#ECE6F0;--surface-chh:#E6E0E9;
  --on-surface:#1D1B20;--on-surface-var:#49454F;--outline:#79747E;--outline-var:#CAC4D0;
  --inv:#322F35;--on-inv:#F5EFF7;
  --shadow:0 6px 24px rgba(0,0,0,.08);--shadow-lg:0 12px 40px rgba(0,0,0,.14);
  --radius:28px;
  --ease-std:cubic-bezier(.2,0,0,1);
  --ease-spring:cubic-bezier(.34,1.45,.5,1);
  --ease-emph:cubic-bezier(.2,0,0,1);
  --nav-h:80px;
}
[data-theme="dark"]{
  --primary:#D0BCFF;--on-primary:#381E72;--primary-container:#4F378B;--on-primary-container:#EADDFF;
  --secondary-container:#4A4458;--on-secondary-container:#E8DEF8;
  --tertiary-container:#633B48;--on-tertiary-container:#FFD8E4;
  --info-container:#2B3C6B;--on-info-container:#D8E2FF;
  --error:#F2B8B5;--on-error:#601410;--error-container:#8C1D18;--on-error-container:#F9DEDC;
  --ok:#7FD98F;--on-ok:#0A3818;--ok-container:#0F5223;--on-ok-container:#C4EED0;
  --bg:#141218;--surface-c:#211F26;--surface-ch:#2B2930;--surface-chh:#36343B;
  --on-surface:#E6E0E9;--on-surface-var:#E7E4EE;--outline:#938F99;--outline-var:#49454F;
  --inv:#E6E0E9;--on-inv:#1D1B20;
  --shadow:0 6px 24px rgba(0,0,0,.4);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
}
/* Paletas dinâmicas — só a família primária muda */
[data-pal="azul"]{--primary:#0B57D0;--on-primary:#fff;--primary-container:#D3E3FD;--on-primary-container:#041E49;--secondary-container:#D8E2FF;--on-secondary-container:#10184F}
[data-theme="dark"][data-pal="azul"]{--primary:#A8C7FA;--on-primary:#062E6F;--primary-container:#0842A0;--on-primary-container:#D3E3FD;--secondary-container:#2B3C6B;--on-secondary-container:#D8E2FF}
[data-pal="verde"]{--primary:#146C2E;--on-primary:#fff;--primary-container:#C4EED0;--on-primary-container:#072711;--secondary-container:#C5EED0;--on-secondary-container:#052711}
[data-theme="dark"][data-pal="verde"]{--primary:#7FD98F;--on-primary:#0A3818;--primary-container:#0F5223;--on-primary-container:#C4EED0;--secondary-container:#1E4D2B;--on-secondary-container:#C4EED0}
[data-pal="laranja"]{--primary:#8F4C00;--on-primary:#fff;--primary-container:#FFDCC2;--on-primary-container:#2E1500;--secondary-container:#FFE0C7;--on-secondary-container:#2E1500}
[data-theme="dark"][data-pal="laranja"]{--primary:#FFB870;--on-primary:#4A2800;--primary-container:#6A3B00;--on-primary-container:#FFDCC2;--secondary-container:#5C3900;--on-secondary-container:#FFE0C7}
[data-pal="rosa"]{--primary:#9C4146;--on-primary:#fff;--primary-container:#FFDAD9;--on-primary-container:#40000A;--secondary-container:#FFD9E2;--on-secondary-container:#3E001D}
[data-theme="dark"][data-pal="rosa"]{--primary:#FFB3B5;--on-primary:#5F1319;--primary-container:#822B30;--on-primary-container:#FFDAD9;--secondary-container:#7A2C45;--on-secondary-container:#FFD9E2}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html.fz-sm{font-size:14.5px}
html.fz-lg{font-size:18.5px}
body{font-family:'Roboto',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--on-surface);min-height:100vh;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:inherit}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:8px}
::selection{background:var(--primary-container);color:var(--on-primary-container)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============ SHELL DO APP ============ */
#app{display:flex;min-height:100vh}
#rail{position:sticky;top:0;height:100vh;width:236px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;padding:20px 14px;background:var(--surface-c);border-right:1px solid var(--outline-var);z-index:60}
#rail .brand{display:flex;align-items:center;gap:12px;padding:6px 10px 18px}
.brand-logo{width:46px;height:46px;border-radius:15px 15px 15px 27px;background:linear-gradient(135deg,var(--primary),var(--primary-container));color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;letter-spacing:.5px;flex-shrink:0;box-shadow:var(--shadow);transition:transform .4s var(--ease-spring)}
.brand-logo:hover{transform:rotate(-6deg) scale(1.05)}
#rail .brand h1{font-size:.95rem;font-weight:700;line-height:1.2}
#rail .brand small{display:block;font-size:.68rem;color:var(--on-surface-var);font-weight:500;margin-top:2px}
.navitem{display:flex;align-items:center;gap:14px;border:none;background:transparent;color:var(--on-surface-var);font-weight:600;font-size:.88rem;padding:13px 18px;border-radius:999px;cursor:pointer;transition:all .25s var(--ease-spring);position:relative;overflow:hidden;text-align:left}
.navitem svg{flex-shrink:0;transition:transform .3s var(--ease-spring)}
.navitem:hover{background:var(--surface-ch);color:var(--on-surface)}
.navitem.active{background:var(--secondary-container);color:var(--on-secondary-container);font-weight:700}
.navitem.active svg{transform:scale(1.12);color:var(--primary)}
#rail .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px 6px 0;border-top:1px solid var(--outline-var)}
#rail .ver{font-size:.66rem;color:var(--on-surface-var);padding:4px 12px}

#content{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface-c) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--outline-var);padding:10px 16px;display:none;align-items:center;gap:12px}
#topbar .brand{display:flex;align-items:center;gap:10px;min-width:0}
#topbar .brand h1{font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .brand small{display:block;font-size:.66rem;color:var(--on-surface-var);font-weight:500}
#topbar .appbar-actions{margin-left:auto;display:flex;gap:8px}

/* ============ BOTÃO FLUTUANTE VOLTAR AO TOPO ============ */
#fabTop{position:fixed;right:18px;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));z-index:90;width:52px;height:52px;border-radius:18px 18px 18px 30px;background:var(--primary);color:var(--on-primary);border:none;box-shadow:var(--shadow-lg);cursor:pointer;display:flex;align-items:center;justify-content:center;transform:translateY(96px);opacity:0;transition:transform .32s var(--ease-spring),opacity .25s;pointer-events:none}
#fabTop.show{transform:none;opacity:1;pointer-events:auto}
#fabTop:active{transform:scale(.9)}
@media (min-width:880px){#fabTop{bottom:24px}}
body.in-session #fabTop{display:none}
main{max-width:1020px;width:100%;margin:0 auto;padding:26px 20px 46px;flex:1}
footer{text-align:center;padding:22px;font-size:.74rem;color:var(--on-surface-var)}

#bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:70;background:color-mix(in srgb,var(--surface-c) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--outline-var);display:none;justify-content:space-around;align-items:stretch;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:8px 6px env(safe-area-inset-bottom)}
.bn-item{flex:1;max-width:96px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--on-surface-var);border-radius:20px;position:relative;overflow:hidden;transition:color .2s}
.bn-item .bn-pill{width:58px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;transition:all .35s var(--ease-spring)}
.bn-item .bn-pill svg{transition:transform .35s var(--ease-spring)}
.bn-item span.lbl{font-size:.65rem;font-weight:700;letter-spacing:.2px;opacity:0;transform:translateY(4px);transition:all .25s var(--ease-spring)}
.bn-item.active{color:var(--on-secondary-container)}
.bn-item.active .bn-pill{background:var(--secondary-container)}
.bn-item.active .bn-pill svg{transform:scale(1.15)}
.bn-item.active span.lbl{opacity:1;transform:none}
.bn-item:active .bn-pill{transform:scale(.92)}

@media (min-width:880px){
  #rail{display:flex}
  #bottomnav{display:none}
}
@media (max-width:879px){
  #rail{display:none}
  #bottomnav{display:flex}
  #topbar{display:flex}
  main{padding:20px 14px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom))}
  /* rodapé precisa de respiro para não ficar atrás da navegação inferior fixa */
  footer{padding-bottom:calc(var(--nav-h) + 46px + env(safe-area-inset-bottom))}
}
@media (min-width:600px){
  .bn-item span.lbl{opacity:1;transform:none}
}
body.in-session #rail,body.in-session #bottomnav,body.in-session #topbar{display:none}
body.in-session main{padding-bottom:46px}
body.in-session footer{padding-bottom:22px}
@media (max-width:879px){body.in-session main{padding-bottom:20px}}

/* ============ RIPPLE ============ */
.btn,.icon-btn,.mini-btn,.alt,.nq,.agTile,.chip,.navitem,.bn-item,.seg-btn,.sr-item,.ach-card,.pal-dot,.sw-pal,.mchip,.quick{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:ripple .55s var(--ease-std) forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}

/* ============ BOTÕES ============ */
.icon-btn{width:44px;height:44px;border-radius:16px 16px 16px 28px;border:1px solid var(--outline-var);background:var(--surface-ch);color:var(--on-surface);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:transform .22s var(--ease-spring),background .2s;flex-shrink:0}
.icon-btn:hover{background:var(--surface-chh)}
.icon-btn:active{transform:scale(.9) rotate(-3deg)}
.btn{border:none;cursor:pointer;font-weight:600;border-radius:999px;padding:13px 26px;font-size:.92rem;display:inline-flex;align-items:center;gap:9px;justify-content:center;transition:transform .25s var(--ease-spring),box-shadow .2s,background .2s,border-radius .3s var(--ease-spring);text-decoration:none}
.btn:active{transform:scale(.95);border-radius:16px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-filled{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow)}
.btn-filled:hover{filter:brightness(1.08);box-shadow:var(--shadow-lg)}
.btn-tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn-tonal:hover{filter:brightness(1.04)}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--outline)}
.btn-text{background:transparent;color:var(--primary);padding:10px 14px}
.btn-danger{background:var(--error-container);color:var(--on-error-container)}
.btn-sm{padding:9px 18px;font-size:.8rem}
.btn-xl{padding:16px 32px;font-size:1rem;font-weight:700}
.mini-btn{width:38px;height:38px;border-radius:13px 13px 13px 21px;border:1px solid var(--outline-var);background:var(--surface-ch);color:var(--on-surface-var);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:transform .18s var(--ease-spring),background .2s}
.mini-btn:hover{background:var(--surface-chh);color:var(--on-surface)}
.mini-btn:active{transform:scale(.88)}

/* ============ CARDS E SUPERFÍCIES ============ */
.card{background:var(--surface-c);border:1px solid var(--outline-var);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);transition:background .3s}
.card h3{font-size:1.02rem;margin-bottom:12px}
.card .card-sub{font-size:.78rem;color:var(--on-surface-var);margin:-8px 0 14px}
.screen{animation:screenIn .34s var(--ease-std)}
@keyframes screenIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.screen-title{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.screen-title .st-ico{width:52px;height:52px;border-radius:18px 18px 18px 30px;background:var(--secondary-container);color:var(--on-secondary-container);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.screen-title h2{font-size:1.5rem;font-weight:800;letter-spacing:-.4px}
.screen-title p{font-size:.8rem;color:var(--on-surface-var);margin-top:2px}

/* ============ HERO (Início) ============ */
.hero{background:linear-gradient(135deg,var(--primary-container),var(--secondary-container));color:var(--on-primary-container);border:none;border-radius:40px 40px 40px 110px;position:relative;overflow:hidden;margin-bottom:22px;padding:30px 28px}
.hero::before{content:'';position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.16)}
.hero::after{content:'';position:absolute;right:60px;bottom:-90px;width:160px;height:160px;border-radius:46% 54% 60% 40%/50% 44% 56% 50%;background:rgba(255,255,255,.1)}
.hero .hero-top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;position:relative;z-index:1;margin-bottom:18px}
.hero h2{font-size:1.45rem;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.hero .hero-date{font-size:.78rem;opacity:.8;font-weight:500}
.hero .streak-chip{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--bg);color:var(--on-surface);border-radius:999px;padding:9px 16px;font-weight:800;font-size:.86rem;box-shadow:var(--shadow)}
.hero .streak-chip svg{color:#E8590C}
.hero .streak-chip.cold{opacity:.75}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;position:relative;z-index:1}
.hero-goal{display:flex;align-items:center;gap:16px}
.hero-goal .goal-ring{position:relative;width:86px;height:86px;flex-shrink:0}
.hero-goal .goal-ring svg{transform:rotate(-90deg)}
.hero-goal .goal-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;line-height:1}
.hero-goal .goal-num small{font-size:.56rem;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.hero-goal .goal-txt{font-size:.8rem;font-weight:600;max-width:180px;line-height:1.4}
.wavy-wrap{height:18px;position:relative;border-radius:9px;margin:4px 0 2px}
.wavy-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .wave-label{display:flex;justify-content:space-between;font-size:.72rem;font-weight:700;opacity:.85}
.stat-row{display:flex;gap:12px;flex-wrap:wrap;position:relative;z-index:1;margin-top:18px}
.stat{background:var(--bg);color:var(--on-surface);border-radius:22px;padding:14px 20px;min-width:128px;flex:1}
.stat b{display:block;font-size:1.65rem;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat span{font-size:.7rem;color:var(--on-surface-var);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.hero .pct-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);color:var(--on-surface);border-radius:999px;padding:6px 14px;font-size:.74rem;font-weight:700;margin-top:12px}

/* ============ AÇÕES RÁPIDAS ============ */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.quick{display:flex;align-items:center;gap:14px;border:none;cursor:pointer;text-align:left;background:var(--surface-c);border:1px solid var(--outline-var);border-radius:24px;padding:18px;transition:transform .25s var(--ease-spring),box-shadow .2s,background .2s}
.quick:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.quick:active{transform:scale(.97)}
.quick .q-ico{width:48px;height:48px;border-radius:17px 17px 17px 27px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .3s var(--ease-spring)}
.quick:hover .q-ico{transform:rotate(-8deg) scale(1.08)}
.quick b{display:block;font-size:.9rem;margin-bottom:2px}
.quick small{font-size:.78rem;color:var(--on-surface-var);font-weight:500;line-height:1.4;display:block}
/* Modo escuro: textos secundários dos cartões de ação ganham cor clara para leitura confortável */
[data-theme="dark"] .quick small{color:#F4F1F9;font-weight:600}
[data-theme="dark"] .quick b{color:#FFFFFF}
[data-theme="dark"] .msg,[data-theme="dark"] .dlg .dlg-body,[data-theme="dark"] .card .card-sub,[data-theme="dark"] .sim-card .sub{color:#E9E6F2}
.qi-err{background:var(--error-container);color:var(--on-error-container)}
.qi-flash{background:var(--info-container);color:var(--on-info-container)}
.qi-train{background:var(--ok-container);color:var(--on-ok-container)}
.qi-search{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.qi-sim{background:var(--primary-container);color:var(--on-primary-container)}

/* ============ CHIPS / SEGMENTED / SWITCH ============ */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{border-radius:999px;padding:7px 15px;font-size:.72rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border:none;cursor:default;display:inline-flex;align-items:center;gap:6px}
.chip svg{flex-shrink:0}
.chip-port{background:var(--primary-container);color:var(--on-primary-container)}
.chip-rlq{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.chip-adm{background:var(--secondary-container);color:var(--on-secondary-container)}
.chip-tech{background:var(--info-container);color:var(--on-info-container)}
.chip-neutral{background:var(--surface-ch);color:var(--on-surface-var)}
.chip-ok{background:var(--ok-container);color:var(--on-ok-container)}
.chip-bad{background:var(--error-container);color:var(--on-error-container)}
.chip-click{cursor:pointer;font-family:inherit;transition:transform .2s var(--ease-spring),filter .2s}
.chip-click:hover{filter:brightness(1.05)}
.chip-click:active{transform:scale(.93)}
.chip-click:disabled{opacity:.35;cursor:not-allowed}
.mchip{border:1.5px solid var(--outline-var);background:var(--surface-ch);color:var(--on-surface-var);border-radius:999px;padding:8px 16px;font-size:.76rem;font-weight:700;cursor:pointer;transition:all .22s var(--ease-spring);display:inline-flex;align-items:center;gap:7px}
.mchip:hover{background:var(--surface-chh)}
.mchip:active{transform:scale(.94)}
.mchip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.mchip:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface-ch);border-radius:999px;padding:4px;border:1px solid var(--outline-var);gap:2px}
.seg-btn{border:none;background:transparent;color:var(--on-surface-var);font-family:inherit;font-weight:700;font-size:.78rem;padding:9px 16px;border-radius:999px;cursor:pointer;transition:all .25s var(--ease-spring)}
.seg-btn.active{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow)}
.seg-btn:active{transform:scale(.94)}
.seg-btn:disabled{opacity:.4;cursor:not-allowed}
.sw{position:relative;display:inline-block;width:50px;height:30px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw .sw-pal{position:absolute;inset:0;background:var(--surface-chh);border:1.5px solid var(--outline);border-radius:999px;transition:all .25s var(--ease-spring);cursor:pointer}
.sw .sw-pal::after{content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:var(--outline);transition:all .3s var(--ease-spring)}
.sw input:checked+.sw-pal{background:var(--primary);border-color:var(--primary)}
.sw input:checked+.sw-pal::after{left:calc(100% - 23px);width:22px;height:22px;background:var(--on-primary)}
.sw input:disabled+.sw-pal{opacity:.5}
.setrow{display:flex;align-items:center;gap:16px;padding:13px 4px;border-bottom:1px solid var(--outline-var);flex-wrap:wrap}
.setrow:last-child{border-bottom:none}
.setrow .sr-txt{flex:1;min-width:180px}
.setrow .sr-txt b{display:block;font-size:.9rem}
.setrow .sr-txt small{font-size:.74rem;color:var(--on-surface-var);line-height:1.4;display:block;margin-top:2px}
.pal-dots{display:flex;gap:10px;flex-wrap:wrap}
.pal-dot{width:38px;height:38px;border-radius:14px 14px 14px 20px;border:2.5px solid transparent;cursor:pointer;transition:transform .25s var(--ease-spring),border-color .2s;display:flex;align-items:center;justify-content:center;color:#fff}
.pal-dot:hover{transform:scale(1.1) rotate(-4deg)}
.pal-dot.on{border-color:var(--on-surface);transform:scale(1.08)}

/* ============ QUIZ ============ */
.quiz-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.quiz-title{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quiz-side{margin-left:auto;display:flex;gap:10px;align-items:center;flex-shrink:0}
.quiz-count{font-size:.82rem;color:var(--on-surface-var);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.quiz-timer{font-weight:800;font-size:.9rem;background:var(--surface-ch);border:1px solid var(--outline-var);border-radius:14px;padding:9px 14px;font-variant-numeric:tabular-nums;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.quiz-timer.urgent{background:var(--error-container);color:var(--on-error-container);border-color:var(--error);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.6}}
.pbar{height:12px;border-radius:99px;background:var(--surface-chh);overflow:hidden;border:1px solid var(--outline-var)}
.pfill{height:100%;background:linear-gradient(90deg,var(--primary),var(--tertiary-container),var(--primary));background-size:200% 100%;animation:shine 3s linear infinite;border-radius:99px;transition:width .45s var(--ease-spring)}
@keyframes shine{to{background-position:200% 0}}
.texto-wrap{margin-bottom:18px;border:1px solid var(--outline-var);border-radius:20px;overflow:hidden;background:var(--surface-ch)}
.texto-head{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;color:var(--on-surface);font-family:inherit;font-weight:700;font-size:.85rem;padding:12px 18px;cursor:pointer;touch-action:manipulation}
.texto-head:hover{background:var(--surface-chh)}
.texto-head .t-arrow{transition:transform .2s;font-size:.7rem;color:var(--on-surface-var)}
.texto-wrap.open .texto-head .t-arrow{transform:rotate(90deg)}
.texto-head .t-hint{margin-left:auto;font-size:.7rem;font-weight:500;color:var(--on-surface-var);text-transform:none;letter-spacing:0}
.texto-base{padding:16px 20px;border-top:1px solid var(--outline-var);border-left:5px solid var(--primary);font-size:.93rem;line-height:1.6;background:var(--surface-ch);white-space:pre-line}
html.touch .texto-head{padding:16px 18px;font-size:.95rem}
.enunciado{font-size:1rem;line-height:1.65;white-space:pre-line;margin-bottom:22px}
.alts{display:flex;flex-direction:column;gap:10px}
.alt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface-ch);border:2px solid transparent;border-radius:20px;padding:15px 18px;cursor:pointer;font-family:inherit;font-size:.95rem;line-height:1.5;color:var(--on-surface);transition:transform .18s var(--ease-spring),background .2s,border-color .2s;touch-action:manipulation}
.alt:hover{background:var(--surface-chh)}
.alt:active{transform:scale(.98)}
.alt-letter{width:34px;height:34px;border-radius:12px 12px 12px 20px;background:var(--surface-chh);border:1px solid var(--outline-var);font-weight:800;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .25s var(--ease-spring)}
.alt.selected{background:var(--primary-container);border-color:var(--primary)}
.alt.selected .alt-letter{background:var(--primary);color:var(--on-primary);border-color:var(--primary);transform:scale(1.06)}
.alt.correct{background:var(--ok-container);border-color:var(--ok)}
.alt.correct .alt-letter{background:var(--ok);color:var(--on-ok);border-color:var(--ok)}
.alt.wrong{background:var(--error-container);border-color:var(--error)}
.alt.wrong .alt-letter{background:var(--error);color:var(--on-error);border-color:var(--error)}
.alt.dim{opacity:.55}
.alt.locked{cursor:default}
.feedback{margin-top:18px;border-radius:24px;padding:20px 22px;animation:pop .35s var(--ease-spring)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1}}
.feedback.ok{background:var(--ok-container);color:var(--on-ok-container)}
.feedback.bad{background:var(--error-container);color:var(--on-error-container)}
.feedback h4{font-size:.95rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.feedback p{font-size:.9rem;line-height:1.6}
.quiz-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.quiz-actions .spacer{flex:1}
.hint-bar{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--on-surface-var)}
.kbd{background:var(--surface-ch);border:1px solid var(--outline-var);border-bottom-width:3px;border-radius:10px;padding:4px 10px;font-size:.72rem;font-weight:600;color:var(--on-surface-var)}
.kbd-hints{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.flag-btn{border:1.5px dashed var(--outline);background:transparent;color:var(--on-surface-var);border-radius:999px;padding:7px 15px;font-family:inherit;font-weight:700;font-size:.72rem;cursor:pointer;letter-spacing:.4px;text-transform:uppercase;transition:all .2s;touch-action:manipulation;display:inline-flex;align-items:center;gap:6px}
.flag-btn:hover{background:var(--surface-ch)}
.flag-btn.flagged{border-style:solid;background:var(--error-container);color:var(--on-error-container);border-color:var(--error)}
.star-btn{border:1.5px dashed var(--outline);background:transparent;color:var(--on-surface-var);border-radius:999px;padding:7px 15px;font-family:inherit;font-weight:700;font-size:.72rem;cursor:pointer;letter-spacing:.4px;text-transform:uppercase;transition:all .2s;touch-action:manipulation;display:inline-flex;align-items:center;gap:6px}
.star-btn:hover{background:var(--surface-ch)}
.star-btn.starred{border-style:solid;background:var(--tertiary-container);color:var(--on-tertiary-container);border-color:#B7860A}
.star-btn svg{transition:transform .3s var(--ease-spring)}
.star-btn.starred svg{transform:scale(1.15) rotate(12deg)}
.note-area{width:100%;margin-top:12px;border-radius:18px;border:1.5px dashed var(--outline);background:var(--bg);color:var(--on-surface);font-family:inherit;font-size:.88rem;line-height:1.5;padding:14px 16px;resize:vertical;min-height:84px;transition:border-color .2s}
.note-area:focus{outline:none;border-color:var(--primary);border-style:solid}
.note-saved{font-size:.7rem;color:var(--ok);font-weight:700;margin-top:6px;opacity:0;transition:opacity .3s}
.note-saved.show{opacity:1}

/* ============ SIMULADOS (Praticar) ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:22px}
.sim-card{display:flex;flex-direction:column;gap:12px}
.sim-top{display:flex;align-items:center;gap:14px}
.sim-num{width:54px;height:54px;border-radius:20px 20px 20px 34px;background:var(--primary-container);color:var(--on-primary-container);font-weight:800;font-size:1.3rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .3s var(--ease-spring)}
.sim-card:hover .sim-num{transform:rotate(-5deg) scale(1.05)}
.sim-card h3{font-size:1.05rem;margin:0}
.sim-card .sub{font-size:.78rem;color:var(--on-surface-var)}
.sim-mini{display:flex;gap:10px;align-items:center;font-size:.78rem;color:var(--on-surface-var);flex-wrap:wrap}
.sim-actions{display:flex;gap:8px;align-items:center;margin-top:auto}

/* ============ FLASHCARDS ============ */
.fc-scene{perspective:1400px;margin-bottom:6px}
.fcard{position:relative;height:400px;cursor:pointer;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.25,.9,.35,1.1)}
.fcard.flip{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;padding:26px;display:flex;flex-direction:column;background:var(--surface-c);border:1px solid var(--outline-var);box-shadow:var(--shadow);overflow:auto}
.fc-front{align-items:flex-start;justify-content:center}
.fc-front .fc-tag{position:absolute;top:18px;left:22px;display:flex;gap:8px;flex-wrap:wrap}
.fc-front .fc-q{font-size:1.02rem;line-height:1.65;white-space:pre-line;margin-top:44px}
.fc-front .fc-hint{margin-top:auto;padding-top:18px;font-size:.74rem;color:var(--on-surface-var);font-weight:600;display:flex;align-items:center;gap:8px}
.fc-back{transform:rotateY(180deg);background:var(--secondary-container);color:var(--on-secondary-container);border:none}
.fc-back .fc-tag{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fc-back .fc-ans{font-size:.95rem;line-height:1.55;font-weight:500}
.fc-back .fc-ans b{display:block;margin-bottom:6px;font-size:1rem}
.fc-back .fc-exp{margin-top:14px;font-size:.86rem;line-height:1.6;border-top:1px solid var(--outline-var);padding-top:14px}
.fcard:active{transform:scale(.985)}
.fcard.flip:active{transform:rotateY(180deg) scale(.985)}

/* ============ RESULTADOS ============ */
.result-hero{text-align:center;padding:34px 24px}
.result-hero .big{font-size:3rem;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.result-hero .pct{font-size:1.2rem;font-weight:700;color:var(--primary)}
.result-hero .chips{justify-content:center;margin-top:14px}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:22px 0}
.result-cell{background:var(--surface-ch);border-radius:20px;padding:16px;text-align:center}
.result-cell b{display:block;font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.result-cell span{font-size:.72rem;color:var(--on-surface-var);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.msg{font-size:.95rem;line-height:1.6;color:var(--on-surface-var);margin-top:8px}
.result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.wrong-list{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;justify-content:center}
.time-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-ch);border-radius:99px;padding:8px 18px;font-weight:700;font-size:.9rem;margin-top:10px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin:16px 0;justify-content:center}
.agTile{border:none;border-radius:14px;padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-family:inherit;transition:transform .18s var(--ease-spring);touch-action:manipulation}
.agTile:active{transform:scale(.92)}
.agTile .agN{font-weight:800;font-size:.92rem;font-variant-numeric:tabular-nums}
.agTile .agM{font-size:.8rem;font-weight:700}
.agTile.ok{background:var(--ok-container);color:var(--on-ok-container)}
.agTile.bad{background:var(--error-container);color:var(--on-error-container)}
.agTile.blank{background:var(--surface-ch);color:var(--on-surface-var)}
.imgSlot{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:8px}
.imgSlot img{max-width:100%;max-height:420px;border-radius:20px;border:1px solid var(--outline-var);box-shadow:var(--shadow);object-fit:contain}
.imgCaption{font-size:.8rem;color:var(--on-surface-var);font-weight:500;text-align:center;max-width:600px}
.imgEmpty{width:100%;min-height:150px;border:2px dashed var(--outline-var);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 22px;color:var(--on-surface-var);font-size:.85rem;font-weight:700;background:var(--surface-ch)}
.imgEmpty small{font-weight:400;opacity:.8;max-width:440px;line-height:1.5;margin-top:6px}
.hidden{display:none!important}

/* ============ NAVEGADOR DE QUESTÕES (overlay) ============ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(4px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}}
.nav-card{max-width:640px;width:100%;max-height:88vh;overflow:auto;animation:dlgIn .3s var(--ease-spring)}
@keyframes dlgIn{from{opacity:0;transform:scale(.94) translateY(10px)}}
.nav-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.nav-head h3{font-size:1.1rem;margin:0}
.nav-head .icon-btn{margin-left:auto;width:38px;height:38px;font-size:15px}
.nav-stats{font-size:.85rem;color:var(--on-surface-var);margin-bottom:8px}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:12px 0}
.nq{position:relative;height:44px;border-radius:14px;border:1px solid var(--outline-var);background:var(--surface-ch);cursor:pointer;font-family:inherit;font-weight:700;font-size:.85rem;color:var(--on-surface);transition:transform .15s;touch-action:manipulation}
.nq:hover{background:var(--surface-chh)}
.nq:active{transform:scale(.9)}
.nq.done{background:var(--primary-container);color:var(--on-primary-container);border-color:var(--primary)}
.nq.cur{outline:3px solid var(--primary);outline-offset:1px}
.nq.flag::after{content:'';position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--error)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.75rem;color:var(--on-surface-var);margin-bottom:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:5px;margin-right:5px;vertical-align:-1px;border:1px solid var(--outline-var);background:var(--surface-ch)}
.legend i.done{background:var(--primary-container);border-color:var(--primary)}
.legend i.flag{background:var(--error);border-color:var(--error)}

/* ============ DIÁLOGOS E TOASTS ============ */
#dlgHost .overlay{z-index:300}
.dlg{background:var(--surface-c);border:1px solid var(--outline-var);border-radius:30px;max-width:430px;width:100%;padding:26px;box-shadow:var(--shadow-lg);animation:dlgIn .32s var(--ease-spring)}
.dlg h3{font-size:1.12rem;margin-bottom:10px;letter-spacing:-.2px}
.dlg .dlg-body{font-size:.88rem;line-height:1.6;color:var(--on-surface-var);margin-bottom:22px;white-space:pre-line}
.dlg .dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toastHost{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,480px)}
body:not(.in-session) #toastHost{bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom))}
@media (min-width:880px){body:not(.in-session) #toastHost{bottom:24px}}
.toast{background:var(--inv);color:var(--on-inv);border-radius:18px;padding:14px 20px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .35s var(--ease-spring);max-width:100%}
.toast svg{flex-shrink:0}
.toast.out{animation:toastOut .3s var(--ease-std) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.97)}}

/* ============ ONBOARDING ============ */
#obHost{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px}
.ob-card{max-width:430px;width:100%;text-align:center;animation:dlgIn .35s var(--ease-spring)}
.ob-ico{width:88px;height:88px;margin:6px auto 18px;border-radius:30px 30px 30px 44px;display:flex;align-items:center;justify-content:center;background:var(--primary-container);color:var(--on-primary-container)}
.ob-card h3{font-size:1.3rem;font-weight:800;margin-bottom:8px}
.ob-card p{font-size:.88rem;color:var(--on-surface-var);line-height:1.6;margin-bottom:20px}
.ob-dots{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.ob-dots i{width:8px;height:8px;border-radius:99px;background:var(--outline-var);transition:all .3s var(--ease-spring)}
.ob-dots i.on{width:24px;background:var(--primary)}
.ob-actions{display:flex;gap:10px;justify-content:center}

/* ============ GRÁFICOS / ESTATÍSTICAS ============ */
.lvl-card{background:linear-gradient(135deg,var(--primary-container),var(--secondary-container));color:var(--on-primary-container);border:none;border-radius:32px 32px 32px 64px;position:relative;overflow:hidden;margin-bottom:22px}
.lvl-card::after{content:'';position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.lvl-row{display:flex;align-items:center;gap:18px;position:relative;z-index:1;flex-wrap:wrap}
.lvl-badge{width:76px;height:76px;border-radius:26px 26px 26px 40px;background:var(--primary);color:var(--on-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow)}
.lvl-badge b{font-size:1.6rem;font-weight:800;line-height:1}
.lvl-badge small{font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.lvl-info{flex:1;min-width:200px}
.lvl-info h3{font-size:1.15rem;margin-bottom:2px}
.lvl-info .lvl-sub{font-size:.76rem;opacity:.85;font-weight:600;margin-bottom:10px}
.lvl-bar{height:14px;border-radius:99px;background:rgba(0,0,0,.12);overflow:hidden;border:1px solid rgba(0,0,0,.08)}
.lvl-fill{height:100%;border-radius:99px;background:var(--primary);transition:width .8s var(--ease-spring)}
.lvl-xp{font-size:.7rem;font-weight:700;opacity:.8;margin-top:6px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.donut-cell{background:var(--surface-c);border:1px solid var(--outline-var);border-radius:24px;padding:18px;display:flex;align-items:center;gap:14px}
.donut-cell .dc-num{font-size:1.5rem;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
.donut-cell small{font-size:.68rem;color:var(--on-surface-var);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.donut-cell .dc-ico{width:44px;height:44px;border-radius:16px 16px 16px 24px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mat-row{display:flex;align-items:center;gap:14px;margin:14px 0;flex-wrap:wrap}
.mat-row .mr-name{flex:0 0 160px;font-size:.86rem;font-weight:700;display:flex;align-items:center;gap:8px}
.mat-row .pbar{height:12px;flex:1;min-width:140px;margin:0}
.mat-row .mr-val{flex:0 0 110px;text-align:right;font-size:.78rem;color:var(--on-surface-var);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chart-wrap{overflow-x:auto;margin:8px 0 4px}
.chart-wrap svg{min-width:460px;width:100%;height:auto;display:block}
.heat-wrap{overflow-x:auto;padding:4px 2px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:4px;width:max-content}
.hc{width:13px;height:13px;border-radius:4.5px;background:var(--surface-chh);transition:transform .15s}
.hc:hover{transform:scale(1.25)}
.hc.h1{background:color-mix(in srgb,var(--primary) 26%,var(--surface-chh))}
.hc.h2{background:color-mix(in srgb,var(--primary) 45%,var(--surface-chh))}
.hc.h3{background:color-mix(in srgb,var(--primary) 68%,var(--surface-chh))}
.hc.h4{background:var(--primary)}
.hc.today{outline:2px solid var(--on-surface);outline-offset:1px}
.heat-legend{display:flex;gap:6px;align-items:center;font-size:.7rem;color:var(--on-surface-var);margin-top:10px;justify-content:flex-end}
.heat-legend .hc{width:11px;height:11px}
.hist-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:var(--surface-ch);margin-bottom:8px;flex-wrap:wrap}
.hist-item .hi-pct{font-weight:800;font-size:1.15rem;min-width:58px;font-variant-numeric:tabular-nums}
.hist-item .hi-txt{flex:1;min-width:170px;font-size:.8rem;color:var(--on-surface-var);line-height:1.45}
.hist-item .hi-txt b{color:var(--on-surface);font-size:.86rem}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ach-card{background:var(--surface-ch);border-radius:22px;padding:16px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid transparent;transition:transform .25s var(--ease-spring)}
.ach-card:hover{transform:translateY(-2px)}
.ach-card .ach-ico{width:46px;height:46px;border-radius:16px 16px 16px 26px;display:flex;align-items:center;justify-content:center;background:var(--ok-container);color:var(--on-ok-container)}
.ach-card b{font-size:.78rem;line-height:1.3}
.ach-card small{font-size:.66rem;color:var(--on-surface-var);line-height:1.35}
.ach-card.locked{opacity:.55;filter:grayscale(.7)}
.ach-card.locked .ach-ico{background:var(--surface-chh);color:var(--outline)}
.ach-card .ach-date{font-size:.6rem;color:var(--ok);font-weight:700}

/* ============ BUSCA ============ */
.search-row{display:flex;gap:10px;align-items:center;background:var(--surface-ch);border:1.5px solid var(--outline-var);border-radius:999px;padding:6px 8px 6px 18px;transition:border-color .2s,background .2s}
.search-row:focus-within{border-color:var(--primary);background:var(--surface-c)}
.search-row svg{color:var(--on-surface-var);flex-shrink:0}
.search-row input{flex:1;border:none;background:transparent;color:var(--on-surface);font-family:inherit;font-size:.92rem;outline:none;min-width:0;padding:8px 0}
.sr-count{font-size:.74rem;color:var(--on-surface-var);margin:12px 0 10px;font-weight:600}
.sr-item{display:block;width:100%;text-align:left;border:none;background:var(--surface-ch);border-radius:20px;padding:14px 16px;cursor:pointer;font-family:inherit;transition:background .2s,transform .2s var(--ease-spring);margin-bottom:8px}
.sr-item:hover{background:var(--surface-chh)}
.sr-item:active{transform:scale(.98)}
.sr-item .sr-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.sr-item .sr-tx{font-size:.82rem;line-height:1.45;color:var(--on-surface)}
.sr-item .sr-tx mark{background:var(--tertiary-container);color:var(--on-tertiary-container);border-radius:4px;padding:0 2px}

/* ============ TOUCH MODE ============ */
html.touch body{touch-action:manipulation}
html.touch .btn{min-height:52px;font-size:1rem}
html.touch .btn-sm{min-height:46px}
html.touch .icon-btn{width:48px;height:48px}
html.touch .alt{padding:18px 20px;font-size:1.02rem;border-radius:24px}
html.touch .alt:active{transform:scale(.985)}
html.touch .alt-letter{width:44px;height:44px;font-size:1rem}
html.touch .nq{height:54px;font-size:.95rem}
html.touch .chip{padding:9px 16px;font-size:.75rem}
html.touch .flag-btn,html.touch .star-btn{padding:11px 18px;font-size:.78rem}
html.touch .quiz-timer{padding:12px 16px;font-size:1rem}
html.touch .feedback{padding:24px}
html.touch .hint-bar{margin-bottom:128px;font-size:.82rem}
html.touch .agrid{gap:10px}
html.touch .agTile{min-height:64px}
html.touch .fcard{height:440px}
#touchBar{position:fixed;left:0;right:0;bottom:0;z-index:120;background:color-mix(in srgb,var(--surface-c) 96%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--outline-var);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:none}
html.touch #touchBar{display:block}
#touchBar .quiz-actions{margin:0;flex-wrap:nowrap;gap:8px}
#touchBar .quiz-actions .spacer{display:none}
#touchBar .quiz-actions .btn{flex:1;min-width:0;padding:15px 10px}
#touchBar .quiz-actions .btn-text{flex:0 0 auto}
#touchBar #btnConfirm{flex:2}
html.touch .overlay{align-items:flex-end;padding:0}
html.touch .nav-card,html.touch .dlg{max-width:100%;width:100%;border-radius:28px 28px 0 0;max-height:82vh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
/* Arraste-para-fechar (bottom sheets no toque) */
html.touch .dlg,html.touch .nav-card{transition:transform .28s var(--ease-spring),opacity .28s var(--ease-std)}
html.touch .dlg.dragging,html.touch .nav-card.dragging{transition:none;will-change:transform}
html.touch .dlg.dragging{animation:none}

}

  html{font-size:16.5px}
  #rail{width:256px;padding:24px 16px}
  main{max-width:1130px;padding:34px 40px 60px}
  body.in-session main{max-width:940px}
  .card{padding:30px}
  .hero{padding:38px 36px}
  .hero h2{font-size:1.6rem}
  .hero .streak-chip{padding:11px 18px}
  .stat{padding:16px 22px}
  .stat b{font-size:1.8rem}
  .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  .quick{padding:22px 24px}
  .quick b{font-size:.98rem}
  .quick small{font-size:.82rem}
  .quick .q-ico{width:52px;height:52px}
  .grid{gap:18px}
  .enunciado{font-size:1.06rem;line-height:1.72}
  .alt{font-size:1rem}
  html.touch .alt{padding:18px 22px}
  .alt-letter{width:38px;height:38px}
  .texto-base{font-size:.98rem;padding:18px 24px}
  .feedback p{font-size:.94rem}
  .screen-title h2{font-size:1.65rem}
  .sim-num{width:58px;height:58px}
  .sim-card h3{font-size:1.1rem}
  .result-hero .big{font-size:3.4rem}
  .ach-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .navgrid{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
  .nq{height:50px}
  .dlg{max-width:460px}
  html.touch .navitem{padding:15px 18px;min-height:48px}
  html.touch .icon-btn{width:50px;height:50px}
  html.touch .btn{min-height:54px}
  #obHost{padding:36px}
  .ob-card{max-width:480px}
}
/* Barra de ações de toque: em telas largas, mantém largura confortável (não estica) */
@media (min-width:700px){#touchBar .quiz-actions{max-width:780px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
@media print{#rail,#bottomnav,#topbar,#touchBar,#toastHost,#fabTop{display:none!important}}

<script>
/* ================================================================
   🖼️ IMAGEM NO FINAL DA PÁGINA DE RESUMO
   Para exibir sua imagem, troque a URL abaixo (deixe "" para
   ver apenas o espaço reservado). Aceita:

   • arquivo na mesma pasta do simulado: "imagem.jpg"
   ================================================================ */
const IMG_RESUMO_URL="https://www.dropbox.com/scl/fi/lbxmt9a7yopmh67cz5xik/noiss.png?rlkey=lrgal88g9i8avfa5yuj28divd&st=p36pcz5e&dl=1";        /* <- TROQUE APENAS ESTE VALOR */
const IMG_RESUMO_TITULO="Tamuuuuuuu💖";     /* legenda opcional, exibida abaixo da imagem */
const IMG_RESUMO_LINK="https://youtu.be/zKM-VrnMxDU";       /* link opcional: ao clicar, abre esta URL em nova aba */

/* ============ TEXTOS-BASE (fixados acima das questões que os utilizam) ============ */
const TEXTS={
1:"O home office veio para ficar — ainda que em versão mais comedida do que a imaginada no auge da pandemia.\n\nPesquisas recentes mostram que a maioria das empresas brasileiras adotou modelos híbridos, em que o funcionário alterna dias no escritório e dias em casa.\n\nDefendem-se os polos: para uns, o retorno integral preserva a cultura organizacional e a produtividade; para outros, a flexibilidade amplia a autonomia e reduz o desgaste dos deslocamentos.\n\nO que os dados indicam, contudo, é mais prosaico: não existe modelo único. Cada organização precisa experimentar, medir e ajustar. Afirmar categoricamente que uma fórmula serve a todas as empresas equivale a ignorar a diversidade de setores, funções e pessoas.",
2:"Amazônia: satélites registram queda no desmatamento, mas cientistas pedem cautela\n\nDe Brasília — Os satélites de monitoramento registraram, no último trimestre, a menor taxa de desmatamento da Amazônia para o período em cinco anos.\n\nO dado foi comemorado por autoridades ambientais, que o atribuem ao reforço da fiscalização e a novas regras de crédito rural.\n\nPesquisadores, porém, recomendam cautela: parte da queda se explica pelo El Niño, que castigou a região com secas severas e dificultou a derrubada de florestas.\n\nAlém disso, alertam que uma única estação seca favorável pode mascarar tendências de longo prazo.\n\nO desafio, sustentam, é transformar resultados conjunturais em política de Estado — isto é, em ações contínuas, financiadas e independentes dos ciclos políticos.",
3:"O relógio da estação\n\nHá estações de trem em que o tempo parece ter assinado contrato de permanência.\n\nA antiga estação da cidade, de tijolos escurecidos pela fumaça das antigas locomotivas, guarda um relógio parado há décadas — e, no entanto, ninguém o conserta.\n\nPassageiros apressados reclamam; o funcionário, um senhor de óculos redondos, sorri e explica que aquele relógio é o ponto de encontro de gerações: 'Meu pai marcava encontro ali embaixo, e hoje meus netos fazem o mesmo.'\n\nTalvez seja essa a função das cidades: guardar objetos inúteis que, no fundo, sustentam a lembrança de todos.\n\nO relógio não marca as horas; marca, discretamente, a nossa.",
4:"A carta\n\nAo abrir a carta, Dona Aurora reconheceu de imediato o papel: amarelado, de bordas ásperas, comprado na única papelaria da vila — a mesma onde, quarenta anos antes, comprara envelopes para os seus primeiros bilhetes.\n\nA letra, embora trêmula, conservava a firmeza de quem aprendera a escrever com mestres exigentes.\n\nLeu-a duas vezes, sem pressa, como quem saboreia um prato antigo. Nada na mensagem era novo: repetiam-se as queixas de sempre, as saudades de sempre.\n\nE, no entanto, Dona Aurora sorriu, porque é justamente essa a graça das velhas amizades — dizer o mesmo, e ouvir o mesmo, como se fosse a primeira vez.",
5:"A leitura em tempos de pressa\n\nVive-se um paradoxo: nunca se teve acesso a tanto texto e nunca se leu com tanta pressa.\n\nNas telas, os olhos correm; saltam títulos, resumem parágrafos, ignoram vírgulas.\n\nDefende-se, aqui e ali, que a leitura profunda é um luxo de outros tempos — que a urgência contemporânea exige apenas extrair informação útil, o mais rapidamente possível.\n\nÉ um erro de avaliação. Ler devagar não é nostalgia: é método.\n\nÉ na lentidão que se percebe o que um texto esconde entre as linhas, que se formulam perguntas, que se contesta o autor.\n\nQuem apenas colhe frases prontas colhe também as conclusões prontas de outrem — e abre mão, sem perceber, do próprio juízo.",
6:"O caderno de capa preta\n\nNa fazenda em que passei a infância, havia um objeto mais consultado que o rádio: o caderno de capa preta do meu avô.\n\nNele, ele anotava tudo — a data da primeira chuva de setembro, o número de bezerros nascidos no mês, quantas arrobas de café tinham saído no caminhão de março. A letra era tosca, os números, desengonçados; faltavam acentos como faltam cercas em terra bruta.\n\nVizinhos zombavam da mania. 'Livro de conta é coisa de agiota', diziam. Meu avô não respondia: seguia debruçado sobre a mesa, à luz do lampião, somando o que a terra dava — e o que ela negava.\n\nSó décadas depois entendi o que ele guardava ali. Não eram números soltos: era o cuidado teimoso de quem sabe que o ano bom e o ano ruim acabam se respondendo, e que só quem anota consegue enxergar essa conversa.\n\nO caderno ainda existe, guardado numa lata de biscoito. Suas páginas amareladas dizem, com todas as letras tortas, o que nenhuma saudade sozinha consegue dizer."
};

/* ============ BANCO DE QUESTÕES — 5 SIMULADOS × 60 ============ */
const QUESTIONS = [

/* ==================== SIMULADO 1 ==================== */
{s:1,n:1,t:1,q:"De acordo com o texto, a posição do autor diante da discussão sobre os modelos de trabalho é de:",a:["defesa intransigente do retorno integral ao escritório","apologia do home office como solução universal","recusa às fórmulas universais: cabe a cada organização experimentar, medir e ajustar","neutralidade absoluta, sem qualquer juízo sobre o tema","ceticismo quanto à possibilidade de medir a produtividade"],c:2,e:"O autor apresenta os dois polos, mas conclui, com base nos dados, que 'não existe modelo único', recusando generalizações ('Afirmar categoricamente que uma fórmula serve a todas as empresas equivale a ignorar...')."},
{s:1,n:2,t:1,q:"No período 'O que os dados indicam, contudo, é mais prosaico', o conectivo destacado estabelece relação de:",a:["conclusão","finalidade","oposição","alternância","adição"],c:2,e:"'Contudo' é adversativo: opõe a polarização da discussão ('defendem-se os polos') ao que os dados realmente indicam."},
{s:1,n:3,t:1,q:"O autor surpreende o leitor ao tratar com simplicidade a discussão sobre os modelos de trabalho. No período 'O que os dados indicam, contudo, é mais prosaico', a palavra 'prosaico' significa:",a:["grandioso","complexo","comum, sem grandeza","equivocado","técnico"],c:2,e:"Prosaico = comum, banal, desprovido de grandiosidade. O autor contrapõe a expectativa de uma resposta definitiva a algo simples: não há modelo único."},
{s:1,n:4,q:"Na redação de comunicações internas da operação de coleta, o correto emprego da crase evita erros que comprometem a formalidade do texto. Assinale a alternativa em que o emprego do sinal indicativo de crase está CORRETO:",a:["O posto está situado à beira da rodovia.","O recenseador dirigia-se à pé até a fazenda.","O produtor entregou os formulários à ele.","O prazo vai de segunda à sexta.","Estamos dispostos à colaborar com a pesquisa."],c:0,e:"'À beira de' é locução prepositiva com palavra feminina: crase obrigatória. Não há crase antes de palavra masculina (a pé), pronome pessoal (ele), verbo (colaborar) nem na estrutura 'de...a' (de segunda a sexta)."},
{s:1,n:5,q:"Relatórios e comunicados do posto censitário são documentos oficiais e exigem concordância verbal impecável. Ao revisar textos dessa natureza, assinale a frase com concordância verbal CORRETA:",a:["Devem haver falhas na transmissão dos dados.","Fazem dez meses que o posto funciona.","Ocorreram diversos problemas de acesso à sede do município.","Haviam recenseadores que trabalharam até tarde.","Fazem muitos anos que a região é recenseada pelo IBGE."],c:2,e:"'Ocorrer' concorda com o sujeito: ocorreram (diversos problemas). Já 'haver' no sentido de existir e 'fazer' indicando tempo decorrido são impessoais e ficam sempre na 3ª pessoa do singular: deve haver falhas, faz dez meses, havia recenseadores, faz muitos anos."},
{s:1,n:6,q:"A revisão cuidadosa de ofícios e planilhas exige atenção às regras de concordância nominal. Assinale a alternativa correta quanto à concordância nominal:",a:["Seguem anexo as planilhas da coleta.","É proibido a entrada de estranhos no posto.","A supervisora estava meia preocupada com os prazos.","Os dois supervisores ficaram quites com o combinado.","Segue incluso os relatórios solicitados."],c:3,e:"'Quite' concorda: quites. 'Anexo/incluso' também concordam (anexas, inclusos); com artigo, 'é proibida a entrada'; 'meio' como advérbio é invariável (meio preocupada)."},
{s:1,n:7,q:"Os documentos oficiais do serviço público devem observar a norma-padrão da língua. Assinale a alternativa em que a regência está de acordo com a norma-padrão:",a:["O candidato aspira o cargo de supervisor.","Todos assistiram o vídeo sem fazer anotações.","Chegamos na agência do IBGE antes das oito.","O informante preferiu responder agora do que mais tarde.","O produtor respondeu à carta do IBGE com detalhes."],c:4,e:"'Responder a algo' (dar resposta) exige preposição: respondeu à. Aspirar (desejar) = aspira ao; assistir (ver) = assistiram ao; chegar = chegamos à; preferir X a Y."},
{s:1,n:8,q:"A vírgula mal empregada pode alterar o sentido de uma frase oficial. Observe as variantes a seguir e assinale a alternativa pontuada CORRETAMENTE:",a:["O posto censitário, funcionava em prédio alugado, pela prefeitura.","O posto censitário funcionava em prédio alugado pela prefeitura.","O posto censitário funcionava, em prédio alugado, pela prefeitura.","O posto, censitário funcionava em prédio alugado pela prefeitura.","O posto censitário funcionava em prédio alugado, pela prefeitura."],c:1,e:"A frase não contém elementos deslocáveis: o adjunto adnominal 'alugado pela prefeitura' adere a 'prédio' sem vírgulas. As demais alternativas segregam termos que formam unidade — separando o adjetivo 'alugado' de seu complemento (E), o sujeito do verbo (A e D) ou o verbo de seu complemento (C)."},
{s:1,n:9,t:1,q:"O primeiro período do texto situa o leitor sobre a atualidade do home office. Nesse período, a expressão 'em versão mais comedida' indica que o home office:",a:["foi totalmente abandonado","permanece, mas de forma mais moderada e contida","será imposto com rigor","chegou de modo discreto, sem alarde","passou a ser obrigatório nas empresas"],c:1,e:"Comedido = moderado, contido. O texto diz que o home office 'veio para ficar', porém de forma menos intensa do que se imaginou no auge da pandemia."},
{s:1,n:10,q:"Em uma avaliação de desempenho, o supervisor elogiou o recenseador diligente. Assinale o ANTÔNIMO de 'diligente':",a:["aplicado","pontual","zeloso","negligente","competente"],c:3,e:"Diligente = aplicado, esmerado, cuidadoso. O antônimo é negligente (descuidado)."},
{s:1,n:11,q:"Complete: 'O técnico apresentou a ______ do problema; o ACS agiu com ______ durante a negociação.'",a:["descrição / discrição","discrição / descrição","descrição / descrição","discrição / discrição","descrição / inscrição"],c:0,e:"Descrição = ato de descrever; discrição = reserva, comedimento. São parônimos (palavras semelhantes na forma e diferentes no significado)."},
{s:1,n:12,q:"Em 'Os recenseadores trabalharam bastante e produziram bastantes questionários', as palavras destacadas classificam-se, respectivamente, como:",a:["ambas são advérbios","ambas são pronomes","advérbio e pronome adjetivo","pronome e advérbio","conjunção e interjeição"],c:2,e:"'Bastante' intensificando verbo é advérbio (invariável); 'bastantes' determinando substantivo é pronome adjetivo (variável)."},
{s:1,n:13,q:"O emprego dos pronomes pessoais é ponto clássico de avaliação em comunicações profissionais. Assinale a alternativa em que o emprego do pronome está CORRETO:",a:["Entre eu e você, o relatório está pronto.","Não houve desentendimento entre o supervisor e eu.","Este é um problema para mim resolver.","Não houve desentendimento entre o supervisor e mim.","Para mim fazer a conferência, preciso dos dados."],c:3,e:"Após preposição usa-se o oblíquo tônico 'mim' (entre mim e você; entre o supervisor e mim). Sujeito de infinitivo pede 'eu': para eu resolver, para eu fazer."},
{s:1,n:14,q:"No preenchimento de relatórios e cadastros, a acentuação correta das palavras é indispensável. Assinale a palavra CORRETAMENTE acentuada:",a:["juíz","orgão","relatório","ítems","flúido"],c:2,e:"'Relatório' é paroxítona terminada em ditongo crescente (-io). Grafias corretas: juiz, órgão, itens, fluido."},
{s:1,n:15,q:"Passando a frase 'O ACS corrigiu os questionários' para a voz passiva analítica, obtém-se:",a:["Os questionários corrigiram o ACS.","Os questionários foram corrigidos pelo ACS.","Os questionários são corrigidos pelo ACS.","Corrigem-se os questionários pelo ACS.","O ACS foi corrigido pelos questionários."],c:1,e:"Na passiva analítica, o objeto vira sujeito paciente, a forma verbal ser + particípio mantém o tempo do ativo (pretérito perfeito: foram corrigidos) e o agente vem precedido de 'pelo(a)'."},
{s:1,n:16,q:"Em um mês difícil, o número de estabelecimentos visitados por uma equipe caiu 20% em relação ao mês anterior. No mês seguinte, a equipe aumentou 25% o número de visitas em relação a esse novo patamar. Em relação ao mês original, antes da queda, o número de visitas ficou:",a:["exatamente igual ao do mês original","5% abaixo do mês original","5% acima do mês original","45% acima do mês original","20% abaixo do mês original"],c:0,e:"Basta multiplicar os fatores: 0,80 × 1,25 = 1,00 — o aumento de 25% incide sobre a base já reduzida e recupera exatamente o nível inicial. Somar as taxas (45%) ou subtraí-las (5%) é o erro clássico de quem esquece que cada porcentagem incide sobre uma base diferente."},
{s:1,n:17,q:"Oito recenseadores, trabalhando 6 horas por dia, cobrem um setor em 10 dias. Se 12 recenseadores, trabalhando 5 horas por dia, mantiverem o mesmo ritmo por hora, a cobertura do mesmo setor levará:",a:["8 dias","5 dias","9 dias","12 dias","6 dias"],c:0,e:"O total de trabalho é constante (pessoas × horas × dias): 8 × 6 × 10 = 480. Dividindo pela nova capacidade diária: 480 ÷ (12 × 5) = 8 dias. Variar apenas um dos fatores leva aos distratores 6 e 12."},
{s:1,n:18,q:"Ao conferir o número de protocolos transmitidos por um posto, o supervisor observou a sequência registrada no sistema: 2, 3, 5, 9, 17, ... Assinale o próximo termo da sequência:",a:["25","33","26","34","19"],c:1,e:"As diferenças dobram a cada passo: +1, +2, +4, +8 e, portanto, +16 → 17 + 16 = 33."},
{s:1,n:19,q:"Se o ACS assina o relatório, então o ACR o encaminha à coordenação. Se o ACR o encaminha à coordenação, o relatório é arquivado. O relatório não foi arquivado. Logo:",a:["o ACS assinou o relatório","o ACS não assinou o relatório","o ACR encaminhou o relatório","o relatório foi extraviado","nada se pode concluir"],c:1,e:"Pela cadeia condicional (assina → encaminha → arquiva), negar o último elo (não arquivado) obriga, por modus tollens, a negar os anteriores: não foi encaminhado e não foi assinado."},
{s:1,n:20,q:"Uma caixa contém 5 lâmpadas boas e 3 defeituosas. Retiram-se duas lâmpadas, uma após a outra, sem reposição. A probabilidade de a primeira ser boa e a segunda defeituosa é:",a:["15/56","15/64","5/14","3/8","9/14"],c:0,e:"P = 5/8 × 3/7 = 15/56. Sem reposição, o total muda para 7 na segunda retirada. (15/64 pressupõe reposição; 5/14 = 20/56 seria 'boa e boa'.)"},
{s:1,n:21,q:"A produção de leite de quatro fazendas, em toneladas, foi 120, 150, 90 e x. Se a média de produção foi de 125 toneladas, então x é igual a:",a:["140","125","135","145","130"],c:0,e:"4 × 125 = 500; 120 + 150 + 90 = 360; x = 500 − 360 = 140."},
{s:1,n:22,q:"A distância real entre dois pontos é de 7,5 km. Em um mapa na escala 1:100.000, essa distância corresponde, em centímetros, a:",a:["75","750","0,75","7,5","15"],c:3,e:"7,5 km = 750.000 cm; 750.000 ÷ 100.000 = 7,5 cm. A alternativa 75 cm ignora a conversão de unidades; 0,75 inverte a operação."},
{s:1,n:23,q:"Considere as premissas a seguir, ambas verdadeiras: 'Todo supervisor lidera equipes' e 'Quem lidera equipes se comunica diariamente'. Logo:",a:["todo supervisor se comunica diariamente","quem se comunica diariamente é supervisor","nenhum supervisor lidera equipes","alguns supervisores não lideram equipes","nada se pode concluir"],c:0,e:"Silogismo válido: unindo as duas premissas, todo supervisor entra no conjunto dos que lideram equipes e, portanto, dos que se comunicam diariamente. A alternativa B comete a falácia da conversão ilegítima."},
{s:1,n:24,q:"As idades de dois irmãos estão entre si na razão 4:7 e somam 44 anos. A idade do mais velho é:",a:["28","24","25","26","32"],c:0,e:"4 + 7 = 11 partes; 44 ÷ 11 = 4 anos por parte; mais velho = 7 × 4 = 28 anos."},
{s:1,n:25,q:"Em um posto censitário, três recenseadores — Bruno, Carla e Diego — respondem, cada um, por um tipo diferente de setor: um setor urbano de baixa densidade, um setor rural de ocupação dispersa e uma agrovila. Sabe-se que: Bruno não trabalha na agrovila; Carla trabalha no setor urbano de baixa densidade; o recenseador responsável pelo setor rural de ocupação dispersa é homem. Logo, Diego responde pelo setor:",a:["urbano de baixa densidade","rural de ocupação dispersa","agrovila","urbano de baixa densidade e, adicionalmente, pela agrovila","não é possível determiná-lo com as informações dadas"],c:2,e:"Carla = setor urbano. Bruno não é da agrovila nem do urbano (já ocupado por Carla), logo Bruno = rural de ocupação dispersa (coerente com a pista de que o responsável é homem). Por eliminação, Diego = agrovila. Questão de associação lógica (diagramas lógicos), clássica da banca."},
{s:1,n:26,q:"A função administrativa que consiste em definir objetivos e estabelecer os cursos de ação para alcançá-los é:",a:["controle","organização","direção","planejamento","avaliação"],c:3,e:"Planejamento é a função que define objetivos e os meios para atingi-los — base das demais funções do ciclo administrativo."},
{s:1,n:27,q:"Comparar o desempenho real com o padrão estabelecido e adotar ações corretivas corresponde à função de:",a:["planejamento","direção","organização","motivação","controle"],c:4,e:"Controle é medir resultados, compará-los com os padrões (definidos no planejamento) e corrigir desvios, realimentando o ciclo."},
{s:1,n:28,q:"Uma organização revisa seus processos a cada mudança do cenário econômico e do comportamento do consumidor, ajustando objetivos e rotinas. Essa postura ilustra a compreensão da organização como:",a:["sistema fechado e previsível","estrutura puramente burocrática","sistema aberto, em intercâmbio contínuo com o ambiente","organização informal","mecanismo de controle estatístico"],c:2,e:"A teoria de sistemas concebe as organizações como sistemas abertos: recebem insumos do ambiente, processam-nos, devolvem produtos e se adaptam às mudanças externas."},
{s:1,n:29,q:"No ciclo administrativo que orienta a gestão de uma equipe de coleta, a função de organizar envolve:",a:["dividir o trabalho, agrupar atividades e definir autoridade e responsabilidade","definir missão e visão da organização","avaliar o desempenho individual dos membros","motivar e comunicar-se com a equipe","corrigir desvios de rota da operação"],c:0,e:"Organizar é estruturar: divisão de tarefas, departamentalização, hierarquia e alocação de autoridade e responsabilidade."},
{s:1,n:30,q:"A teoria das necessidades de Maslow é um dos quadros clássicos sobre motivação estudados em Administração. No topo da hierarquia das necessidades de Maslow encontra-se:",a:["as necessidades fisiológicas","as necessidades de segurança","as necessidades sociais","as necessidades de estima","a necessidade de autorrealização"],c:4,e:"No topo da pirâmide está a autorrealização — o pleno desenvolvimento do potencial pessoal."},
{s:1,n:31,q:"Ao avaliar o próprio estilo de condução da equipe, um ACS estuda os estilos clássicos de liderança. A liderança de estilo democrático (participativo) caracteriza-se por:",a:["decidir sozinho e comunicar as decisões","centralizar todas as decisões no chefe","estimular a participação da equipe nas decisões","deixar a equipe totalmente à vontade, sem orientação","basear-se apenas em recompensas financeiras"],c:2,e:"O estilo democrático compartilha decisões e valoriza as contribuições da equipe, elevando o comprometimento (sem abrir mão da direção, como no estilo liberal)."},
{s:1,n:32,q:"Após transmitir a nova orientação de percurso, o ACS pede a cada recenseador que repita, com as próprias palavras, o que entendeu. O procedimento visa, essencialmente, a:",a:["aumentar o tempo da reunião","obter feedback que confirme a correta compreensão da mensagem","delegar a comunicação à equipe","verificar a capacidade de memorização dos recenseadores","cumprir formalidade prevista em manual"],c:1,e:"Paráfrase de verificação é técnica de feedback: fecha o ciclo da comunicação, detectando ruído ou distorção antes que virem erro em campo."},
{s:1,n:33,q:"As decisões do ACS — das mais rotineiras às mais delicadas — seguem um processo. A PRIMEIRA etapa de um processo decisório bem conduzido é:",a:["identificar e diagnosticar o problema","analisar as alternativas viáveis","escolher a melhor alternativa","implementar a decisão","avaliar os resultados alcançados"],c:0,e:"Definir mal o problema compromete todas as etapas seguintes: gera-se a solução certa para a questão errada. Por isso o diagnóstico vem antes da geração e avaliação de alternativas."},
{s:1,n:34,q:"Para distribuir o trabalho entre os recenseadores, o ACS recorre com frequência à delegação. Sobre delegação, é correto afirmar que:",a:["transfere a responsabilidade final pelo resultado","significa abrir mão definitivamente da autoridade","transfere autoridade para a execução, mas a responsabilidade final permanece com quem delega","é indicada apenas para tarefas irrelevantes","equivale à abdicação da função de gestor"],c:2,e:"Delegar é repassar autoridade e tarefas; a responsabilidade última pelo resultado permanece com quem delega — que deve monitorar por resultados e dar suporte."},
{s:1,n:35,q:"Uma organização utiliza a avaliação de desempenho unicamente para identificar e punir os profissionais com menores notas. Essa prática:",a:["é a finalidade correta do processo, conforme os manuais","é vedada apenas no setor privado","garante equidade, pois pune igualmente a todos","desvirtua o processo, cujo fim é subsidiar o desenvolvimento das pessoas e a melhoria dos resultados","elimina a subjetividade da avaliação"],c:3,e:"Avaliação de desempenho existe para orientar decisões sobre pessoas (feedback, treinamento, promoção, ajustes) e melhorar resultados — não para punir, o que gera medo e distorce os dados coletados."},
{s:1,n:36,q:"Situação gerencial – Um recenseador com bom histórico apresentou queda expressiva de produtividade. A atitude mais adequada do ACS é:",a:["aplicar advertência imediata, para servir de exemplo","excluir o recenseador da equipe","ignorar, pois a queda é passageira","verificar os indicadores no SIGC, conversar com o recenseador e identificar as causas antes de qualquer medida","reduzir a carga do recenseador sem comunicá-lo"],c:3,e:"Controle bem feito começa pelo diagnóstico (dados + diálogo) e só depois define a ação: a queda pode ter causa técnica, pessoal ou de saúde — punir antes de diagnosticar é erro gerencial."},
{s:1,n:37,q:"Situação gerencial – Dois recenseadores discordam sobre quem deve cobrir uma área limítrofe entre seus setores. O ACS deve:",a:["decidir sem ouvir as partes, para economizar tempo","dividir a área ao meio, ignorando os limites","sortear a área entre os dois","encaminhar o conflito ao AOR sem qualquer tratamento","ouvir as partes, verificar o mapa e o descritivo do setor e solucionar com base nos limites oficiais"],c:4,e:"A mediação com critério técnico (limites oficiais do setor, confirmados no mapa e no descritivo) resolve o conflito com imparcialidade e garante a cobertura correta — sem omissão nem sobreposição."},
{s:1,n:38,q:"Situação gerencial – Um recenseador comunica que um informante recusou a entrevista. A conduta inicial adequada do ACS é:",a:["registrar como recusa definitiva e encerrar o caso","orientar o recenseador sobre argumentos (sigilo estatístico e finalidade da pesquisa) e reagendamento; persistindo a recusa, tratá-la e intermediá-la junto ao informante","instruir o recenseador a simular os dados do estabelecimento","recomendar insistência diária até a entrevista","comunicar imediatamente às autoridades policiais"],c:1,e:"Recusa se trata com reabordagem qualificada e, se persistente, com tratamento e intermediação pela supervisão. Simular dados é fraude inadmissível; insistência diária vira assédio."},
{s:1,n:39,q:"Situação gerencial – O ACS identifica que vários recenseadores estão preenchendo incorretamente o mesmo quesito do questionário. A medida mais adequada é:",a:["corrigir manualmente cada questionário, sem comunicar ninguém","ignorar, pois o sistema corrige automaticamente","comunicar o ACR e organizar reciclagem/treinamento focado no quesito, monitorando a correção","punir os recenseadores envolvidos","solicitar a troca de todos os recenseadores"],c:2,e:"Erro simultâneo em vários agentes indica causa sistêmica (lacuna de capacitação): treinamento corretivo com foco no quesito e monitoramento posterior previnem a reincidência."},
{s:1,n:40,q:"Situação gerencial – Depois de semanas de intenso trabalho de campo, a equipe está desmotivada com um cronograma apertado. O ACS deve:",a:["ameaçar com desligamento","prometer benefícios irrealizáveis","ocultar a situação real da coleta","reconhecer esforços, redistribuir a carga conforme os dados e comunicar com transparência o estágio da operação","aumentar as metas para compensar"],c:3,e:"Reconhecimento (motivação), redistribuição equitativa (organização) e comunicação transparente (direção) sustentam o desempenho sob pressão. Ameaças e promessas vazias destroem a confiança."},
{s:1,n:41,q:"Situação gerencial – O CEQ aponta inconsistências em setores sob responsabilidade do ACS. A conduta correta é:",a:["responder ao CEQ apenas quando sobrar tempo","questionar a metodologia do CEQ","tratar as pendências com prioridade, implantar as correções e reentrevistar conforme necessário","delegar integralmente ao recenseador, sem acompanhar","aguardar o fechamento geral da coleta para corrigir"],c:2,e:"As demandas do Centro Estadual de Qualidade têm prioridade e prazo: o ACS deve responder às verificações, implantar as correções e realizar reentrevistas quando necessário."},
{s:1,n:42,q:"Situação gerencial – O ACS precisa comunicar uma instrução operacional importante à equipe. O meio mais adequado é:",a:["canal oficial e verificável, confirmando o entendimento da equipe","verbalmente a um membro, pedindo que repasse informalmente","por meio de boatos que circulam no posto","apenas fixando papel no mural, sem confirmar ciência","por rede social pessoal"],c:0,e:"Comunicação gerencial relevante exige canal formal com registro e confirmação de recebimento e compreensão (feedback) — a cadeia informal distorce a mensagem."},
{s:1,n:43,q:"O compromisso com a qualidade dos serviços prestados ao público é princípio reconhecido da administração pública. A abordagem que melhor expressa esse compromisso é:",a:["inspecionar tudo apenas ao final do processo","reduzir controles para acelerar o serviço","corrigir erros apenas quando houver reclamação","fazer certo desde a primeira vez, com prevenção e melhoria contínua","terceirizar toda a verificação de qualidade"],c:3,e:"Qualidade contemporânea foca na prevenção e na melhoria contínua do processo, e não na inspeção tardia do produto final — corrigir depois custa mais que evitar o erro."},
{s:1,n:44,q:"A operação censitária é executada por equipes dispersas em campo, sob coordenação constante. A vantagem essencial do trabalho em equipe bem coordenado é:",a:["eliminar conflitos entre os membros","reduzir a necessidade de coordenação","distribuir igualmente o desempenho individual","substituir a supervisão","a sinergia: resultados superiores à soma dos esforços individuais"],c:4,e:"Equipes coordenadas geram sinergia e complementaridade de competências. Conflitos não desaparecem — passam a ser geridos; e a coordenação continua indispensável."},
{s:1,n:45,q:"Situação gerencial – O ACS delega a organização do material de coleta a um recenseador experiente. A postura gerencial correta é:",a:["microgerenciar cada passo diariamente","acompanhar por resultados, oferecendo suporte e feedback","não verificar nada, pois a delegação é total","delegar e depois retomar a tarefa no meio, sem comunicação","delegar sem fornecer informação ou recurso algum"],c:1,e:"Delegação eficaz: autonomia com expectativas claras, controle por resultados e suporte disponível. Microgestão anula a delegação; abandono total é abdicação."},
{s:1,n:46,q:"A operação de coleta organiza-se em áreas territoriais de trabalho cuidadosamente definidas. Segundo o material do Censo, o setor censitário é:",a:["o conjunto de municípios sob responsabilidade de um ACR","o local de trabalho do AOR","a menor área geográfica definida pelo IBGE, constituindo a unidade territorial de coleta","qualquer propriedade rural cadastrada","a área urbana de alta densidade de edificações"],c:2,e:"O setor censitário é a menor área geográfica definida pelo IBGE e a unidade territorial de coleta, prioritariamente localizada em áreas rurais; os setores respeitam a divisão político-administrativa."},
{s:1,n:47,q:"O Centro Nacional de Qualidade (CNQ), vinculado à Sede do IBGE, tem como responsabilidade:",a:["monitorar a qualidade dos dados em nível estadual","gerenciar os postos censitários","supervisionar diretamente os recenseadores em campo","monitorar a qualidade dos dados coletados em âmbito nacional","realizar a coleta especial"],c:3,e:"O CNQ monitora a qualidade da coleta nacionalmente e orienta o trabalho dos Centros Estaduais de Qualidade (CEQ), vinculados às SES."},
{s:1,n:48,q:"Na estrutura censitária, quem responde diretamente pela supervisão do trabalho dos Recenseadores, incluindo o treinamento que lhes é ministrado, é:",a:["o AOR","o ACR","o ACA","o ACI","o ACS"],c:4,e:"O Agente Censitário Supervisor supervisiona o trabalho dos Recenseadores e lhes ministra o treinamento — é o elo entre a coleta e a gestão do posto."},
{s:1,n:49,q:"O universo da pesquisa do Censo Agropecuário é definido por um conceito central. Conforme o material do Censo, estabelecimento agropecuário é:",a:["toda propriedade rural com registro cartorário","apenas unidades com produção para venda","toda unidade de produção dedicada, total ou parcialmente, às atividades agropecuárias, florestais e aquícolas, independentemente de tamanho, forma jurídica ou localização","somente propriedades acima de 5 hectares","apenas unidades de povos e comunidades tradicionais"],c:2,e:"O conceito independe de tamanho, forma jurídica, valor da produção e localização (rural ou urbana); o objetivo é a produção para venda ou para subsistência."},
{s:1,n:50,q:"Antes de ir a campo, o Recenseador recebe no DMC uma lista prévia de endereços do setor. Durante a coleta, para atualizar a lista prévia de endereços no DMC, o Recenseador deve:",a:["apenas confirmar os endereços existentes","confirmar os existentes, incluir novos encontrados e excluir os não localizados em campo","incluir apenas endereços com telefone","excluir os endereços de informantes ausentes","não alterar a lista sob nenhuma hipótese"],c:1,e:"A lista prévia (endereços de pesquisas anteriores + registros administrativos) deve ser verificada e atualizada em campo: confirmar, incluir e excluir — e todos os endereços do setor devem ser visitados, estejam ou não na lista."},
{s:1,n:51,q:"A concepção do Censo Agropecuário, Florestal e Aquícola leva em conta recomendações internacionais de estatísticas agropecuárias. Segundo o material do Censo, a pesquisa considera as recomendações:",a:["do Banco Mundial e do Fundo Monetário Internacional","do Instituto Interamericano de Cooperação para a Agricultura, exclusivamente","da Organização Mundial do Comércio e do Banco Interamericano de Desenvolvimento","da Estratégia Global para o Aprimoramento das Estatísticas Agropecuárias e do Programa Mundial de Censos Agropecuários da FAO","da OCDE e da UNICEF"],c:3,e:"O material afirma que a pesquisa leva em conta as recomendações da Estratégia Global para o Aprimoramento das Estatísticas Agropecuárias e do Programa Mundial de Censos Agropecuários da FAO — a Organização das Nações Unidas para Alimentação e Agricultura."},
{s:1,n:52,q:"Para orientar o deslocamento pela área do setor, o Recenseador consulta mapas em diferentes escalas. Em um mapa com escala 1:50.000, 1 cm no mapa corresponde, no terreno, a:",a:["50 m","50 km","5 m","500 m","5.000 m"],c:3,e:"1 cm × 50.000 = 50.000 cm = 500 m. O material lembra: 3 cm (exemplo da apostila) correspondem a 1.500 m = 1,5 km."},
{s:1,n:53,q:"Sobre as coordenadas geográficas utilizadas no Censo Agropecuário, é correto afirmar que a latitude e a longitude:",a:["medem o afastamento, respectivamente, do meridiano de Greenwich e da linha do Equador","variam de 0° a 180°, podendo ser Leste ou Oeste no caso da latitude","medem o afastamento, respectivamente, da linha do Equador (0° a 90°, Norte ou Sul) e do meridiano de Greenwich (0° a 180°, Leste ou Oeste)","são medidas em quilômetros a partir do Polo Norte","dependem da escala do mapa do setor"],c:2,e:"Latitude = afastamento do Equador (0° a 90°, N/S); longitude = afastamento de Greenwich (0° a 180°, L/O). No exemplo do material, latitude -22,326 (sul do Equador) e longitude -42,669 (oeste de Greenwich)."},
